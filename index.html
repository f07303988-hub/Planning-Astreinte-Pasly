<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Astreintes — Commune de Pasly</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
<style>
  :root{
    --navy:#1B2A41;
    --stone:#EDE7D9;
    --stone-dark:#DED5BF;
    --tuile:#C1502E;
    --foret:#3F5C48;
    --ocre:#C98A3A;
    --ink:#242019;
    --white:#FFFFFF;
    --radius:3px;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--stone);
    color:var(--ink);
    font-family:'IBM Plex Sans', sans-serif;
    line-height:1.5;
  }
  h1,h2,h3{
    font-family:'Fraunces', serif;
    font-weight:600;
    margin:0 0 .4em 0;
    color:var(--navy);
  }
  header.top{
    background:var(--navy);
    color:var(--stone);
    padding:18px 20px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    flex-wrap:wrap;
    gap:8px;
  }
  header.top .brand{
    font-family:'Fraunces', serif;
    font-size:1.2rem;
    font-weight:600;
    letter-spacing:.2px;
  }
  header.top .brand span{
    display:block;
    font-family:'IBM Plex Sans', sans-serif;
    font-size:.72rem;
    font-weight:400;
    opacity:.72;
    letter-spacing:.4px;
  }
  header.top .who{
    font-size:.85rem;
    display:flex;
    align-items:center;
    gap:10px;
    flex-wrap:wrap;
  }
  header.top button{
    background:transparent;
    border:1px solid rgba(237,231,217,.4);
    color:var(--stone);
    padding:6px 12px;
    border-radius:var(--radius);
    cursor:pointer;
    font-size:.8rem;
    font-family:inherit;
  }
  header.top button:hover{background:rgba(237,231,217,.12);}

  main{
    max-width:760px;
    margin:0 auto;
    padding:24px 18px 80px;
  }

  nav.tabs{
    display:flex;
    gap:2px;
    margin-bottom:22px;
    border-bottom:1px solid var(--stone-dark);
    overflow-x:auto;
  }
  nav.tabs button{
    background:none;
    border:none;
    padding:10px 4px;
    margin-right:22px;
    font-family:'IBM Plex Sans', sans-serif;
    font-size:.92rem;
    font-weight:500;
    color:#8a8272;
    cursor:pointer;
    border-bottom:2px solid transparent;
    white-space:nowrap;
  }
  nav.tabs button.active{
    color:var(--navy);
    border-bottom:2px solid var(--tuile);
  }

  .card{
    background:var(--white);
    border:1px solid var(--stone-dark);
    border-radius:var(--radius);
    padding:18px;
    margin-bottom:14px;
  }

  .week-row{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:14px 0;
    border-bottom:1px solid var(--stone-dark);
    gap:12px;
    flex-wrap:wrap;
  }
  .week-row:last-child{border-bottom:none;}
  .week-label{font-weight:500;}
  .week-sub{font-size:.78rem;color:#8a8272;margin-top:2px;}

  .pill{
    display:inline-block;
    padding:3px 10px;
    border-radius:12px;
    font-size:.74rem;
    font-weight:500;
  }
  .pill.oui{background:#E4EBE5;color:var(--foret);}
  .pill.non{background:#F1E4E0;color:var(--tuile);}
  .pill.partiel{background:#F3E9D8;color:var(--ocre);}
  .pill.publiee{background:var(--navy);color:var(--stone);}

  select, input[type=date], input[type=email], input[type=text], input[type=password]{
    font-family:inherit;
    font-size:.88rem;
    padding:7px 9px;
    border:1px solid var(--stone-dark);
    border-radius:var(--radius);
    background:var(--white);
  }

  button.primary{
    background:var(--tuile);
    color:var(--white);
    border:none;
    padding:9px 16px;
    border-radius:var(--radius);
    font-family:inherit;
    font-size:.86rem;
    font-weight:500;
    cursor:pointer;
  }
  button.primary:hover{background:#A8431F;}
  button.primary:disabled{background:#ccc;cursor:not-allowed;}

  button.ghost{
    background:none;
    border:1px solid var(--stone-dark);
    color:var(--ink);
    padding:8px 14px;
    border-radius:var(--radius);
    font-family:inherit;
    font-size:.84rem;
    cursor:pointer;
  }
  button.ghost:hover{border-color:var(--navy);}
  button.ghost:disabled, button.primary:disabled{opacity:.6;cursor:not-allowed;}

  .empty{
    text-align:center;
    color:#8a8272;
    padding:30px 10px;
    font-size:.9rem;
  }
  .warn-text{color:var(--tuile);font-size:.78rem;margin-top:2px;}

  #login-screen{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    background:var(--navy);
    padding:20px;
  }
  #login-screen .box{
    background:var(--stone);
    padding:34px 30px;
    border-radius:var(--radius);
    max-width:360px;
    width:100%;
  }
  #login-screen .box h1{font-size:1.4rem;}
  #login-screen .box p{font-size:.86rem;color:#5a5346;}
  #login-screen input{width:100%;margin:10px 0;}
  .pw-wrap{position:relative;margin:10px 0;}
  .pw-wrap input{width:100%;margin:0;padding-right:66px;}
  .pw-toggle{
    position:absolute;right:4px;top:50%;transform:translateY(-50%);
    background:none;border:none;color:var(--navy);font-size:.74rem;
    cursor:pointer;padding:6px 8px;font-family:inherit;
  }
  #login-screen button{width:100%;margin-top:6px;}
  #login-screen .pw-toggle, #modal-content .pw-toggle{width:auto;margin-top:0;}

  .msg{font-size:.82rem;margin-top:10px;}
  .msg.ok{color:var(--foret);}
  .msg.err{color:var(--tuile);}

  table.balance{width:100%;border-collapse:collapse;font-size:.86rem;}
  table.balance th, table.balance td{
    text-align:left;
    padding:7px 4px;
    border-bottom:1px solid var(--stone-dark);
  }
  table.balance th{color:#8a8272;font-weight:500;font-size:.76rem;}

  .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;}
  .cal-head{font-size:.62rem;font-weight:600;color:#8a8272;text-align:center;padding:2px 0 6px;text-transform:uppercase;letter-spacing:.02em;}
  .cal-cell{min-height:48px;border:1px solid var(--stone-dark);border-radius:var(--radius);padding:3px 2px;font-size:.7rem;background:var(--white);display:flex;flex-direction:column;align-items:center;overflow:hidden;}
  .cal-cell.cal-empty{border-color:transparent;background:transparent;}
  .cal-day{font-weight:500;font-size:.72rem;line-height:1.3;}
  .cal-cell.cal-astreinte{background:#EDF2EE;border-color:#CFDED2;}
  .cal-cell.cal-mine{background:var(--tuile);border-color:var(--tuile);}
  .cal-cell.cal-mine .cal-day, .cal-cell.cal-mine .cal-agent{color:var(--white);}
  .cal-agent{
    font-size:.56rem;
    line-height:1.1;
    color:var(--foret);
    text-align:center;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
    width:100%;
    margin-top:1px;
  }
  .cal-nav{
    background:none;border:1px solid var(--stone-dark);color:var(--navy);
    width:32px;height:32px;border-radius:var(--radius);
    font-size:1rem;line-height:1;cursor:pointer;flex-shrink:0;
    display:flex;align-items:center;justify-content:center;
  }
  .cal-nav:hover{border-color:var(--navy);}
  .cal-legende{display:flex;gap:14px;flex-wrap:wrap;margin-top:12px;font-size:.72rem;color:#5a5346;}
  .cal-legende span{display:inline-flex;align-items:center;gap:5px;}
  .cal-legende i{width:10px;height:10px;border-radius:2px;display:inline-block;}
  @media print { .cal-cell{min-height:38px;} }

  .hidden{display:none !important;}

  .app-credit{
    text-align:center;
    font-size:.72rem;
    color:#8a8272;
    margin-top:28px;
    padding-top:14px;
    border-top:1px solid var(--stone-dark);
  }
  #login-screen .app-credit{
    border-top:none;
    margin-top:18px;
    padding-top:0;
  }
  #app-version{font-size:.68rem;opacity:.75;}
  @media print { .app-credit{display:none;} }

  /* Toasts */
  #toast-wrap{
    position:fixed;
    bottom:16px;
    left:50%;
    transform:translateX(-50%);
    display:flex;
    flex-direction:column;
    gap:8px;
    z-index:1000;
    width:calc(100% - 32px);
    max-width:420px;
  }
  .toast{
    padding:11px 16px;
    border-radius:var(--radius);
    font-size:.84rem;
    color:var(--white);
    box-shadow:0 3px 10px rgba(0,0,0,.18);
  }
  .toast.info{background:var(--navy);}
  .toast.success{background:var(--foret);}
  .toast.error{background:var(--tuile);}

  /* Modal */
  #modal-backdrop{
    position:fixed;
    inset:0;
    background:rgba(27,42,65,.55);
    display:flex;
    align-items:center;
    justify-content:center;
    z-index:900;
    padding:20px;
  }
  #modal-content{
    background:var(--white);
    border-radius:var(--radius);
    padding:22px;
    max-width:360px;
    width:100%;
  }
  #modal-content h3{margin-bottom:10px;}
  #modal-content input{width:100%;margin-bottom:10px;}
  #modal-content .pw-wrap{margin-bottom:10px;}
  #modal-content .pw-wrap input{margin-bottom:0;}
  #modal-content .modal-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:8px;}

  .print-only{display:none;}
  @media print {
    header.top, nav.tabs, #toast-wrap, #modal-backdrop, button, select, input, .msg { display:none !important; }
    .print-only{display:inline !important;}
    main{padding:0;max-width:100%;}
    .card{border:none;box-shadow:none;page-break-inside:avoid;}
    body{background:var(--white);}
  }
</style>
</head>
<body>

<div id="login-screen">
  <div class="box">
    <h1>Astreintes<br>Commune de Pasly</h1>
    <p>Connectez-vous avec l'adresse email associée à votre compte élu. Un lien de connexion vous sera envoyé, ou utilisez votre mot de passe si vous en avez déjà défini un.</p>
    <input type="email" id="login-email" placeholder="votre.email@exemple.fr" autocomplete="email">
    <div class="pw-wrap">
      <input type="password" id="login-password" placeholder="Mot de passe (facultatif)" autocomplete="current-password">
      <button type="button" class="pw-toggle" data-target="login-password">Afficher</button>
    </div>
    <button class="primary" id="login-btn">Se connecter / Recevoir le lien</button>
    <div class="msg" id="login-msg"></div>
    <div class="app-credit">Développé par François Liéveaux<br><span id="app-version"></span></div>
  </div>
</div>

<div id="app" class="hidden">
  <header class="top">
    <div class="brand">Astreintes<span>Commune de Pasly</span></div>
    <div class="who">
      <span id="who-name"></span>
      <button id="set-password-btn">Mot de passe</button>
      <button id="logout-btn">Déconnexion</button>
    </div>
  </header>

  <main>
    <nav class="tabs" id="tabs"></nav>
    <div id="view"></div>
    <footer class="app-credit">Développé par François Liéveaux</footer>
  </main>
</div>

<div id="toast-wrap"></div>
<div id="modal-backdrop" class="hidden">
  <div id="modal-content"></div>
</div>

<script>
// =========================================================
// CONFIGURATION — vos clés (inchangées)
// =========================================================
const SUPABASE_URL = "https://ayfwjgzdspjkmmurefge.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_ohyUYzHMz4ARxvVhpFwdsQ_pT9XzfeX";
const EMAILJS_PUBLIC_KEY = "bvTa8FUhj5JomRvGS";
const EMAILJS_SERVICE_ID = "service_sfgxgtq";
const EMAILJS_TEMPLATE_ID = "template_4jh4miq";
// Facultatif : template EmailJS dédié à la relance des non-répondants
// (texte différent : "merci de déclarer votre disponibilité..." plutôt
// que "vous êtes désigné..."). Tant qu'il n'est pas configuré, le
// bouton de relance l'indique clairement plutôt que d'échouer en silence.
const EMAILJS_TEMPLATE_RAPPEL_ID = "template_pdqi22m";

// Numéro de version affiché sur l'écran de connexion — à incrémenter
// manuellement à chaque mise à jour notable du fichier.
const APP_VERSION = "1.0.0";
document.getElementById('app-version').textContent = `v${APP_VERSION}`;

const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
if (window.emailjs) emailjs.init(EMAILJS_PUBLIC_KEY);

let state = {
  session: null,
  agent: null,      // ligne agents correspondant à l'utilisateur connecté
  isAdmin: false,
  tab: 'dispos',
  showPasseesAgent: false,
  showHistoriqueAdmin: false,
  planningVue: 'liste', // 'liste' | 'calendrier'
  calYear: new Date().getFullYear(),
  calMonth: new Date().getMonth() // 0 = janvier
};

// =========================================================
// UTILITAIRES GÉNÉRAUX
// =========================================================

// Échappe toute donnée dynamique avant insertion dans innerHTML.
// Appliqué systématiquement à tout ce qui provient de Supabase
// (noms, téléphones, statuts...) pour empêcher une injection HTML/XSS.
function escapeHTML(str){
  if (str === null || str === undefined) return '';
  return String(str).replace(/[&<>"']/g, c => ({
    '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;'
  }[c]));
}

function showToast(message, type){
  type = type || 'info';
  const wrap = document.getElementById('toast-wrap');
  const t = document.createElement('div');
  t.className = 'toast ' + type;
  t.textContent = message;
  wrap.appendChild(t);
  setTimeout(() => t.remove(), 4200);
}

function openModal(html){
  document.getElementById('modal-content').innerHTML = html;
  document.getElementById('modal-backdrop').classList.remove('hidden');
}
function closeModal(){
  document.getElementById('modal-backdrop').classList.add('hidden');
  document.getElementById('modal-content').innerHTML = '';
}
document.getElementById('modal-backdrop').addEventListener('click', (e) => {
  if (e.target.id === 'modal-backdrop') closeModal();
});

// Bouton "Afficher / Masquer" pour tous les champs mot de passe, présents
// et futurs (délégation d'événements, car certains sont injectés dans la modale).
document.addEventListener('click', (e) => {
  const btn = e.target.closest('.pw-toggle');
  if (!btn) return;
  const input = document.getElementById(btn.dataset.target);
  if (!input) return;
  const masque = input.type === 'password';
  input.type = masque ? 'text' : 'password';
  btn.textContent = masque ? 'Masquer' : 'Afficher';
});

// Désactive un bouton et change son texte le temps d'une opération,
// puis le restaure systématiquement (même en cas d'erreur), pour
// éviter les doubles clics et informer l'utilisateur de l'attente.
async function withLoading(btn, loadingLabel, fn){
  if (!btn) return fn();
  const original = btn.textContent;
  btn.disabled = true;
  btn.textContent = loadingLabel;
  try {
    return await fn();
  } finally {
    btn.disabled = false;
    btn.textContent = original;
  }
}

// Enveloppe un appel Supabase : vérifie systématiquement `error`,
// affiche un toast clair en cas d'échec (réseau ou métier), et ne
// laisse jamais une opération échouée passer pour une réussite.
async function sbCall(promiseFn, errCtx){
  try {
    const result = await promiseFn();
    if (result && result.error) {
      showToast((errCtx ? errCtx + ' : ' : '') + result.error.message, 'error');
      return { data: null, error: result.error };
    }
    return { data: result ? result.data : null, error: null };
  } catch (e) {
    showToast((errCtx ? errCtx + ' : ' : '') + (e && e.message ? e.message : 'Erreur réseau'), 'error');
    return { data: null, error: e };
  }
}

function formatDateFR(d){
  const dt = new Date(d + 'T00:00:00');
  return dt.toLocaleDateString('fr-FR', {day:'2-digit', month:'2-digit'});
}
// Format sans caractère "/" pour les emails : EmailJS échappe automatiquement
// le "/" en "&#x2F;" (protection HTML), ce qui s'affichait en clair dans le
// sujet des emails. On utilise donc un format textuel ("14 septembre") pour
// tout ce qui part par email.
function formatDateEmail(d){
  const dt = new Date(d + 'T00:00:00');
  return dt.toLocaleDateString('fr-FR', {day:'2-digit', month:'long'});
}
// Formate un objet Date en 'YYYY-MM-DD' à partir de ses composantes LOCALES
// (et non UTC comme le ferait toISOString(), qui peut faire glisser la date
// d'un jour selon le fuseau horaire et l'heure d'été/hiver du navigateur).
function toISODate(date){
  const y = date.getFullYear();
  const m = String(date.getMonth() + 1).padStart(2, '0');
  const d = String(date.getDate()).padStart(2, '0');
  return `${y}-${m}-${d}`;
}
function weekLabel(s){
  return `Semaine du ${formatDateFR(s.date_debut)} au ${formatDateFR(s.date_fin)}`;
}

function monthLabelFR(year, month){
  return new Date(year, month, 1).toLocaleDateString('fr-FR', { month: 'long', year: 'numeric' });
}

// Construit la grille HTML d'un calendrier mensuel : chaque jour appartenant
// à une semaine d'astreinte publiée est mis en évidence avec le nom de
// l'agent assigné. meId (facultatif) surligne différemment ses propres jours.
function renderMonthCalendarHTML(semainesPubliees, planByWeek, agentById, meId){
  const year = state.calYear, month = state.calMonth;
  const first = new Date(year, month, 1);
  const startDay = (first.getDay() + 6) % 7; // 0 = lundi
  const daysInMonth = new Date(year, month + 1, 0).getDate();
  const joursLabels = ['L','M','M','J','V','S','D'];
  const moisDebut = toISODate(new Date(year, month, 1));
  const moisFin = toISODate(new Date(year, month + 1, 0));

  function trouverSemaine(dateObj){
    const iso = toISODate(dateObj);
    return semainesPubliees.find(s => iso >= s.date_debut && iso <= s.date_fin);
  }
  // N'affiche que le nom de famille dans les petites cellules (le détail
  // complet, avec prénom, apparaît dans la légende sous le calendrier).
  function nomCourt(agent){
    return (agent.nom || '').split(' ')[0];
  }

  let cellsHTML = joursLabels.map(j => `<div class="cal-head">${j}</div>`).join('');
  for (let i = 0; i < startDay; i++) cellsHTML += `<div class="cal-cell cal-empty"></div>`;
  for (let d = 1; d <= daysInMonth; d++){
    const date = new Date(year, month, d);
    const s = trouverSemaine(date);
    const p = s ? planByWeek[s.id] : null;
    const agent = p ? agentById[p.agent_id] : null;
    const mine = agent && meId && agent.id === meId;
    cellsHTML += `<div class="cal-cell ${agent ? 'cal-astreinte' : ''} ${mine ? 'cal-mine' : ''}">
      <div class="cal-day">${d}</div>
      ${agent ? `<div class="cal-agent">${escapeHTML(nomCourt(agent))}</div>` : ''}
    </div>`;
  }
  const totalCells = startDay + daysInMonth;
  const reste = (7 - (totalCells % 7)) % 7;
  for (let i = 0; i < reste; i++) cellsHTML += `<div class="cal-cell cal-empty"></div>`;

  // Légende : détail complet (nom + semaine) des astreintes du mois affiché.
  const semainesDuMois = semainesPubliees
    .filter(s => s.date_debut <= moisFin && s.date_fin >= moisDebut)
    .sort((a,b) => a.date_debut < b.date_debut ? -1 : 1);
  const legendeHTML = semainesDuMois.length ? `
    <div class="cal-legende" style="flex-direction:column;gap:6px;">
      ${semainesDuMois.map(s => {
        const p = planByWeek[s.id];
        const agent = p ? agentById[p.agent_id] : null;
        return `<span><i style="background:${agent && meId && agent.id===meId ? 'var(--tuile)' : '#CFDED2'};"></i>${escapeHTML(weekLabel(s))} — ${agent ? escapeHTML(agent.nom) : 'non assigné'}</span>`;
      }).join('')}
    </div>` : '';

  return `
    <div class="card">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;gap:8px;">
        <button class="cal-nav" id="cal-prev" aria-label="Mois précédent">‹</button>
        <h3 style="margin:0;text-transform:capitalize;font-size:1.05rem;text-align:center;">${escapeHTML(monthLabelFR(year, month))}</h3>
        <button class="cal-nav" id="cal-next" aria-label="Mois suivant">›</button>
      </div>
      <div class="cal-grid">${cellsHTML}</div>
      ${legendeHTML}
    </div>`;
}

function brancherNavigationCalendrier(view){
  const prev = document.getElementById('cal-prev');
  const next = document.getElementById('cal-next');
  if (prev) prev.addEventListener('click', () => {
    state.calMonth--; if (state.calMonth < 0) { state.calMonth = 11; state.calYear--; }
    renderView();
  });
  if (next) next.addEventListener('click', () => {
    state.calMonth++; if (state.calMonth > 11) { state.calMonth = 0; state.calYear++; }
    renderView();
  });
}
async function fetchAgents(){
  const { data, error } = await sb.from('agents').select('*').eq('actif', true).order('nom');
  if (error) { showToast('Impossible de charger la liste des agents : ' + error.message, 'error'); return []; }
  return data || [];
}
async function sendPublishEmail(agent, semaine){
  if (!window.emailjs || !EMAILJS_SERVICE_ID || EMAILJS_SERVICE_ID.startsWith('VOTRE_')) {
    return { ok: false, reason: 'non_configure' };
  }
  try {
    await emailjs.send(EMAILJS_SERVICE_ID, EMAILJS_TEMPLATE_ID, {
      to_email: agent.email,
      to_name: agent.nom,
      semaine: `semaine du ${formatDateEmail(semaine.date_debut)} au ${formatDateEmail(semaine.date_fin)}`,
      date_debut: formatDateEmail(semaine.date_debut),
      date_fin: formatDateEmail(semaine.date_fin)
    });
    return { ok: true };
  } catch(e){
    console.error('Email non envoyé', e);
    return { ok: false, reason: 'echec', detail: e };
  }
}

// Email de relance pour un agent n'ayant pas encore déclaré sa
// disponibilité. Nécessite un second template EmailJS (voir SETUP) —
// tant qu'il n'est pas configuré, on le signale clairement plutôt
// que de tenter un envoi voué à l'échec ou d'envoyer le mauvais texte.
async function sendReminderEmail(agent, semaine){
  if (!window.emailjs || !EMAILJS_TEMPLATE_RAPPEL_ID || EMAILJS_TEMPLATE_RAPPEL_ID.startsWith('VOTRE_')) {
    return { ok: false, reason: 'non_configure' };
  }
  try {
    await emailjs.send(EMAILJS_SERVICE_ID, EMAILJS_TEMPLATE_RAPPEL_ID, {
      to_email: agent.email,
      to_name: agent.nom,
      semaine: `semaine du ${formatDateEmail(semaine.date_debut)} au ${formatDateEmail(semaine.date_fin)}`,
      date_limite: formatDateEmail(semaine.date_limite_dispo)
    });
    return { ok: true };
  } catch(e){
    console.error('Rappel non envoyé', e);
    return { ok: false, reason: 'echec', detail: e };
  }
}

// =========================================================
// DÉCONNEXION AUTOMATIQUE APRÈS INACTIVITÉ
// Supabase ne propose cette limite que sur ses offres payantes ;
// on la reproduit ici côté appli, en surveillant l'activité de
// la personne (clic, défilement, saisie) pendant qu'elle est connectée.
// =========================================================
const INACTIVITE_LIMITE_MS = 15 * 60 * 1000; // 15 minutes
let inactiviteTimer = null;

function demarrerSurveillanceInactivite(){
  clearTimeout(inactiviteTimer);
  inactiviteTimer = setTimeout(async () => {
    if (!state.session) return;
    await sb.auth.signOut();
    showToast('Déconnecté après 15 minutes d\'inactivité.', 'info');
  }, INACTIVITE_LIMITE_MS);
}
function arreterSurveillanceInactivite(){
  clearTimeout(inactiviteTimer);
  inactiviteTimer = null;
}
['click', 'touchstart', 'keydown', 'scroll'].forEach(evt => {
  document.addEventListener(evt, () => { if (state.session) demarrerSurveillanceInactivite(); }, { passive: true });
});

document.getElementById('set-password-btn').addEventListener('click', () => {
  openModal(`
    <h3>Définir un mot de passe</h3>
    <p class="week-sub" style="margin-bottom:10px;">8 caractères minimum, avec au moins une majuscule et un chiffre.</p>
    <div class="pw-wrap">
      <input type="password" id="modal-pw1" placeholder="Nouveau mot de passe" autocomplete="new-password">
      <button type="button" class="pw-toggle" data-target="modal-pw1">Afficher</button>
    </div>
    <div class="pw-wrap">
      <input type="password" id="modal-pw2" placeholder="Confirmer le mot de passe" autocomplete="new-password">
      <button type="button" class="pw-toggle" data-target="modal-pw2">Afficher</button>
    </div>
    <div class="msg" id="modal-msg"></div>
    <div class="modal-actions">
      <button class="ghost" id="modal-cancel">Annuler</button>
      <button class="primary" id="modal-confirm">Valider</button>
    </div>
  `);
  document.getElementById('modal-cancel').addEventListener('click', closeModal);
  document.getElementById('modal-confirm').addEventListener('click', async (e) => {
    const pw1 = document.getElementById('modal-pw1').value;
    const pw2 = document.getElementById('modal-pw2').value;
    const mmsg = document.getElementById('modal-msg');
    const assezLong = pw1.length >= 8;
    const aMajuscule = /[A-Z]/.test(pw1);
    const aChiffre = /[0-9]/.test(pw1);
    if (!assezLong || !aMajuscule || !aChiffre) {
      mmsg.textContent = 'Le mot de passe doit faire au moins 8 caractères, avec une majuscule et un chiffre.';
      mmsg.className = 'msg err';
      return;
    }
    if (pw1 !== pw2) {
      mmsg.textContent = 'Les deux mots de passe ne correspondent pas.';
      mmsg.className = 'msg err';
      return;
    }
    await withLoading(e.currentTarget, 'Enregistrement…', async () => {
      const { error } = await sb.auth.updateUser({ password: pw1 });
      if (error) { mmsg.textContent = 'Erreur : ' + error.message; mmsg.className = 'msg err'; return; }
      closeModal();
      showToast('Mot de passe défini. Vous pourrez désormais l\'utiliser pour vous connecter.', 'success');
    });
  });
});

async function initAuth(){
  let session;
  try {
    const res = await sb.auth.getSession();
    session = res.data.session;
  } catch (e) {
    showToast('Erreur réseau : impossible de vérifier votre connexion.', 'error');
    showLogin();
    return;
  }
  state.session = session;
  if (!session) { showLogin(); return; }

  const { data: agent, error } = await sb.from('agents').select('*').ilike('email', session.user.email).maybeSingle();
  if (error) {
    document.getElementById('login-msg').textContent = "Erreur réseau, réessayez dans un instant.";
    document.getElementById('login-msg').className = "msg err";
    showLogin();
    return;
  }
  if (!agent) {
    document.getElementById('login-msg').textContent = "Votre email n'est pas enregistré comme agent. Contactez l'administrateur.";
    document.getElementById('login-msg').className = "msg err";
    await sb.auth.signOut();
    showLogin();
    return;
  }
  if (!agent.actif) {
    document.getElementById('login-msg').textContent = "Votre compte a été désactivé. Contactez l'administrateur.";
    document.getElementById('login-msg').className = "msg err";
    await sb.auth.signOut();
    showLogin();
    return;
  }
  state.agent = agent;
  state.isAdmin = agent.role === 'admin';
  showApp();
}

sb.auth.onAuthStateChange((event) => {
  if (event === 'SIGNED_IN') initAuth();
  if (event === 'SIGNED_OUT') showLogin();
});

function showLogin(){
  document.getElementById('login-screen').classList.remove('hidden');
  document.getElementById('app').classList.add('hidden');
  arreterSurveillanceInactivite();
}

function showApp(){
  document.getElementById('login-screen').classList.add('hidden');
  document.getElementById('app').classList.remove('hidden');
  const suffixe = state.isAdmin ? " · Admin" : (state.agent.role === 'lecteur' ? " · Lecture seule" : "");
  document.getElementById('who-name').textContent = state.agent.nom + suffixe;
  state.tab = state.agent.role === 'lecteur' ? 'planning' : 'dispos';
  renderTabs();
  renderView();
  demarrerSurveillanceInactivite();
}

function renderTabs(){
  const tabs = state.isAdmin
    ? [['dispos','Mes disponibilités'],['admin-planning','Planning'],['admin-semaines','Semaines'],['admin-echanges','Échanges'],['admin-agents','Agents']]
    : state.agent.role === 'lecteur'
      ? [['planning','Planning']]
      : [['dispos','Mes disponibilités'],['planning','Planning'],['echanges','Échanges']];
  const nav = document.getElementById('tabs');
  nav.innerHTML = '';
  tabs.forEach(([id,label]) => {
    const b = document.createElement('button');
    b.textContent = label;
    b.className = state.tab === id ? 'active' : '';
    b.addEventListener('click', () => { state.tab = id; renderTabs(); renderView(); });
    nav.appendChild(b);
  });
}

function renderView(){
  const view = document.getElementById('view');
  view.innerHTML = '<div class="empty">Chargement…</div>';
  // Garde-fou : un compte lecture seule ne doit jamais afficher autre chose que le planning,
  // même si l'état interne se retrouvait sur un autre onglet.
  if (!state.isAdmin && state.agent.role === 'lecteur' && state.tab !== 'planning') state.tab = 'planning';
  const routes = {
    'dispos': renderDispos,
    'planning': renderPlanningAgent,
    'echanges': renderEchangesAgent,
    'admin-planning': renderPlanningAdmin,
    'admin-semaines': renderSemainesAdmin,
    'admin-echanges': renderEchangesAdmin,
    'admin-agents': renderAgentsAdmin
  };
  (routes[state.tab] || renderDispos)(view).catch(err => {
    console.error(err);
    view.innerHTML = '<div class="card"><div class="empty">Erreur de chargement. Rechargez la page.</div></div>';
  });
}

// =========================================================
// VUE : MES DISPONIBILITÉS (agent)
// L'astreinte est hebdomadaire : disponible ou non pour la semaine
// entière (plus de nuance par jour).
// =========================================================
async function renderDispos(view){
  const exempte = state.agent.eligible_astreinte === false;
  const today = toISODate(new Date());
  const { data: periodes } = await sb.from('indisponibilites_periodes').select('*').eq('agent_id', state.agent.id).order('date_debut');

  const periodesHTML = `
    <div class="card">
      <h3>Périodes d'indisponibilité (vacances)</h3>
      <div class="week-sub" style="margin-bottom:10px;">${exempte
        ? "Vous êtes exempté des astreintes : ces périodes sont enregistrées à titre d'information uniquement, elles n'affectent aucun planning."
        : "Déclarer une période marque automatiquement indisponibles toutes les semaines déjà ouvertes qui la recoupent, sans avoir à les décocher une par une."}</div>
      ${(periodes||[]).map(p => `
        <div class="week-row">
          <div>
            <div class="week-label">${escapeHTML(formatDateFR(p.date_debut))} au ${escapeHTML(formatDateFR(p.date_fin))}</div>
            ${p.motif ? `<div class="week-sub">${escapeHTML(p.motif)}</div>` : ''}
          </div>
          <button class="ghost" data-role="suppr-periode" data-id="${escapeHTML(p.id)}">Supprimer</button>
        </div>`).join('')}
      <div style="display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;margin-top:10px;">
        <div><div class="week-sub">Du</div><input type="date" id="periode-agent-debut"></div>
        <div><div class="week-sub">Au</div><input type="date" id="periode-agent-fin"></div>
        <div><div class="week-sub">Motif (facultatif)</div><input type="text" id="periode-agent-motif" placeholder="Vacances…"></div>
        <button class="primary" id="btn-periode-agent">Ajouter</button>
      </div>
      <div class="msg" id="periode-agent-msg"></div>
    </div>`;

  let semaines = null, mesDispos = null, dispoMap = {}, prochaineHTML = '', dispoHTML = '';

  if (exempte) {
    dispoHTML = '<div class="card"><h3>Astreintes</h3><div class="empty">Vous êtes exempté des astreintes par l\'administrateur — aucune disponibilité à déclarer.</div></div>';
  } else {
    const { data: sem, error: e1 } = await sb.from('semaines').select('*').eq('statut','ouverte').gte('date_limite_dispo', today).order('date_debut');
    if (e1) { view.innerHTML = '<div class="card"><div class="empty">Erreur de chargement des semaines.</div></div>'; return; }
    semaines = sem;
    const { data: md, error: e2 } = await sb.from('disponibilites').select('*').eq('agent_id', state.agent.id);
    if (e2) { view.innerHTML = '<div class="card"><div class="empty">Erreur de chargement de vos disponibilités.</div></div>'; return; }
    mesDispos = md;
    const { data: mesAstreintes } = await sb.from('planning').select('*, semaines(*)').eq('agent_id', state.agent.id);
    (mesDispos||[]).forEach(d => dispoMap[d.semaine_id] = d);

    // Prochaine astreinte à venir, mise en avant en haut de l'écran.
    const prochaines = (mesAstreintes||[])
      .filter(p => p.semaines && p.semaines.date_fin >= today)
      .sort((a,b) => a.semaines.date_debut < b.semaines.date_debut ? -1 : 1);
    prochaineHTML = prochaines.length
      ? `<div class="card"><h3 style="margin-bottom:4px;">Votre prochaine astreinte</h3><div class="week-label">${escapeHTML(weekLabel(prochaines[0].semaines))}</div></div>`
      : '';

    dispoHTML = (!semaines || semaines.length === 0)
      ? '<div class="card"><div class="empty">Aucune semaine ouverte à la déclaration pour le moment.</div></div>'
      : `<div class="card"><h3>Vos disponibilités</h3>` + semaines.map(s => {
          const d = mesDispos ? dispoMap[s.id] : null;
          // Compatibilité : une éventuelle ancienne valeur 'partiel' est traitée comme 'oui'.
          const niveau = d ? (d.niveau === 'partiel' ? 'oui' : d.niveau) : 'non';
          const priorite = d ? d.priorite : 2;
          return `
          <div class="week-row" data-semaine="${escapeHTML(s.id)}">
            <div style="flex:1;min-width:220px;">
              <div class="week-label">${escapeHTML(weekLabel(s))}</div>
              <div class="week-sub">Limite de réponse : ${escapeHTML(formatDateFR(s.date_limite_dispo))}</div>
            </div>
            <div style="display:flex;flex-direction:column;gap:6px;align-items:flex-end;">
              <select data-role="niveau">
                <option value="non" ${niveau==='non'?'selected':''}>Indisponible</option>
                <option value="oui" ${niveau==='oui'?'selected':''}>Disponible cette semaine</option>
              </select>
              <select data-role="priorite">
                <option value="1" ${priorite==1?'selected':''}>Priorité haute (je préfère cette semaine)</option>
                <option value="2" ${priorite==2?'selected':''}>Priorité normale</option>
                <option value="3" ${priorite==3?'selected':''}>Priorité basse (en dernier recours)</option>
              </select>
              <button class="ghost" data-role="save">Enregistrer</button>
            </div>
          </div>`;
        }).join('') + `</div>`;
  }

  view.innerHTML = prochaineHTML + periodesHTML + dispoHTML;

  view.querySelectorAll('.week-row[data-semaine]').forEach(row => {
    const semaineId = row.dataset.semaine;
    row.querySelector('[data-role=save]').addEventListener('click', async (e) => {
      const niveau = row.querySelector('[data-role=niveau]').value;
      const priorite = parseInt(row.querySelector('[data-role=priorite]').value, 10);
      await withLoading(e.currentTarget, 'Enregistrement…', async () => {
        const payload = {
          semaine_id: semaineId,
          agent_id: state.agent.id,
          niveau,
          jours: [],
          priorite
        };
        const { error } = await sb.from('disponibilites').upsert(payload, { onConflict: 'semaine_id,agent_id' });
        if (error) { showToast('Erreur : ' + error.message, 'error'); return; }
        showToast('Disponibilité enregistrée.', 'success');
      });
    });
  });

  const btnPeriode = document.getElementById('btn-periode-agent');
  if (btnPeriode) btnPeriode.addEventListener('click', async (e) => {
    const debut = document.getElementById('periode-agent-debut').value;
    const fin = document.getElementById('periode-agent-fin').value;
    const motif = document.getElementById('periode-agent-motif').value.trim();
    const pmsg = document.getElementById('periode-agent-msg');
    pmsg.textContent = ''; pmsg.className = 'msg';
    if (!debut || !fin) { pmsg.textContent = 'Renseignez les deux dates.'; pmsg.className = 'msg err'; return; }
    if (fin < debut) { pmsg.textContent = 'La date de fin doit être après le début.'; pmsg.className = 'msg err'; return; }

    await withLoading(e.currentTarget, 'Ajout…', async () => {
      const { error } = await sb.from('indisponibilites_periodes').insert({ agent_id: state.agent.id, date_debut: debut, date_fin: fin, motif: motif || null });
      if (error) { pmsg.textContent = 'Erreur : ' + error.message; pmsg.className = 'msg err'; return; }

      // Marque automatiquement indisponibles les semaines déjà ouvertes qui recoupent la période.
      const chevauchantes = (semaines||[]).filter(s => s.date_debut <= fin && s.date_fin >= debut);
      let marquees = 0;
      for (const s of chevauchantes) {
        const { error: errDispo } = await sb.from('disponibilites').upsert(
          { semaine_id: s.id, agent_id: state.agent.id, niveau: 'non', jours: [], priorite: 2 },
          { onConflict: 'semaine_id,agent_id' }
        );
        if (!errDispo) marquees++;
      }
      showToast('Période ajoutée' + (marquees ? ' — ' + marquees + ' semaine(s) marquée(s) indisponible(s).' : '.'), 'success');
      renderView();
    });
  });

  view.querySelectorAll('[data-role=suppr-periode]').forEach(btn => {
    btn.addEventListener('click', async (e) => {
      if (!confirm('Supprimer cette période ? (Les disponibilités déjà mises à jour ne seront pas ré-ouvertes automatiquement.)')) return;
      await withLoading(e.currentTarget, 'Suppression…', async () => {
        const { error } = await sb.from('indisponibilites_periodes').delete().eq('id', btn.dataset.id);
        if (error) { showToast('Erreur : ' + error.message, 'error'); return; }
        showToast('Période supprimée.', 'success');
        renderView();
      });
    });
  });
}

// =========================================================
// VUE : PLANNING (agent) — consultation + demande d'échange
// L'échange se fait via un menu déroulant (plus de prompt()),
// et la demande passe par la fonction serveur demander_echange
// qui revérifie tout (titulaire réel, agent cible actif, etc.)
// =========================================================
async function renderPlanningAgent(view){
  const { data: semainesToutes, error: e1 } = await sb.from('semaines').select('*').eq('statut','publiee').order('date_debut');
  if (e1) { view.innerHTML = '<div class="card"><div class="empty">Erreur de chargement du planning.</div></div>'; return; }
  const { data: plannings } = await sb.from('planning').select('*');
  const agents = await fetchAgents();
  const agentById = Object.fromEntries(agents.map(a => [a.id, a]));
  const planByWeek = Object.fromEntries((plannings||[]).map(p => [p.semaine_id, p]));

  const today = toISODate(new Date());
  const passees = (semainesToutes||[]).filter(s => s.date_fin < today);
  const semaines = state.showPasseesAgent ? (semainesToutes||[]) : (semainesToutes||[]).filter(s => s.date_fin >= today);

  if (!semainesToutes || semainesToutes.length === 0){
    view.innerHTML = '<div class="card"><div class="empty">Aucun planning publié pour le moment.</div></div>';
    return;
  }

  const entete = `
    <div class="card" style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;">
      <h3 style="margin:0;">Planning publié</h3>
      <div style="display:flex;gap:8px;flex-wrap:wrap;">
        <button class="ghost" id="btn-toggle-vue">${state.planningVue === 'liste' ? 'Vue calendrier' : 'Vue liste'}</button>
        ${state.planningVue === 'liste' && passees.length ? `<button class="ghost" id="btn-toggle-passe">${state.showPasseesAgent ? 'Masquer les semaines passées' : 'Afficher aussi les semaines passées (' + passees.length + ')'}</button>` : ''}
        <button class="ghost" id="btn-imprimer">Imprimer / PDF</button>
      </div>
    </div>`;

  if (state.planningVue === 'calendrier') {
    view.innerHTML = entete + renderMonthCalendarHTML(semainesToutes, planByWeek, agentById, state.agent.id);
    document.getElementById('btn-toggle-vue').addEventListener('click', () => { state.planningVue = 'liste'; renderView(); });
    document.getElementById('btn-imprimer').addEventListener('click', () => window.print());
    brancherNavigationCalendrier(view);
    return;
  }

  view.innerHTML = entete + `<div class="card">` + (semaines.length === 0
    ? '<div class="empty">Aucune semaine à venir publiée.</div>'
    : semaines.map(s => {
    const p = planByWeek[s.id];
    const agent = p ? agentById[p.agent_id] : null;
    const mine = agent && agent.id === state.agent.id;
    const autres = agents.filter(a => a.id !== state.agent.id && a.eligible_astreinte !== false && a.role !== 'lecteur');
    return `
    <div class="week-row">
      <div>
        <div class="week-label">${escapeHTML(weekLabel(s))} ${mine ? '<span class="pill publiee">Vous</span>' : ''}</div>
        <div class="week-sub">${agent ? escapeHTML(agent.nom) + ' · ' + escapeHTML(agent.telephone||'') : 'Non assigné'}</div>
      </div>
      ${mine ? `
        <div style="display:flex;gap:6px;flex-wrap:wrap;align-items:center;" data-semaine="${escapeHTML(s.id)}">
          <select data-role="echange-cible">
            <option value="">Échanger avec…</option>
            ${autres.map(a => `<option value="${escapeHTML(a.id)}">${escapeHTML(a.nom)}</option>`).join('')}
          </select>
          <button class="ghost" data-role="echange-btn">Proposer</button>
        </div>` : ''}
    </div>`;
  }).join('')) + `</div>`;

  document.getElementById('btn-toggle-vue').addEventListener('click', () => { state.planningVue = 'calendrier'; renderView(); });

  const btnToggle = document.getElementById('btn-toggle-passe');
  if (btnToggle) btnToggle.addEventListener('click', () => { state.showPasseesAgent = !state.showPasseesAgent; renderView(); });

  document.getElementById('btn-imprimer').addEventListener('click', () => window.print());

  view.querySelectorAll('[data-role=echange-btn]').forEach(btn => {
    btn.addEventListener('click', async (e) => {
      const wrap = btn.closest('[data-semaine]');
      const semaineId = wrap.dataset.semaine;
      const cibleId = wrap.querySelector('[data-role=echange-cible]').value;
      if (!cibleId) { showToast('Choisissez d\'abord un agent.', 'error'); return; }
      await withLoading(e.currentTarget, 'Envoi…', async () => {
        const { error } = await sb.rpc('demander_echange', { p_semaine_id: semaineId, p_agent_cible_id: cibleId });
        if (error) { showToast('Erreur : ' + error.message, 'error'); return; }
        showToast('Demande d\'échange envoyée.', 'success');
        renderView();
      });
    });
  });
}

// =========================================================
// VUE : ÉCHANGES (agent) — répondre aux demandes qui le concernent
// Accepter/refuser passe par les fonctions serveur dédiées, qui
// revalident tout avant d'agir (plus de mise à jour directe).
// =========================================================
async function renderEchangesAgent(view){
  const { data: echanges, error } = await sb.from('echanges').select('*, semaines(*)').or(`agent_demandeur_id.eq.${state.agent.id},agent_cible_id.eq.${state.agent.id}`).order('created_at', { ascending:false });
  if (error) { view.innerHTML = '<div class="card"><div class="empty">Erreur de chargement des échanges.</div></div>'; return; }
  const agents = await fetchAgents();
  const agentById = Object.fromEntries(agents.map(a => [a.id, a]));

  if (!echanges || echanges.length === 0){

// VUE ADMIN : PLANNING — générer, ajuster, publier
// =========================================================
async function renderPlanningAdmin(view){
  const { data: semainesToutes, error } = await sb.from('semaines').select('*').order('date_debut');
  if (error) { view.innerHTML = '<div class="card"><div class="empty">Erreur de chargement des semaines.</div></div>'; return; }
  const { data: dispos } = await sb.from('disponibilites').select('*');
  const { data: plannings } = await sb.from('planning').select('*');
  const agents = await fetchAgents();
  const agentById = Object.fromEntries(agents.map(a => [a.id, a]));
  const planByWeek = Object.fromEntries((plannings||[]).map(p => [p.semaine_id, p]));
  const dispoBySemaine = {};
  (dispos||[]).forEach(d => { (dispoBySemaine[d.semaine_id] ||= []).push(d); });

  if (!semainesToutes || semainesToutes.length === 0){
    view.innerHTML = '<div class="card"><div class="empty">Aucune semaine créée. Allez dans l\'onglet « Semaines ».</div></div>';
    return;
  }

  const today = toISODate(new Date());
  const dansSeptJours = new Date(); dansSeptJours.setDate(dansSeptJours.getDate() + 7);
  const seuilProche = toISODate(dansSeptJours);
  const passees = semainesToutes.filter(s => s.date_fin < today);
  const semaines = semainesToutes.filter(s => s.date_fin >= today);

  if (state.planningVue === 'calendrier') {
    const publieesSeulement = semainesToutes.filter(s => s.statut === 'publiee');
    view.innerHTML = `
      <div class="card" style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;">
        <h3 style="margin:0;">Planning</h3>
        <div style="display:flex;gap:8px;flex-wrap:wrap;">
          <button class="ghost" id="btn-toggle-vue">Vue liste</button>
          <button class="ghost" id="btn-imprimer">Imprimer / PDF</button>
        </div>
      </div>` + renderMonthCalendarHTML(publieesSeulement, planByWeek, agentById, state.agent.id);
    document.getElementById('btn-toggle-vue').addEventListener('click', () => { state.planningVue = 'liste'; renderView(); });
    document.getElementById('btn-imprimer').addEventListener('click', () => window.print());
    brancherNavigationCalendrier(view);
    return;
  }

  function ligneSemaine(s){
    const p = planByWeek[s.id];
    const agentAssigne = p ? agentById[p.agent_id] : null;
    const candidats = (dispoBySemaine[s.id]||[]).filter(d => d.niveau !== 'non' && agentById[d.agent_id] && agentById[d.agent_id].eligible_astreinte !== false && agentById[d.agent_id].role !== 'lecteur');
    const options = candidats.map(d => {
      const a = agentById[d.agent_id];
      if (!a) return '';
      return `<option value="${escapeHTML(a.id)}" ${p && p.agent_id===a.id ? 'selected':''}>${escapeHTML(a.nom)}</option>`;
    }).join('');
    const proche = s.date_debut <= seuilProche && s.date_debut >= today;
    let alerte = '';
    if (candidats.length === 0) alerte = '<div class="warn-text">Aucun agent disponible pour cette semaine</div>';
    else if (!p && proche && s.statut !== 'publiee') alerte = '<div class="warn-text">⚠ Astreinte dans moins de 7 jours, personne assigné pour l\'instant</div>';
    return `
      <div class="week-row">
        <div>
          <div class="week-label">${escapeHTML(weekLabel(s))} <span class="pill ${s.statut==='publiee'?'publiee':'partiel'}">${escapeHTML(s.statut)}</span></div>
          ${alerte || `<div class="week-sub">${candidats.length} agent(s) dispo</div>`}
          <span class="print-only">${agentAssigne ? escapeHTML(agentAssigne.nom) : '(non assigné)'}</span>
        </div>
        <div style="display:flex;gap:6px;align-items:center;flex-wrap:wrap;">
          <select data-role="assign" data-semaine="${escapeHTML(s.id)}" ${s.statut==='publiee' || candidats.length===0 ?'disabled':''}>
            <option value="">— choisir —</option>
            ${options}
          </select>
          ${s.statut !== 'publiee' ? `<button class="ghost" data-role="publier" data-semaine="${escapeHTML(s.id)}">Publier</button>` : ''}
          ${s.statut === 'publiee' ? `<button class="ghost" data-role="rappel" data-semaine="${escapeHTML(s.id)}">Renvoyer un rappel</button>` : ''}
        </div>
      </div>`;
  }

  view.innerHTML = `
    <div class="card" style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;">
      <div>
        <h3 style="margin-bottom:2px;">Générer une proposition</h3>
        <div class="week-sub">Répartit équitablement les semaines non encore assignées, selon les disponibilités déclarées et en évitant si possible deux semaines consécutives pour la même personne. Cela reste une proposition à vérifier avant publication.</div>
      </div>
      <div style="display:flex;gap:8px;flex-wrap:wrap;">
        <button class="ghost" id="btn-toggle-vue">Vue calendrier</button>
        <button class="ghost" id="btn-imprimer">Imprimer / PDF</button>
        <button class="primary" id="btn-generer">Générer une proposition</button>
      </div>
    </div>
    <div class="card">` + semaines.map(ligneSemaine).join('') + `</div>` +
    (passees.length ? `
    <div class="card">
      <button class="ghost" id="btn-toggle-historique">${state.showHistoriqueAdmin ? 'Masquer l\'historique' : 'Afficher l\'historique (' + passees.length + ' semaine(s) passée(s))'}</button>
      ${state.showHistoriqueAdmin ? passees.map(ligneSemaine).join('') : ''}
    </div>` : '');

  document.getElementById('btn-toggle-vue').addEventListener('click', () => { state.planningVue = 'calendrier'; renderView(); });
  document.getElementById('btn-imprimer').addEventListener('click', () => window.print());

  const btnHist = document.getElementById('btn-toggle-historique');
  if (btnHist) btnHist.addEventListener('click', () => { state.showHistoriqueAdmin = !state.showHistoriqueAdmin; renderView(); });

  document.getElementById('btn-generer').addEventListener('click', async (e) => {
    await withLoading(e.currentTarget, 'Génération…', () => genererProposition(semainesToutes, dispoBySemaine, plannings, agents));
  });

  view.querySelectorAll('[data-role=assign]').forEach(sel => {
    sel.addEventListener('change', async () => {
      if (!sel.value) return;
      const { error } = await sb.from('planning').upsert({ semaine_id: sel.dataset.semaine, agent_id: sel.value }, { onConflict:'semaine_id' });
      if (error) { showToast('Erreur : ' + error.message, 'error'); return; }
      showToast('Affectation mise à jour.', 'success');
    });
  });

  view.querySelectorAll('[data-role=publier]').forEach(btn => {
    btn.addEventListener('click', async (e) => {
      const semaineId = btn.dataset.semaine;
      const sel = view.querySelector(`[data-role=assign][data-semaine="${semaineId}"]`);
      if (!sel.value) { showToast('Choisissez un agent avant de publier.', 'error'); return; }
      await withLoading(e.currentTarget, 'Publication…', async () => {
        const agent = agentById[sel.value];
        const semaine = semainesToutes.find(s => s.id === semaineId);

        const { error: errPlanning } = await sb.from('planning').upsert({ semaine_id: semaineId, agent_id: sel.value, notifie: true }, { onConflict:'semaine_id' });
        if (errPlanning) { showToast('Échec de la publication : ' + errPlanning.message, 'error'); return; }

        const { error: errSemaine } = await sb.from('semaines').update({ statut:'publiee' }).eq('id', semaineId);
        if (errSemaine) { showToast('Planning enregistré mais le statut de la semaine n\'a pas pu être mis à jour : ' + errSemaine.message, 'error'); return; }

        const emailResult = await sendPublishEmail(agent, semaine);
        if (emailResult.ok) {
          showToast('Planning publié. Email envoyé à ' + agent.nom + '.', 'success');
        } else {
          showToast('Planning publié. Attention : l\'email n\'a pas pu être envoyé.', 'error');
        }
        renderView();
      });
    });
  });

  view.querySelectorAll('[data-role=rappel]').forEach(btn => {
    btn.addEventListener('click', async (e) => {
      const semaineId = btn.dataset.semaine;
      const p = planByWeek[semaineId];
      const semaine = semainesToutes.find(s => s.id === semaineId);
      if (!p) { showToast('Aucun agent assigné à cette semaine.', 'error'); return; }
      const agent = agentById[p.agent_id];
      if (!agent) { showToast('Agent introuvable.', 'error'); return; }
      await withLoading(e.currentTarget, 'Envoi…', async () => {
        const result = await sendPublishEmail(agent, semaine);
        showToast(result.ok ? 'Rappel envoyé à ' + agent.nom + '.' : 'Échec de l\'envoi du rappel.', result.ok ? 'success' : 'error');
      });
    });
  });
}

// Algorithme d'équilibrage : pour chaque semaine sans planning,
// choisit l'agent dispo avec le moins d'astreintes déjà comptabilisées,
// en départageant par priorité déclarée (1 = plus favorable), et en
// évitant si possible de reconduire l'agent de la semaine précédente
// immédiate (sauf s'il est le seul candidat disponible).
// Ne touche jamais une semaine déjà publiée. Reste une PROPOSITION :
// l'administrateur vérifie et publie manuellement ensuite.
async function genererProposition(semaines, dispoBySemaine, plannings, agents){
  const eligibles = new Set(agents.filter(a => a.eligible_astreinte !== false && a.role !== 'lecteur').map(a => a.id));
  const counts = Object.fromEntries(agents.map(a => [a.id, 0]));
  const planMap = {}; // semaine_id -> agent_id, mis à jour au fil de la génération
  (plannings||[]).forEach(p => { if (counts[p.agent_id] !== undefined) counts[p.agent_id]++; planMap[p.semaine_id] = p.agent_id; });
  const semaineParDebut = Object.fromEntries(semaines.map(s => [s.date_debut, s]));

  const aTraiter = semaines.filter(s => s.statut !== 'publiee').slice().sort((a,b) => a.date_debut < b.date_debut ? -1 : 1);
  let echecs = 0;
  let sansCandidat = 0;

  for (const s of aTraiter) {
    const candidats = (dispoBySemaine[s.id]||[]).filter(d => d.niveau !== 'non' && eligibles.has(d.agent_id));
    if (candidats.length === 0) { sansCandidat++; continue; }

    const veille = new Date(s.date_debut + 'T00:00:00'); veille.setDate(veille.getDate() - 7);
    const semainePrecedente = semaineParDebut[toISODate(veille)];
    const agentPrecedent = semainePrecedente ? planMap[semainePrecedente.id] : null;

    const tries = candidats.slice().sort((a,b) => {
      const diff = counts[a.agent_id] - counts[b.agent_id];
      if (diff !== 0) return diff;
      return a.priorite - b.priorite;
    });
    const choisi = tries.find(c => c.agent_id !== agentPrecedent) || tries[0];

    const { error } = await sb.from('planning').upsert({ semaine_id: s.id, agent_id: choisi.agent_id }, { onConflict:'semaine_id' });
    if (error) { echecs++; continue; }
    counts[choisi.agent_id]++;
    planMap[s.id] = choisi.agent_id;
  }

  if (echecs > 0) showToast(echecs + ' semaine(s) n\'ont pas pu être mises à jour.', 'error');
  if (sansCandidat > 0) showToast(sansCandidat + ' semaine(s) sans aucun agent disponible.', 'error');
  if (echecs === 0) showToast('Proposition générée. Vérifiez puis publiez.', 'success');
  renderView();
}

// =========================================================
// VUE ADMIN : SEMAINES — création (avec validations) et suivi
// =========================================================
async function renderSemainesAdmin(view){
  const { data: semaines, error } = await sb.from('semaines').select('*').order('date_debut', { ascending:false });
  if (error) { view.innerHTML = '<div class="card"><div class="empty">Erreur de chargement des semaines.</div></div>'; return; }
  const datesExistantes = new Set((semaines||[]).map(s => s.date_debut));

  view.innerHTML = `
    <div class="card">
      <h3>Nouvelle semaine</h3>
      <div style="display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;">
        <div>
          <div class="week-sub">Lundi de la semaine</div>
          <input type="date" id="new-debut">
        </div>
        <div>
          <div class="week-sub">Date limite de réponse</div>
          <input type="date" id="new-limite">
        </div>
        <button class="primary" id="btn-creer">Créer</button>
      </div>
      <div class="msg" id="creer-msg"></div>
    </div>
    <div class="card">
      <h3>Créer une période complète</h3>
      <div class="week-sub" style="margin-bottom:10px;">Génère automatiquement toutes les semaines (lundi à dimanche) entre deux dates. La date limite de réponse est fixée à un mois avant chaque lundi. Les semaines déjà existantes sont ignorées.</div>
      <div style="display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;">
        <div>
          <div class="week-sub">Du (n'importe quelle date)</div>
          <input type="date" id="periode-debut">
        </div>
        <div>
          <div class="week-sub">Au</div>
          <input type="date" id="periode-fin">
        </div>
        <button class="primary" id="btn-periode">Générer les semaines</button>
      </div>
      <div class="msg" id="periode-msg"></div>
    </div>
    <div class="card"><h3>Équité — nombre d'astreintes par agent</h3><div id="balance"></div></div>
    <div class="card"><h3>Semaines</h3>` + (semaines||[]).map(s => `
      <div class="week-row">
        <div>
          <div class="week-label">${escapeHTML(weekLabel(s))} <span class="pill ${s.statut==='publiee'?'publiee':'partiel'}">${escapeHTML(s.statut)}</span></div>
          <div class="week-sub">Limite dispo : ${escapeHTML(formatDateFR(s.date_limite_dispo))}</div>
        </div>
        <div style="display:flex;gap:6px;flex-wrap:wrap;">
          ${s.statut === 'ouverte' ? `<button class="ghost" data-role="relancer" data-id="${escapeHTML(s.id)}">Relancer les non-répondants</button>` : ''}
          <button class="ghost" data-role="suppr" data-id="${escapeHTML(s.id)}">Supprimer</button>
        </div>
      </div>`).join('') + `</div>`;

  document.getElementById('btn-creer').addEventListener('click', async (e) => {
    const debut = document.getElementById('new-debut').value;
    const limite = document.getElementById('new-limite').value;
    const cmsg = document.getElementById('creer-msg');
    cmsg.textContent = ''; cmsg.className = 'msg';

    if (!debut || !limite) { cmsg.textContent = 'Renseignez les deux dates.'; cmsg.className = 'msg err'; return; }
    if (new Date(debut + 'T00:00:00').getDay() !== 1) {
      cmsg.textContent = 'La date de début doit être un lundi.'; cmsg.className = 'msg err'; return;
    }
    if (limite > debut) {
      cmsg.textContent = 'La date limite de réponse doit être avant (ou égale à) le début de la semaine.'; cmsg.className = 'msg err'; return;
    }

    await withLoading(e.currentTarget, 'Création…', async () => {
      const fin = new Date(debut + 'T00:00:00');
      fin.setDate(fin.getDate() + 6);
      const { error } = await sb.from('semaines').insert({
        date_debut: debut,
        date_fin: toISODate(fin),
        date_limite_dispo: limite
      });
      if (error) {
        if (error.code === '23505') {
          cmsg.textContent = 'Cette semaine existe déjà.'; cmsg.className = 'msg err';
        } else {
          cmsg.textContent = 'Erreur : ' + error.message; cmsg.className = 'msg err';
        }
        return;
      }
      showToast('Semaine créée.', 'success');
      renderView();
    });
  });

  document.getElementById('btn-periode').addEventListener('click', async (e) => {
    const debutStr = document.getElementById('periode-debut').value;
    const finStr = document.getElementById('periode-fin').value;
    const pmsg = document.getElementById('periode-msg');
    pmsg.textContent = ''; pmsg.className = 'msg';

    if (!debutStr || !finStr) { pmsg.textContent = 'Renseignez les deux dates.'; pmsg.className = 'msg err'; return; }
    if (finStr < debutStr) { pmsg.textContent = 'La date de fin doit être après la date de début.'; pmsg.className = 'msg err'; return; }

    // On part du premier lundi à partir de la date choisie (inclus si elle est déjà un lundi).
    let curseur = new Date(debutStr + 'T00:00:00');
    const decalage = (8 - curseur.getDay()) % 7; // jours jusqu'au prochain lundi (0 si déjà lundi)
    curseur.setDate(curseur.getDate() + decalage);
    const fin = new Date(finStr + 'T00:00:00');

    const semainesAGenerer = [];
    while (curseur <= fin) {
      const dDebut = toISODate(curseur);
      const dFin = new Date(curseur); dFin.setDate(dFin.getDate() + 6);
      const dLimite = new Date(curseur); dLimite.setDate(dLimite.getDate() - 30);
      semainesAGenerer.push({
        date_debut: dDebut,
        date_fin: toISODate(dFin),
        date_limite_dispo: toISODate(dLimite)
      });
      curseur.setDate(curseur.getDate() + 7);
    }

    if (semainesAGenerer.length === 0) {
      pmsg.textContent = 'Aucune semaine complète dans cette période.'; pmsg.className = 'msg err'; return;
    }

    await withLoading(e.currentTarget, 'Génération…', async () => {
      let crees = 0, ignorees = 0, echecs = 0;
      for (const sem of semainesAGenerer) {
        if (datesExistantes.has(sem.date_debut)) { ignorees++; continue; }
        const { error } = await sb.from('semaines').insert(sem);
        if (error) { if (error.code === '23505') ignorees++; else echecs++; continue; }
        crees++;
      }
      let resume = crees + ' semaine(s) créée(s)';
      if (ignorees > 0) resume += ', ' + ignorees + ' déjà existante(s) ignorée(s)';
      if (echecs > 0) resume += ', ' + echecs + ' échec(s)';
      showToast(resume + '.', echecs > 0 ? 'error' : 'success');
      renderView();
    });
  });

  view.querySelectorAll('[data-role=suppr]').forEach(btn => {
    btn.addEventListener('click', async (e) => {
      if (!confirm('Supprimer cette semaine et toutes ses données associées (disponibilités, planning, échanges) ?')) return;
      await withLoading(e.currentTarget, 'Suppression…', async () => {
        const { error } = await sb.from('semaines').delete().eq('id', btn.dataset.id);
        if (error) { showToast('Erreur : ' + error.message, 'error'); return; }
        showToast('Semaine supprimée.', 'success');
        renderView();
      });
    });
  });

  view.querySelectorAll('[data-role=relancer]').forEach(btn => {
    btn.addEventListener('click', async (e) => {
      const semaineId = btn.dataset.id;
      const semaine = (semaines||[]).find(s => s.id === semaineId);
      await withLoading(e.currentTarget, 'Envoi…', async () => {
        const agents = await fetchAgents();
        const { data: dejaRepondu, error: errDispo } = await sb.from('disponibilites').select('agent_id').eq('semaine_id', semaineId);
        if (errDispo) { showToast('Erreur : ' + errDispo.message, 'error'); return; }
        const dejaReponduSet = new Set((dejaRepondu||[]).map(d => d.agent_id));
        const nonRepondants = agents.filter(a => !dejaReponduSet.has(a.id));
        if (nonRepondants.length === 0) { showToast('Tous les agents ont déjà répondu.', 'success'); return; }
        let envoyes = 0, echecs = 0;
        for (const agent of nonRepondants) {
          const result = await sendReminderEmail(agent, semaine);
          if (result.ok) envoyes++; else echecs++;
        }
        if (envoyes === 0 && echecs > 0) {
          showToast('Aucun email envoyé — le template de relance EmailJS n\'est probablement pas configuré (voir SETUP).', 'error');
        } else {
          showToast(envoyes + ' rappel(s) envoyé(s)' + (echecs ? ', ' + echecs + ' échec(s)' : '') + '.', echecs ? 'error' : 'success');
        }
      });
    });
  });


  // Tableau d'équité — n'inclut que les agents éligibles aux astreintes
  const agentsTous = await fetchAgents();
  const agents = agentsTous.filter(a => a.eligible_astreinte !== false && a.role !== 'lecteur');
  const { data: plannings } = await sb.from('planning').select('*');
  const counts = Object.fromEntries(agents.map(a => [a.id, 0]));
  (plannings||[]).forEach(p => { if (counts[p.agent_id] !== undefined) counts[p.agent_id]++; });
  const valeurs = Object.values(counts);
  const ecart = valeurs.length ? Math.max(...valeurs) - Math.min(...valeurs) : 0;
  const rows = agents.slice().sort((a,b) => counts[a.id]-counts[b.id])
    .map(a => `<tr><td>${escapeHTML(a.nom)}</td><td>${counts[a.id]}</td></tr>`).join('');
  document.getElementById('balance').innerHTML =
    `<div class="week-sub" style="margin-bottom:8px;">Écart actuel : ${ecart} astreinte${ecart>1?'s':''}</div>` +
    `<table class="balance"><tr><th>Agent</th><th>Astreintes</th></tr>${rows}</table>`;
}

// VUE ADMIN : ÉCHANGES — vue d'ensemble

async function renderEchangesAdmin(view){

  if (error) { view.innerHTML = '<div class="card"><div class="empty">Erreur de chargement des échanges.</div></div>'; return; }
  const agents = await fetchAgents();
  const agentById = Object.fromEntries(agents.map(a => [a.id, a]));

  if (!echanges || echanges.length === 0){
    view.innerHTML = '<div class="card"><div class="empty">Aucune demande d\'échange.</div></div>';
    return;
  }

  view.innerHTML = `<div class="card"><h3>Toutes les demandes d'échange</h3>` + echanges.map(e => {
    const demandeur = agentById[e.agent_demandeur_id] || { nom: 'Agent inconnu' };
    const cible = agentById[e.agent_cible_id] || { nom: 'Agent inconnu' };
    const statutPill = e.statut === 'attente' ? 'partiel' : (e.statut === 'acceptee' ? 'oui' : 'non');
    const traite = e.date_traitement ? ` · traité le ${escapeHTML(formatDateFR(e.date_traitement.slice(0,10)))}` : '';
    return `
    <div class="week-row">
      <div>
        <div class="week-label">${escapeHTML(weekLabel(e.semaines))}</div>
        <div class="week-sub">${escapeHTML(demandeur.nom)} → ${escapeHTML(cible.nom)} <span class="pill ${statutPill}">${escapeHTML(e.statut)}</span>${traite}</div>
      </div>
      <button class="ghost" data-role="suppr" data-id="${escapeHTML(e.id)}">Supprimer</button>
    </div>`;
  }).join('') + `</div>`;

  view.querySelectorAll('[data-role=suppr]').forEach(btn => {
    btn.addEventListener('click', async (e) => {
      if (!confirm('Supprimer cette demande d\'échange ?')) return;
      await withLoading(e.currentTarget, 'Suppression…', async () => {
        const { error } = await sb.from('echanges').delete().eq('id', btn.dataset.id);
        if (error) { showToast('Erreur : ' + error.message, 'error'); return; }
        showToast('Demande supprimée.', 'success');
        renderView();
      });
    });
  });
}
// =========================================================
// VUE ADMIN : AGENTS — coordonnées, rôle, activation
// L'email n'a pas besoin d'être "changé" côté authentification :
// la connexion associe automatiquement l'identité à l'email saisi
// lors du lien magique. Il suffit de mettre à jour l'annuaire ici ;
// la personne se reconnecte ensuite avec sa nouvelle adresse.
// =========================================================
async function renderAgentsAdmin(view){
  const { data: agents, error } = await sb.from('agents').select('*').order('nom');
  if (error) { view.innerHTML = '<div class="card"><div class="empty">Erreur de chargement des agents.</div></div>'; return; }

  view.innerHTML = `
    <div class="card">
      <h3>Nouvel agent</h3>
      <div class="week-sub" style="margin-bottom:10px;">Le rôle « Lecteur » donne un accès limité à la consultation du planning (pas de disponibilités à déclarer, jamais candidat aux astreintes) — utile par exemple pour le secrétariat de mairie.</div>
      <div style="display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;">
        <div style="flex:1;min-width:160px;"><div class="week-sub">Nom</div><input type="text" id="new-agent-nom"></div>
        <div style="flex:1;min-width:200px;"><div class="week-sub">Email</div><input type="email" id="new-agent-email"></div>
        <div style="flex:1;min-width:140px;"><div class="week-sub">Téléphone</div><input type="text" id="new-agent-telephone"></div>
        <div>
          <div class="week-sub">Rôle</div>
          <select id="new-agent-role">
            <option value="agent">Agent</option>
            <option value="lecteur">Lecteur (planning seul)</option>
            <option value="admin">Admin</option>
          </select>
        </div>
        <button class="primary" id="btn-nouvel-agent">Créer</button>
      </div>
      <div class="msg" id="nouvel-agent-msg"></div>
    </div>
    <div class="card">
      <h3>Agents</h3>
      <div class="week-sub" style="margin-bottom:6px;">Modifiez le nom, le téléphone, l'email, le rôle ou l'activation d'un agent. Après un changement d'email, la personne doit se reconnecter avec sa nouvelle adresse (un nouveau lien lui sera envoyé).</div>
    </div>` + (agents||[]).map(a => `
    <div class="card" data-agent="${escapeHTML(a.id)}">
      <div style="display:flex;gap:10px;flex-wrap:wrap;">
        <div style="flex:1;min-width:160px;">
          <div class="week-sub">Nom</div>
          <input type="text" data-role="nom" value="${escapeHTML(a.nom)}">
        </div>
        <div style="flex:1;min-width:160px;">
          <div class="week-sub">Téléphone</div>
          <input type="text" data-role="telephone" value="${escapeHTML(a.telephone||'')}">
        </div>
      </div>
      <div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:10px;">
        <div style="flex:1;min-width:220px;">
          <div class="week-sub">Email</div>
          <input type="email" data-role="email" value="${escapeHTML(a.email)}">
        </div>
        <div>
          <div class="week-sub">Rôle</div>
          <select data-role="role">
            <option value="agent" ${a.role==='agent'?'selected':''}>Agent</option>
            <option value="lecteur" ${a.role==='lecteur'?'selected':''}>Lecteur (planning seul)</option>
            <option value="admin" ${a.role==='admin'?'selected':''}>Admin</option>
          </select>
        </div>
        <div>
          <div class="week-sub">Statut</div>
          <select data-role="actif">
            <option value="true" ${a.actif?'selected':''}>Actif</option>
            <option value="false" ${!a.actif?'selected':''}>Désactivé</option>
          </select>
        </div>
        <div>
          <div class="week-sub">Astreintes</div>
          <select data-role="eligible">
            <option value="true" ${a.eligible_astreinte!==false?'selected':''}>Éligible</option>
            <option value="false" ${a.eligible_astreinte===false?'selected':''}>Exempté (ex. maire, lecteur)</option>
          </select>
        </div>
      </div>
      <div style="display:flex;justify-content:flex-end;margin-top:10px;">
        <button class="ghost" data-role="save">Enregistrer</button>
      </div>
      <div class="msg" data-role="msg"></div>
    </div>`).join('');

  document.getElementById('btn-nouvel-agent').addEventListener('click', async (e) => {
    const nom = document.getElementById('new-agent-nom').value.trim();
    const email = document.getElementById('new-agent-email').value.trim();
    const telephone = document.getElementById('new-agent-telephone').value.trim();
    const role = document.getElementById('new-agent-role').value;
    const nmsg = document.getElementById('nouvel-agent-msg');
    nmsg.textContent = ''; nmsg.className = 'msg';
    if (!nom || !email) { nmsg.textContent = 'Le nom et l\'email sont obligatoires.'; nmsg.className = 'msg err'; return; }

    await withLoading(e.currentTarget, 'Création…', async () => {
      // Un lecteur n'a pas vocation à faire des astreintes : on l'exempte par défaut.
      const eligible_astreinte = role !== 'lecteur';
      const { error } = await sb.from('agents').insert({ nom, email, telephone: telephone || null, role, actif: true, eligible_astreinte });
      if (error) {
        if (error.code === '23505') nmsg.textContent = 'Cet email est déjà utilisé par un autre agent.';
        else nmsg.textContent = 'Erreur : ' + error.message;
        nmsg.className = 'msg err';
        return;
      }
      showToast('Agent créé.', 'success');
      renderView();
    });
  });

  view.querySelectorAll('[data-agent]').forEach(card => {
    card.querySelector('[data-role=save]').addEventListener('click', async (e) => {
      const agentId = card.dataset.agent;
      const msg = card.querySelector('[data-role=msg]');
      msg.textContent = ''; msg.className = 'msg';
      const nom = card.querySelector('[data-role=nom]').value.trim();
      const telephone = card.querySelector('[data-role=telephone]').value.trim();
      const email = card.querySelector('[data-role=email]').value.trim();
      const role = card.querySelector('[data-role=role]').value;
      const actif = card.querySelector('[data-role=actif]').value === 'true';
      const eligible_astreinte = card.querySelector('[data-role=eligible]').value === 'true';

      if (!nom || !email) { msg.textContent = 'Le nom et l\'email sont obligatoires.'; msg.className = 'msg err'; return; }
      if (agentId === state.agent.id && role !== 'admin') { msg.textContent = 'Vous ne pouvez pas retirer votre propre rôle admin ici (par sécurité).'; msg.className = 'msg err'; return; }
      if (agentId === state.agent.id && !actif) { msg.textContent = 'Vous ne pouvez pas désactiver votre propre compte.'; msg.className = 'msg err'; return; }

      await withLoading(e.currentTarget, 'Enregistrement…', async () => {
        const { error } = await sb.from('agents').update({ nom, telephone: telephone || null, email, role, actif, eligible_astreinte }).eq('id', agentId);
        if (error) {
          if (error.code === '23505') msg.textContent = 'Cet email est déjà utilisé par un autre agent.';
          else msg.textContent = 'Erreur : ' + error.message;
          msg.className = 'msg err';
          return;
        }
        showToast('Agent mis à jour.', 'success');
        renderView();
      });
    });
  });
}

initAuth();
</script>
</body>
</html>
