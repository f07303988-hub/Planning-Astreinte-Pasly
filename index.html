      const peut_gerer_evenements = card.querySelector('[data-role=gere-evenements]').value === 'true';
      const droit_planning_agents = card.querySelector('[data-role=droit-planning-agents]').value;

      if (!nom || !email) { msg.textContent = 'Le nom et l\'email sont obligatoires.'; msg.className = 'msg err'; return; }
      if (!emailValide(email)) { msg.textContent = 'Adresse email invalide.'; msg.className = 'msg err'; return; }
      if (agentId === state.agent.id && role !== 'admin') { msg.textContent = 'Vous ne pouvez pas retirer votre propre rôle admin ici (par sécurité).'; msg.className = 'msg err'; return; }
      if (agentId === state.agent.id && !actif) { msg.textContent = 'Vous ne pouvez pas désactiver votre propre compte.'; msg.className = 'msg err'; return; }

      const emailChange = original && email.toLowerCase() !== (original.email||'').toLowerCase();
      if (emailChange) {
        const confirmation = confirm(
          'Changer cet email a des conséquences importantes :\n\n' +
          '• L\'ancienne adresse perd tout accès immédiatement.\n' +
          '• Un éventuel mot de passe déjà défini ne fonctionnera plus : la personne devra en redéfinir un nouveau après s\'être reconnectée par lien magique à la nouvelle adresse.\n' +
          '• Si cette personne est connectée en ce moment même, sa session en cours va cesser de fonctionner (elle devra se reconnecter).\n\n' +
          'Continuer ?'
        );
        if (!confirmation) return;
      }

      const desactivation = original && original.actif && !actif;
      if (desactivation) {
        if (!confirm('Désactiver ' + nom + ' ?\n\nCette personne perdra immédiatement tout accès à l\'application. Son historique (astreintes passées, échanges) reste conservé, mais elle ne sera plus proposée pour de nouvelles affectations.')) return;
      }

      const roleChange = original && original.role !== role;
      if (roleChange) {
        const labelRole = { agent: 'Agent', lecteur: 'Lecteur', admin: 'Admin' };
        if (!confirm('Changer le rôle de ' + nom + ' de « ' + (labelRole[original.role]||original.role) + ' » à « ' + (labelRole[role]||role) + ' » ?\n\n' + (role === 'admin' ? 'Cette personne aura accès à la gestion complète de l\'application (agents, semaines, publication du planning).' : 'Vérifiez que ce nouveau rôle correspond bien à ce que cette personne doit pouvoir faire.'))) return;
      }

      await withLoading(e.currentTarget, 'Enregistrement…', async () => {
        const { error } = await sb.from('agents').update({ nom, telephone: telephone || null, email, role, actif, eligible_astreinte, peut_gerer_evenements, droit_planning_agents }).eq('id', agentId);
        if (error) {
          if (error.code === '23505') msg.textContent = 'Cet email est déjà utilisé par un autre agent.';
          else if (error.code === '23514') msg.textContent = 'Adresse email invalide.';
          else msg.textContent = 'Erreur : ' + error.message;
          msg.className = 'msg err';
          return;
        }

        // Si l'admin vient de changer sa PROPRE adresse, sa session en cours
        // ne correspondra plus à aucune ligne `agents` dès la prochaine
        // requête (le jeton de connexion garde l'ancien email) : mieux vaut
        // le déconnecter proprement tout de suite que de le laisser dans un
        // état incohérent avec des erreurs de permission confuses.
        if (emailChange && agentId === state.agent.id) {
          alert('Votre propre email a été changé. Vous allez être déconnecté : reconnectez-vous avec ' + email + '.');
          await sb.auth.signOut();
          window.location.reload();
          return;
        }

        showToast('Agent mis à jour.' + (emailChange ? ' Pensez à prévenir la personne de son nouvel email de connexion.' : ''), 'success');
        renderView();
      });
    });
  });
}

// =========================================================
// PLANNING AGENTS COMMUNAUX — module indépendant des astreintes et de
// l'agenda communal. Accès conditionné à state.agent.droit_planning_agents
// ('consultation' ou 'gestion'), ou à state.isAdmin (toujours 'gestion',
// voir droit_planning_agents_actuel() côté SQL — même convention que le
// reste de l'appli). La RLS fait foi indépendamment de ces vérifications
// côté client, qui ne servent qu'à l'affichage.
// =========================================================
async function fetchAgentsCommunaux(includeInactifs){
  let q = sb.from('agents').select('*').eq('categorie', 'communal').order('nom');
  if (!includeInactifs) q = q.eq('actif', true);
  const { data } = await q;
  return data || [];
}

async function renderPlanningAgentsCommunaux(view){
  const gestion = state.isAdmin || state.agent.droit_planning_agents === 'gestion';
  const consultation = gestion || state.agent.droit_planning_agents === 'consultation';
  if (!consultation) { view.innerHTML = '<div class="card"><div class="empty">Vous n\'avez pas accès à ce module.</div></div>'; return; }

  const agentsCommunaux = await fetchAgentsCommunaux(false);
  const accesHTML = state.isAdmin ? await accesPlanningAgentsHTML() : '';

  if (!state.paVue) state.paVue = 'semaine';
  const toggleHTML = accesHTML + `
    <div class="card no-print" style="display:flex;gap:8px;flex-wrap:wrap;">
      <button class="${state.paVue==='semaine'?'primary':'ghost'}" id="pa-vue-semaine">Vue semaine</button>
      <button class="${state.paVue==='mois'?'primary':'ghost'}" id="pa-vue-mois">Vue mois</button>
      <button class="${state.paVue==='present'?'primary':'ghost'}" id="pa-vue-present">👥 Qui est présent ?</button>
    </div>`;

  if (state.paVue === 'present') {
    await renderQuiEstPresent(view, agentsCommunaux, gestion, toggleHTML);
    return;
  }
  if (state.paVue === 'mois') {
    await renderPlanningAgentsMois(view, agentsCommunaux, gestion, toggleHTML);
    return;
  }

  if (!state.paWeekStart) state.paWeekStart = toISODate(lundiDeLaSemaine(new Date()));
  const lundi = new Date(state.paWeekStart + 'T00:00:00');
  const dimanche = new Date(lundi); dimanche.setDate(dimanche.getDate() + 6);
  const lundiISO = toISODate(lundi);
  const dimancheISO = toISODate(dimanche);

  // Consultation : passe par la vue restreinte (sans motif/commentaire).
  // Gestion : table complète. Le choix de table est ce qui applique
  // réellement la confidentialité — la RLS bloquerait de toute façon un
  // accès direct incohérent avec le niveau de la personne connectée.
  const table = gestion ? 'planning_agents' : 'planning_agents_consultation';
  const { data: lignes, error } = await sb.from(table).select('*').gte('date', lundiISO).lte('date', dimancheISO);
  if (error) { view.innerHTML = '<div class="card"><div class="empty">Erreur de chargement du planning.</div></div>'; return; }

  const agentById = Object.fromEntries(agentsCommunaux.map(a => [a.id, a]));
  const ligneParJourAgent = {};
  (lignes||[]).forEach(l => { ligneParJourAgent[l.date + '|' + l.agent_id] = l; });

  const joursLabels = ['Lundi','Mardi','Mercredi','Jeudi','Vendredi','Samedi','Dimanche'];
  const jours = [];
  for (let i = 0; i < 7; i++){ const d = new Date(lundi); d.setDate(d.getDate() + i); jours.push(d); }

  view.innerHTML = toggleHTML + `
    <div class="card no-print" style="display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;">
      <button class="ghost" id="pa-prev">← Semaine précédente</button>
      <button class="ghost" id="pa-today">Cette semaine</button>
      <button class="ghost" id="pa-next">Semaine suivante →</button>
    </div>
    <div class="card no-print" style="display:flex;gap:8px;flex-wrap:wrap;">
      <button class="ghost" id="pa-imprimer">Imprimer / PDF</button>
      <button class="ghost" id="pa-export-csv">Exporter en CSV (Excel)</button>
    </div>
    <div class="card">
      <h3>Semaine du ${escapeHTML(formatDateFR(lundiISO))} au ${escapeHTML(formatDateFR(dimancheISO))}</h3>
      ${!agentsCommunaux.length ? '<div class="empty">Aucun agent communal actif pour l\'instant. Ajoutez-en depuis l\'onglet Agents (catégorie « Agent communal »).</div>' : `
      <div class="pa-week-mobile">
      ${jours.map((d, i) => {
        const iso = toISODate(d);
        return `
        <div style="border-top:1px solid var(--stone-dark);padding:8px 0;">
          <div class="week-label" style="margin-bottom:4px;">${joursLabels[i]} ${escapeHTML(formatDateFR(iso))}</div>
          ${agentsCommunaux.map(a => {
            const ligne = ligneParJourAgent[iso + '|' + a.id];
            const couleur = ligne ? typePlanningAgentCouleur(ligne.type) : 'var(--stone-dark)';
            const texte = ligne
              ? typePlanningAgentLabel(ligne.type) + (formatHorairesJour(ligne) ? ' · ' + escapeHTML(formatHorairesJour(ligne)) : '')
              : 'Non planifié';
            const remplacantTxt = ligne && ligne.remplacant_id && agentById[ligne.remplacant_id] ? ' · remplacé par ' + escapeHTML(agentById[ligne.remplacant_id].nom) : '';
            const lieuTxt = ligne && ligne.lieu ? ' · ' + escapeHTML(ligne.lieu) : '';
            return `<div class="week-row" data-role="jour-agent" data-agent="${escapeHTML(a.id)}" data-date="${iso}" style="cursor:${gestion ? 'pointer' : 'default'};padding:5px 0;">
              <div style="display:flex;align-items:center;gap:8px;">
                <span style="width:8px;height:8px;border-radius:2px;background:${couleur};flex-shrink:0;"></span>
                <div>
                  <div class="week-sub" style="color:var(--ink);font-weight:500;">${escapeHTML(a.nom)}</div>
                  <div class="week-sub">${texte}${remplacantTxt}${lieuTxt}</div>
                </div>
              </div>
            </div>`;
          }).join('')}
        </div>`;
      }).join('')}
      </div>
      <table class="pa-desktop">
        <tr>
          <th>Agent</th>
          ${jours.map((d, i) => `<th>${joursLabels[i].slice(0,3)}<br>${d.getDate()}</th>`).join('')}
        </tr>
        ${agentsCommunaux.map(a => `
        <tr>
          <td class="pa-agent-nom">${escapeHTML(a.nom)}</td>
          ${jours.map(d => {
            const iso = toISODate(d);
            const ligne = ligneParJourAgent[iso + '|' + a.id];
            const couleur = ligne ? typePlanningAgentCouleur(ligne.type) : 'var(--stone-dark)';
            return `<td data-role="jour-agent" data-agent="${escapeHTML(a.id)}" data-date="${iso}">
              ${ligne
                ? `<span class="pa-cell-type" style="background:${couleur};">${escapeHTML(typePlanningAgentLabel(ligne.type))}</span><br>${escapeHTML(formatHorairesJour(ligne))}`
                : '—'}
            </td>`;
          }).join('')}
        </tr>`).join('')}
      </table>
      `}
    </div>
    ${gestion && agentsCommunaux.length ? `
    <div class="card">
      <h3>Horaires habituels</h3>
      <div class="week-sub" style="margin-bottom:8px;">Définissez les horaires habituels de chaque agent, puis générez le planning sur une période — les journées déjà renseignées ne sont jamais écrasées.</div>
      ${agentsCommunaux.map(a => `
        <div class="week-row">
          <div class="week-label">${escapeHTML(a.nom)}</div>
          <button class="ghost" data-role="horaires-recurrents" data-agent="${escapeHTML(a.id)}">Horaires habituels</button>
        </div>`).join('')}
    </div>
    <div class="card">
      <h3>Générer le planning sur une période</h3>
      <div style="display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;">
        <div><div class="week-sub">Agent</div><select id="pa-gen-agent">${agentsCommunaux.map(a=>`<option value="${escapeHTML(a.id)}">${escapeHTML(a.nom)}</option>`).join('')}</select></div>
        <div><div class="week-sub">Du</div><input type="date" id="pa-gen-debut"></div>
        <div><div class="week-sub">Au</div><input type="date" id="pa-gen-fin"></div>
        <button class="primary" id="pa-gen-btn">Générer</button>
      </div>
      <div class="msg" id="pa-gen-msg"></div>
    </div>
    <div class="card">
      <h3>Congé ou absence sur une période</h3>
      <div class="week-sub" style="margin-bottom:8px;">Si des journées existent déjà sur cette période, vous serez prévenu avant tout remplacement — rien n'est jamais écrasé sans confirmation.</div>
      <div style="display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;">
        <div><div class="week-sub">Agent</div><select id="pa-abs-agent">${agentsCommunaux.map(a=>`<option value="${escapeHTML(a.id)}">${escapeHTML(a.nom)}</option>`).join('')}</select></div>
        <div><div class="week-sub">Type</div><select id="pa-abs-type"><option value="conge">Congé</option><option value="absence">Absence</option><option value="formation">Formation</option></select></div>
        <div><div class="week-sub">Du</div><input type="date" id="pa-abs-debut"></div>
        <div><div class="week-sub">Au</div><input type="date" id="pa-abs-fin"></div>
      </div>
      <div style="margin-top:10px;"><div class="week-sub">Motif (facultatif)</div><input type="text" id="pa-abs-motif" style="width:100%;"></div>
      <div style="margin-top:10px;"><div class="week-sub">Commentaire (facultatif)</div><textarea id="pa-abs-commentaire" style="width:100%;min-height:50px;"></textarea></div>
      <button class="primary" id="pa-abs-btn" style="margin-top:10px;">Enregistrer</button>
      <div class="msg" id="pa-abs-msg"></div>
    </div>
    ` : ''}
  `;

  brancherAccesPlanningAgents();
  document.getElementById('pa-vue-semaine').addEventListener('click', () => { state.paVue = 'semaine'; renderView(); });
  document.getElementById('pa-vue-mois').addEventListener('click', () => { state.paVue = 'mois'; renderView(); });
  document.getElementById('pa-vue-present').addEventListener('click', () => { state.paVue = 'present'; renderView(); });

  document.getElementById('pa-prev').addEventListener('click', () => {
    const d = new Date(state.paWeekStart + 'T00:00:00'); d.setDate(d.getDate() - 7);
    state.paWeekStart = toISODate(d); renderView();
  });
  document.getElementById('pa-next').addEventListener('click', () => {
    const d = new Date(state.paWeekStart + 'T00:00:00'); d.setDate(d.getDate() + 7);
    state.paWeekStart = toISODate(d); renderView();
  });
  document.getElementById('pa-today').addEventListener('click', () => {
    state.paWeekStart = toISODate(lundiDeLaSemaine(new Date())); renderView();
  });

  document.getElementById('pa-imprimer').addEventListener('click', () => window.print());
  document.getElementById('pa-export-csv').addEventListener('click', () => {
    const colonnes = ['Date', 'Jour', 'Agent', 'Type', 'Matin début', 'Matin fin', 'Après-midi début', 'Après-midi fin', 'Lieu', 'Remplacé par'];
    if (gestion) colonnes.push('Commentaire');
    const lignesCsv = [colonnes];
    jours.forEach((d, i) => {
      const iso = toISODate(d);
      agentsCommunaux.forEach(a => {
        const l = ligneParJourAgent[iso + '|' + a.id];
        const ligne = [
          formatDateFR(iso), joursLabels[i], a.nom,
          l ? typePlanningAgentLabel(l.type) : 'Non planifié',
          (l && l.matin_debut) || '', (l && l.matin_fin) || '', (l && l.apresmidi_debut) || '', (l && l.apresmidi_fin) || '', (l && l.lieu) || '',
          (l && l.remplacant_id && agentById[l.remplacant_id]) ? agentById[l.remplacant_id].nom : ''
        ];
        if (gestion) ligne.push((l && l.commentaire) || '');
        lignesCsv.push(ligne);
      });
    });
    telechargerCSV(`planning-agents-${lundiISO}.csv`, lignesCsv);
  });

  if (gestion) {
    view.querySelectorAll('[data-role=jour-agent]').forEach(row => {
      row.addEventListener('click', () => {
        const agent = agentById[row.dataset.agent];
        const ligne = ligneParJourAgent[row.dataset.date + '|' + row.dataset.agent];
        ouvrirModaleJourAgent(agent, row.dataset.date, ligne, agentsCommunaux);
      });
    });

    view.querySelectorAll('[data-role=horaires-recurrents]').forEach(btn => {
      btn.addEventListener('click', () => ouvrirModaleHorairesRecurrents(agentById[btn.dataset.agent]));
    });

    const btnGen = document.getElementById('pa-gen-btn');
    if (btnGen) btnGen.addEventListener('click', async (e) => {
      const agentId = document.getElementById('pa-gen-agent').value;
      const debut = document.getElementById('pa-gen-debut').value;
      const fin = document.getElementById('pa-gen-fin').value;
      const gmsg = document.getElementById('pa-gen-msg');
      gmsg.textContent = ''; gmsg.className = 'msg';
      if (!debut || !fin || debut > fin) { gmsg.textContent = 'Choisissez une période valide.'; gmsg.className = 'msg err'; return; }
      const agent = agentById[agentId];

      await withLoading(e.currentTarget, 'Génération…', async () => {
        const { data: horaires } = await sb.from('horaires_recurrents').select('*').eq('agent_id', agentId);
        const horaireParJour = Object.fromEntries((horaires||[]).map(h => [h.jour_semaine, h]));
        if (!horaires || !horaires.length) { gmsg.textContent = 'Aucun horaire habituel défini pour cet agent — configurez-les d\'abord.'; gmsg.className = 'msg err'; return; }

        const { data: existants } = await sb.from('planning_agents').select('date').eq('agent_id', agentId).gte('date', debut).lte('date', fin);
        const datesExistantes = new Set((existants||[]).map(l => l.date));

        const aCreer = [];
        let d = new Date(debut + 'T00:00:00');
        const finD = new Date(fin + 'T00:00:00');
        while (d <= finD) {
          const iso = toISODate(d);
          const h = horaireParJour[isoJourSemaine(d)];
          if (h && !datesExistantes.has(iso)) {
            aCreer.push({
              agent_id: agentId, date: iso, type: h.type || 'travail',
              heure_debut: h.heure_debut || null, heure_fin: h.heure_fin || null,
              pause: h.pause || null, lieu: h.lieu || null,
              matin_debut: h.matin_debut || null, matin_fin: h.matin_fin || null,
              apresmidi_debut: h.apresmidi_debut || null, apresmidi_fin: h.apresmidi_fin || null,
              created_by: state.agent.id, updated_by: state.agent.id
            });
          }
          d.setDate(d.getDate() + 1);
        }

        if (!aCreer.length) { gmsg.textContent = 'Rien à générer : aucun horaire habituel ne correspond à cette période, ou toutes les journées concernées existent déjà.'; gmsg.className = 'msg'; return; }

        const conflitTxt = datesExistantes.size ? `\n\n${datesExistantes.size} journée(s) déjà renseignée(s) sur cette période seront laissées telles quelles (jamais écrasées).` : '';
        if (!confirm(`Générer ${aCreer.length} journée(s) de travail pour ${agent.nom} entre le ${formatDateFR(debut)} et le ${formatDateFR(fin)} ?${conflitTxt}`)) return;

        const { error } = await sb.from('planning_agents').insert(aCreer);
        if (error) { gmsg.textContent = 'Erreur : ' + error.message; gmsg.className = 'msg err'; return; }

        sb.from('planning_agents_historique').insert({
          agent_id: agentId, action: 'generation',
          description: `${aCreer.length} journée(s) générée(s) pour ${agent.nom} entre le ${formatDateFR(debut)} et le ${formatDateFR(fin)}, par ${state.agent.nom}`,
          auteur_id: state.agent.id
        }).then(({error}) => { if (error) console.error('Historique non enregistré', error); });

        showToast(`${aCreer.length} journée(s) générée(s).`, 'success');
        renderView();
      });
    });

    const btnAbs = document.getElementById('pa-abs-btn');
    if (btnAbs) btnAbs.addEventListener('click', async (e) => {
      const agentId = document.getElementById('pa-abs-agent').value;
      const type = document.getElementById('pa-abs-type').value;
      const debut = document.getElementById('pa-abs-debut').value;
      const fin = document.getElementById('pa-abs-fin').value;
      const motif = document.getElementById('pa-abs-motif').value.trim();
      const commentaire = document.getElementById('pa-abs-commentaire').value.trim();
      const amsg = document.getElementById('pa-abs-msg');
      amsg.textContent = ''; amsg.className = 'msg';
      if (!debut || !fin || debut > fin) { amsg.textContent = 'Choisissez une période valide.'; amsg.className = 'msg err'; return; }
      const agent = agentById[agentId];

      await withLoading(e.currentTarget, 'Enregistrement…', async () => {
        const { data: existants } = await sb.from('planning_agents').select('date,type').eq('agent_id', agentId).gte('date', debut).lte('date', fin);
        const joursListe = [];
        let d = new Date(debut + 'T00:00:00');
        const finD = new Date(fin + 'T00:00:00');
        while (d <= finD) { joursListe.push(toISODate(d)); d.setDate(d.getDate() + 1); }

        const conflits = (existants||[]).filter(l => joursListe.includes(l.date));
        if (conflits.length) {
          const detail = conflits.map(c => `${formatDateFR(c.date)} (${typePlanningAgentLabel(c.type)})`).join(', ');
          if (!confirm(`${conflits.length} journée(s) déjà renseignée(s) sur cette période seront remplacées :\n\n${detail}\n\nContinuer ?`)) return;
        }

        const lignes = joursListe.map(iso => ({
          agent_id: agentId, date: iso, type,
          motif: motif || null, commentaire: commentaire || null,
          heure_debut: null, heure_fin: null, pause: null, lieu: null, remplacant_id: null,
          created_by: state.agent.id, updated_by: state.agent.id
        }));
        const { error } = await sb.from('planning_agents').upsert(lignes, { onConflict: 'agent_id,date' });
        if (error) { amsg.textContent = 'Erreur : ' + error.message; amsg.className = 'msg err'; return; }

        sb.from('planning_agents_historique').insert({
          agent_id: agentId, action: 'absence',
          description: `${typePlanningAgentLabel(type)} enregistré(e) pour ${agent.nom} du ${formatDateFR(debut)} au ${formatDateFR(fin)}, par ${state.agent.nom}`,
          auteur_id: state.agent.id
        }).then(({error}) => { if (error) console.error('Historique non enregistré', error); });

        showToast(`${joursListe.length} journée(s) enregistrée(s).`, 'success');
        renderView();
      });
    });
  }
}

// Édition des horaires habituels d'un agent communal (une ligne par jour
// de semaine, vide = jour non travaillé). Sert de gabarit à la
// génération du planning sur une période.
async function ouvrirModaleHorairesRecurrents(agent){
  const { data: horaires } = await sb.from('horaires_recurrents').select('*').eq('agent_id', agent.id);
  const horaireParJour = Object.fromEntries((horaires||[]).map(h => [h.jour_semaine, h]));
  const joursLabels = ['Lundi','Mardi','Mercredi','Jeudi','Vendredi','Samedi','Dimanche'];

  openModal(`
    <h3>Horaires habituels — ${escapeHTML(agent.nom)}</h3>
    <div class="week-sub" style="margin-bottom:10px;">« Non travaillé » = rien n'est généré ce jour-là. « Repos » génère explicitement un jour de repos (utile pour le week-end). Laissez la tranche après-midi vide pour une journée continue.</div>
    ${joursLabels.map((label, i) => {
      const jour = i + 1;
      const h = horaireParJour[jour];
      const statutActuel = !h ? 'non' : (h.type === 'repos' ? 'repos' : 'travail');
      return `
      <div style="border-top:1px solid var(--stone-dark);padding:8px 0;">
        <div class="week-label" style="margin-bottom:4px;">${label}</div>
        <select data-jour="${jour}" data-champ="statut" style="width:150px;margin-bottom:6px;">
          <option value="non" ${statutActuel==='non'?'selected':''}>Non travaillé</option>
          <option value="travail" ${statutActuel==='travail'?'selected':''}>Travail</option>
          <option value="repos" ${statutActuel==='repos'?'selected':''}>Repos</option>
        </select>
        <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center;">
          <span class="week-sub" style="width:60px;">Matin</span>
          <input type="time" step="60" data-jour="${jour}" data-champ="matin_debut" value="${heureTexteVersHHMM((h&&h.matin_debut)||'')}" style="width:120px;">
          <input type="time" step="60" data-jour="${jour}" data-champ="matin_fin" value="${heureTexteVersHHMM((h&&h.matin_fin)||'')}" style="width:120px;">
        </div>
        <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:4px;">
          <span class="week-sub" style="width:60px;">Après-midi</span>
          <input type="time" step="60" data-jour="${jour}" data-champ="apresmidi_debut" value="${heureTexteVersHHMM((h&&h.apresmidi_debut)||'')}" style="width:120px;">
          <input type="time" step="60" data-jour="${jour}" data-champ="apresmidi_fin" value="${heureTexteVersHHMM((h&&h.apresmidi_fin)||'')}" style="width:120px;">
        </div>
        <input type="text" data-jour="${jour}" data-champ="lieu" value="${escapeHTML((h&&h.lieu)||'')}" placeholder="Lieu" style="width:100%;margin-top:6px;">
      </div>`;
    }).join('')}
    <div class="msg" id="hr-msg"></div>
    <div class="modal-actions">
      <button class="ghost" id="modal-cancel">Annuler</button>
      <button class="primary" id="modal-confirm">Enregistrer</button>
    </div>
  `);
  document.getElementById('modal-cancel').addEventListener('click', closeModal);
  document.getElementById('modal-confirm').addEventListener('click', async (e) => {
    const mmsg = document.getElementById('hr-msg');
    mmsg.textContent = ''; mmsg.className = 'msg';
    const parJour = {};
    for (let j = 1; j <= 7; j++) parJour[j] = { statut: 'non', matin_debut: '', matin_fin: '', apresmidi_debut: '', apresmidi_fin: '', lieu: '' };
    document.querySelectorAll('[data-jour]').forEach(inp => { parJour[inp.dataset.jour][inp.dataset.champ] = inp.value.trim(); });

    for (let j = 1; j <= 7; j++){
      const v = parJour[j];
      if (v.statut === 'non') continue;
      const erreur = validerHorairesDemiJournees(v.matin_debut, v.matin_fin, v.apresmidi_debut, v.apresmidi_fin);
      if (erreur) { mmsg.textContent = joursLabels[j-1] + ' : ' + erreur; mmsg.className = 'msg err'; return; }
    }

    await withLoading(e.currentTarget, 'Enregistrement…', async () => {
      const aUpsert = [];
      const aSupprimer = [];
      for (let j = 1; j <= 7; j++){
        const v = parJour[j];
        if (v.statut === 'non') { if (horaireParJour[j]) aSupprimer.push(horaireParJour[j].id); }
        else {
          const repos = v.statut === 'repos';
          const herites = repos ? { heure_debut: null, heure_fin: null, pause: null } : deriverHorairesHerites(v.matin_debut, v.matin_fin, v.apresmidi_debut, v.apresmidi_fin);
          aUpsert.push({
            agent_id: agent.id, jour_semaine: j, type: v.statut,
            matin_debut: repos ? null : (v.matin_debut||null), matin_fin: repos ? null : (v.matin_fin||null),
            apresmidi_debut: repos ? null : (v.apresmidi_debut||null), apresmidi_fin: repos ? null : (v.apresmidi_fin||null),
            ...herites,
            lieu: v.lieu||null
          });
        }
      }
      if (aUpsert.length) {
        const { error } = await sb.from('horaires_recurrents').upsert(aUpsert, { onConflict: 'agent_id,jour_semaine' });
        if (error) { mmsg.textContent = 'Erreur : ' + error.message; mmsg.className = 'msg err'; return; }
      }
      if (aSupprimer.length) {
        const { error } = await sb.from('horaires_recurrents').delete().in('id', aSupprimer);
        if (error) { mmsg.textContent = 'Erreur : ' + error.message; mmsg.className = 'msg err'; return; }
      }
      closeModal();
      showToast('Horaires habituels enregistrés.', 'success');
    });
  });
}

// « Qui est présent ? » — vue pratique pour une date donnée, purement
// informative (ne modifie jamais le planning). Même règle de
// confidentialité que la vue semaine : consultation passe par la vue
// restreinte, gestion par la table complète.
async function renderQuiEstPresent(view, agentsCommunaux, gestion, toggleHTML){
  if (!state.paQuiDate) state.paQuiDate = toISODate(new Date());
  const dateISO = state.paQuiDate;

  const table = gestion ? 'planning_agents' : 'planning_agents_consultation';
  const { data: lignes, error } = await sb.from(table).select('*').eq('date', dateISO);
  if (error) { view.innerHTML = toggleHTML + '<div class="card"><div class="empty">Erreur de chargement.</div></div>'; return; }

  const agentById = Object.fromEntries(agentsCommunaux.map(a => [a.id, a]));
  const ligneParAgent = Object.fromEntries((lignes||[]).map(l => [l.agent_id, l]));

  view.innerHTML = toggleHTML + `
    <div class="card no-print" style="display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;">
      <button class="ghost" id="pa-qui-prev">← Jour précédent</button>
      <input type="date" id="pa-qui-date" value="${dateISO}">
      <button class="ghost" id="pa-qui-next">Jour suivant →</button>
    </div>
    <div class="card no-print" style="display:flex;gap:8px;flex-wrap:wrap;">
      <button class="ghost" id="pa-imprimer">Imprimer / PDF</button>
      <button class="ghost" id="pa-export-csv">Exporter en CSV (Excel)</button>
    </div>
    <div class="card">
      <h3>${escapeHTML(formatDateFR(dateISO))}</h3>
      ${!agentsCommunaux.length ? '<div class="empty">Aucun agent communal actif pour l\'instant.</div>' : agentsCommunaux.map(a => {
        const ligne = ligneParAgent[a.id];
        const couleur = ligne ? typePlanningAgentCouleur(ligne.type) : 'var(--stone-dark)';
        const texte = ligne
          ? typePlanningAgentLabel(ligne.type) + (formatHorairesJour(ligne) ? ' · ' + escapeHTML(formatHorairesJour(ligne)) : '')
          : 'Non planifié';
        const remplacantTxt = ligne && ligne.remplacant_id && agentById[ligne.remplacant_id] ? ' · remplacé par ' + escapeHTML(agentById[ligne.remplacant_id].nom) : '';
        const lieuTxt = ligne && ligne.lieu ? ' · ' + escapeHTML(ligne.lieu) : '';
        return `<div class="week-row">
          <div style="display:flex;align-items:center;gap:8px;">
            <span style="width:10px;height:10px;border-radius:2px;background:${couleur};flex-shrink:0;"></span>
            <div>
              <div class="week-label">${escapeHTML(a.nom)}</div>
              <div class="week-sub">${texte}${remplacantTxt}${lieuTxt}</div>
            </div>
          </div>
        </div>`;
      }).join('')}
    </div>
  `;

  brancherAccesPlanningAgents();
  document.getElementById('pa-vue-semaine').addEventListener('click', () => { state.paVue = 'semaine'; renderView(); });
  document.getElementById('pa-vue-mois').addEventListener('click', () => { state.paVue = 'mois'; renderView(); });
  document.getElementById('pa-vue-present').addEventListener('click', () => { state.paVue = 'present'; renderView(); });

  document.getElementById('pa-qui-date').addEventListener('change', (e) => { state.paQuiDate = e.target.value; renderView(); });
  document.getElementById('pa-qui-prev').addEventListener('click', () => {
    const d = new Date(state.paQuiDate + 'T00:00:00'); d.setDate(d.getDate() - 1);
    state.paQuiDate = toISODate(d); renderView();
  });
  document.getElementById('pa-qui-next').addEventListener('click', () => {
    const d = new Date(state.paQuiDate + 'T00:00:00'); d.setDate(d.getDate() + 1);
    state.paQuiDate = toISODate(d); renderView();
  });

  document.getElementById('pa-imprimer').addEventListener('click', () => window.print());
  document.getElementById('pa-export-csv').addEventListener('click', () => {
    const colonnes = ['Date', 'Agent', 'Type', 'Matin début', 'Matin fin', 'Après-midi début', 'Après-midi fin', 'Lieu', 'Remplacé par'];
    if (gestion) colonnes.push('Commentaire');
    const lignesCsv = [colonnes];
    agentsCommunaux.forEach(a => {
      const l = ligneParAgent[a.id];
      const ligne = [
        formatDateFR(dateISO), a.nom, l ? typePlanningAgentLabel(l.type) : 'Non planifié',
        (l && l.matin_debut) || '', (l && l.matin_fin) || '', (l && l.apresmidi_debut) || '', (l && l.apresmidi_fin) || '', (l && l.lieu) || '',
        (l && l.remplacant_id && agentById[l.remplacant_id]) ? agentById[l.remplacant_id].nom : ''
      ];
      if (gestion) ligne.push((l && l.commentaire) || '');
      lignesCsv.push(ligne);
    });
    telechargerCSV(`qui-est-present-${dateISO}.csv`, lignesCsv);
  });
}

// Gestion des accès au module, réservée à l'administrateur (une décision
// d'habilitation, pas une simple opération de planning — distincte du
// niveau « gestion » qui peut créer/modifier des journées mais ne doit
// pas nécessairement pouvoir accorder ce droit à d'autres). Concerne
// tous les comptes avec connexion (élus, y compris lecteurs/secrétariat)
// — jamais les agents communaux, qui n'en ont pas l'usage.
async function accesPlanningAgentsHTML(){
  const { data: comptes } = await sb.from('agents').select('id,nom,role,actif,droit_planning_agents').eq('categorie', 'elu').eq('actif', true).order('nom');
  const labelRole = { admin: 'Admin', agent: 'Agent', lecteur: 'Lecteur/secrétariat' };
  return `
    <details class="card no-print">
      <summary style="cursor:pointer;font-weight:600;">Gestion des accès au module</summary>
      <div class="week-sub" style="margin:8px 0;">Un compte admin a toujours accès (« Gestion »), quel que soit le réglage ci-dessous.</div>
      <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px;">
        <button type="button" class="ghost" id="pa-acces-tout-aucun">Tout : Aucun accès</button>
        <button type="button" class="ghost" id="pa-acces-tout-consult">Tout : Consultation</button>
        <button type="button" class="ghost" id="pa-acces-tout-gestion">Tout : Gestion</button>
      </div>
      ${(comptes||[]).map(c => `
        <div class="week-row" data-acces-agent="${escapeHTML(c.id)}">
          <div class="week-label">${escapeHTML(c.nom)} <span class="week-sub">(${labelRole[c.role]||c.role})</span></div>
          <select data-role="pa-acces-niveau" ${c.role === 'admin' ? 'disabled' : ''}>
            <option value="aucun" ${(c.droit_planning_agents||'aucun')==='aucun'?'selected':''}>Aucun accès</option>
            <option value="consultation" ${c.droit_planning_agents==='consultation'?'selected':''}>Consultation</option>
            <option value="gestion" ${c.droit_planning_agents==='gestion'?'selected':''}>Gestion</option>
          </select>
        </div>`).join('')}
      <button class="primary" id="pa-acces-enregistrer" style="margin-top:10px;">Enregistrer les accès</button>
      <div class="msg" id="pa-acces-msg"></div>
    </details>`;
}

function brancherAccesPlanningAgents(){
  const btnEnregistrer = document.getElementById('pa-acces-enregistrer');
  if (!btnEnregistrer) return; // absent pour tout compte non-admin

  const appliquerATous = (valeur) => {
    document.querySelectorAll('[data-acces-agent] select[data-role=pa-acces-niveau]:not(:disabled)').forEach(sel => { sel.value = valeur; });
  };
  document.getElementById('pa-acces-tout-aucun').addEventListener('click', () => appliquerATous('aucun'));
  document.getElementById('pa-acces-tout-consult').addEventListener('click', () => appliquerATous('consultation'));
  document.getElementById('pa-acces-tout-gestion').addEventListener('click', () => appliquerATous('gestion'));

  btnEnregistrer.addEventListener('click', async (e) => {
    const amsg = document.getElementById('pa-acces-msg');
    amsg.textContent = ''; amsg.className = 'msg';
    const lignes = Array.from(document.querySelectorAll('[data-acces-agent]')).map(row => ({
      id: row.dataset.accesAgent,
      droit_planning_agents: row.querySelector('select[data-role=pa-acces-niveau]').value
    }));
    await withLoading(e.currentTarget, 'Enregistrement…', async () => {
      const erreurs = [];
      for (const l of lignes) {
        const { error } = await sb.from('agents').update({ droit_planning_agents: l.droit_planning_agents }).eq('id', l.id);
        if (error) erreurs.push(error.message);
      }
      if (erreurs.length) { amsg.textContent = 'Erreur(s) : ' + erreurs.join(' ; '); amsg.className = 'msg err'; return; }
      showToast('Accès mis à jour.', 'success');
      renderView();
    });
  });
}

// Vue mois — synthèse visuelle (travail/repos/congé/absence/formation/
// réunion/autre) avec cartes compactes par jour, même logique que le
// calendrier de l'agenda communal. Clic sur un jour = détail complet.
async function renderPlanningAgentsMois(view, agentsCommunaux, gestion, toggleHTML){
  if (state.paMonth === undefined) { const n = new Date(); state.paMonth = n.getMonth(); state.paYear = n.getFullYear(); }
  const year = state.paYear, month = state.paMonth;
  const premierJour = new Date(year, month, 1);
  const startDay = isoJourSemaine(premierJour) - 1; // décalage avant le 1er (0 = lundi)
  const daysInMonth = new Date(year, month + 1, 0).getDate();
  const moisDebut = toISODate(new Date(year, month, 1));
  const moisFin = toISODate(new Date(year, month, daysInMonth));

  const table = gestion ? 'planning_agents' : 'planning_agents_consultation';
  const { data: lignes, error } = await sb.from(table).select('*').gte('date', moisDebut).lte('date', moisFin);
  if (error) { view.innerHTML = toggleHTML + '<div class="card"><div class="empty">Erreur de chargement.</div></div>'; return; }

  const agentById = Object.fromEntries(agentsCommunaux.map(a => [a.id, a]));
  const lignesParJour = {};
  (lignes||[]).forEach(l => { (lignesParJour[l.date] ||= []).push(l); });

  const joursSemaineLabels = ['L','M','M','J','V','S','D'];
  let cellsHTML = joursSemaineLabels.map(j => `<div class="cal-head">${j}</div>`).join('');
  for (let i = 0; i < startDay; i++) cellsHTML += `<div class="cal-cell cal-empty"></div>`;
  const joursData = {};
  for (let d = 1; d <= daysInMonth; d++){
    const iso = toISODate(new Date(year, month, d));
    const lignesJour = lignesParJour[iso] || [];
    joursData[iso] = lignesJour;
    const items = lignesJour.map(l => ({ couleur: typePlanningAgentCouleur(l.type), texte: (agentById[l.agent_id]?agentById[l.agent_id].nom:'?') + ' — ' + typePlanningAgentLabel(l.type) }));
    const MAX_VISIBLE = 3;
    const visibles = items.slice(0, MAX_VISIBLE);
    const reste = items.length - visibles.length;
    cellsHTML += `<div class="cal-cell" data-date="${iso}">
      <div class="cal-day">${d}</div>
      <div class="cal-items">
        ${visibles.map(it => `<div class="cal-item" style="background:${it.couleur};">${escapeHTML(it.texte)}</div>`).join('')}
        ${reste > 0 ? `<div class="cal-more">+${reste}</div>` : ''}
      </div>
    </div>`;
  }
  const totalCells = startDay + daysInMonth;
  for (let i = totalCells; i % 7 !== 0; i++) cellsHTML += `<div class="cal-cell cal-empty"></div>`;

  view.innerHTML = toggleHTML + `
    <div class="card no-print" style="display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;">
      <button class="ghost" id="pa-mois-prev">← Mois précédent</button>
      <button class="ghost" id="pa-mois-today">Ce mois</button>
      <button class="ghost" id="pa-mois-next">Mois suivant →</button>
    </div>
    <div class="card no-print" style="display:flex;gap:8px;flex-wrap:wrap;">
      <button class="ghost" id="pa-imprimer">Imprimer / PDF</button>
      <button class="ghost" id="pa-export-csv">Exporter en CSV (Excel)</button>
    </div>
    <div class="card">
      <h3 style="text-align:center;text-transform:capitalize;">${escapeHTML(monthLabelFR(year, month))}</h3>
      <div class="cal-grid">${cellsHTML}</div>
    </div>
  `;

  document.getElementById('pa-imprimer').addEventListener('click', () => window.print());
  document.getElementById('pa-export-csv').addEventListener('click', () => {
    const colonnes = ['Date', 'Agent', 'Type', 'Matin début', 'Matin fin', 'Après-midi début', 'Après-midi fin', 'Lieu', 'Remplacé par'];
    if (gestion) colonnes.push('Commentaire');
    const lignesCsv = [colonnes];
    for (let d = 1; d <= daysInMonth; d++){
      const iso = toISODate(new Date(year, month, d));
      (lignesParJour[iso] || []).forEach(l => {
        const a = agentById[l.agent_id];
        const ligne = [
          formatDateFR(iso), a ? a.nom : '?', typePlanningAgentLabel(l.type),
          l.matin_debut || '', l.matin_fin || '', l.apresmidi_debut || '', l.apresmidi_fin || '', l.lieu || '',
          (l.remplacant_id && agentById[l.remplacant_id]) ? agentById[l.remplacant_id].nom : ''
        ];
        if (gestion) ligne.push(l.commentaire || '');
        lignesCsv.push(ligne);
      });
    }
    telechargerCSV(`planning-agents-${monthLabelFR(year, month).replace(/\s+/g,'-')}.csv`, lignesCsv);
  });

  brancherAccesPlanningAgents();
  document.getElementById('pa-vue-semaine').addEventListener('click', () => { state.paVue = 'semaine'; renderView(); });
  document.getElementById('pa-vue-mois').addEventListener('click', () => { state.paVue = 'mois'; renderView(); });
  document.getElementById('pa-vue-present').addEventListener('click', () => { state.paVue = 'present'; renderView(); });

  document.getElementById('pa-mois-prev').addEventListener('click', () => {
    state.paMonth--; if (state.paMonth < 0) { state.paMonth = 11; state.paYear--; } renderView();
  });
  document.getElementById('pa-mois-next').addEventListener('click', () => {
    state.paMonth++; if (state.paMonth > 11) { state.paMonth = 0; state.paYear++; } renderView();
  });
  document.getElementById('pa-mois-today').addEventListener('click', () => {
    const n = new Date(); state.paMonth = n.getMonth(); state.paYear = n.getFullYear(); renderView();
  });

  view.querySelectorAll('.cal-cell[data-date]').forEach(cell => {
    cell.addEventListener('click', () => ouvrirDetailJourPlanningAgents(cell.dataset.date, joursData[cell.dataset.date] || [], agentById, agentsCommunaux, gestion));
  });
}

// Détail d'un jour depuis la vue mois : statut de chaque agent communal,
// avec accès direct à la modification pour le niveau Gestion.
function ouvrirDetailJourPlanningAgents(dateISO, lignesJour, agentById, agentsCommunaux, gestion){
  const ligneParAgent = Object.fromEntries(lignesJour.map(l => [l.agent_id, l]));
  const titreJour = new Date(dateISO + 'T00:00:00').toLocaleDateString('fr-FR', { weekday: 'long', day: 'numeric', month: 'long' });
  openModal(`
    <h3 style="text-transform:capitalize;">${escapeHTML(titreJour)}</h3>
    ${!agentsCommunaux.length ? '<div class="empty" style="padding:10px 0;">Aucun agent communal.</div>' : agentsCommunaux.map(a => {
      const ligne = ligneParAgent[a.id];
      const couleur = ligne ? typePlanningAgentCouleur(ligne.type) : 'var(--stone-dark)';
      const texte = ligne
        ? typePlanningAgentLabel(ligne.type) + (formatHorairesJour(ligne) ? ' · ' + escapeHTML(formatHorairesJour(ligne)) : '')
        : 'Non planifié';
      return `<div class="jour-detail-item" style="border-left-color:${couleur};display:flex;align-items:center;justify-content:space-between;gap:8px;">
        <div>
          <div class="jour-detail-titre">${escapeHTML(a.nom)}</div>
          <div class="jour-detail-meta">${texte}${ligne && ligne.lieu ? ' · ' + escapeHTML(ligne.lieu) : ''}</div>
        </div>
        ${gestion ? `<button class="ghost" data-role="pa-detail-modifier" data-agent="${escapeHTML(a.id)}" style="flex-shrink:0;">Modifier</button>` : ''}
      </div>`;
    }).join('')}
    <div class="modal-actions"><button class="ghost" id="modal-cancel">Fermer</button></div>
  `);
  document.getElementById('modal-cancel').addEventListener('click', closeModal);
  document.querySelectorAll('[data-role=pa-detail-modifier]').forEach(btn => {
    btn.addEventListener('click', () => {
      const agent = agentById[btn.dataset.agent];
      const ligne = ligneParAgent[btn.dataset.agent];
      closeModal();
      ouvrirModaleJourAgent(agent, dateISO, ligne, agentsCommunaux);
    });
  });
}

// Création/modification d'une journée pour un agent communal donné.
// N'est jamais appelée pour un niveau « consultation » (voir wiring dans
// renderPlanningAgentsCommunaux) — mais la RLS protège aussi cet accès
// indépendamment de ce garde-fou côté client.
function ouvrirModaleJourAgent(agent, dateISO, ligne, agentsCommunaux){
  const autresAgents = agentsCommunaux.filter(a => a.id !== agent.id);
  openModal(`
    <h3>${escapeHTML(agent.nom)}</h3>
    <div class="week-sub" style="margin-bottom:10px;">${escapeHTML(formatDateFR(dateISO))}</div>
    <div><div class="week-sub">Type</div><select id="pa-type">${optionsTypesPlanningAgentHTML(ligne ? ligne.type : 'travail')}</select></div>
    <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:10px;">
      <span class="week-sub" style="width:60px;">Matin</span>
      <input type="time" step="60" id="pa-matin-debut" value="${heureTexteVersHHMM((ligne && ligne.matin_debut) || '')}" style="width:120px;">
      <input type="time" step="60" id="pa-matin-fin" value="${heureTexteVersHHMM((ligne && ligne.matin_fin) || '')}" style="width:120px;">
    </div>
    <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:6px;">
      <span class="week-sub" style="width:60px;">Après-midi</span>
      <input type="time" step="60" id="pa-apresmidi-debut" value="${heureTexteVersHHMM((ligne && ligne.apresmidi_debut) || '')}" style="width:120px;">
      <input type="time" step="60" id="pa-apresmidi-fin" value="${heureTexteVersHHMM((ligne && ligne.apresmidi_fin) || '')}" style="width:120px;">
    </div>
    <div style="margin-top:10px;"><div class="week-sub">Lieu / service (facultatif)</div><input type="text" id="pa-lieu" value="${escapeHTML((ligne && ligne.lieu) || '')}" style="width:100%;"></div>
    <div style="margin-top:10px;"><div class="week-sub">Remplacé par (facultatif)</div><select id="pa-remplacant"><option value="">— Aucun —</option>${autresAgents.map(a => `<option value="${escapeHTML(a.id)}" ${ligne && ligne.remplacant_id === a.id ? 'selected' : ''}>${escapeHTML(a.nom)}</option>`).join('')}</select></div>
    <div style="margin-top:10px;"><div class="week-sub">Commentaire (facultatif)</div><textarea id="pa-commentaire" style="width:100%;min-height:56px;">${escapeHTML((ligne && ligne.commentaire) || '')}</textarea></div>
    <div class="msg" id="pa-modal-msg"></div>
    <div class="modal-actions" style="justify-content:space-between;">
      ${ligne ? '<button class="ghost" id="pa-supprimer" style="color:var(--tuile);">Supprimer</button>' : '<span></span>'}
      <div style="display:flex;gap:8px;">
        <button class="ghost" id="modal-cancel">Annuler</button>
        <button class="primary" id="modal-confirm">Enregistrer</button>
      </div>
    </div>
  `);
  document.getElementById('modal-cancel').addEventListener('click', closeModal);

  document.getElementById('modal-confirm').addEventListener('click', async (e) => {
    const type = document.getElementById('pa-type').value;
    let matin_debut = document.getElementById('pa-matin-debut').value.trim();
    let matin_fin = document.getElementById('pa-matin-fin').value.trim();
    let apresmidi_debut = document.getElementById('pa-apresmidi-debut').value.trim();
    let apresmidi_fin = document.getElementById('pa-apresmidi-fin').value.trim();
    const lieu = document.getElementById('pa-lieu').value.trim();
    const remplacant_id = document.getElementById('pa-remplacant').value;
    const commentaire = document.getElementById('pa-commentaire').value.trim();
    const mmsg = document.getElementById('pa-modal-msg');
    mmsg.textContent = ''; mmsg.className = 'msg';

    // « Repos » : les horaires n'ont pas de sens, on les vide plutôt que
    // de garder d'éventuelles valeurs laissées par un type précédent.
    if (type === 'repos') { matin_debut = ''; matin_fin = ''; apresmidi_debut = ''; apresmidi_fin = ''; }

    const erreur = validerHorairesDemiJournees(matin_debut, matin_fin, apresmidi_debut, apresmidi_fin);
    if (erreur) { mmsg.textContent = erreur; mmsg.className = 'msg err'; return; }

    const herites = deriverHorairesHerites(matin_debut, matin_fin, apresmidi_debut, apresmidi_fin);
    const payload = {
      agent_id: agent.id, date: dateISO, type,
      matin_debut: matin_debut || null, matin_fin: matin_fin || null,
      apresmidi_debut: apresmidi_debut || null, apresmidi_fin: apresmidi_fin || null,
      ...herites,
      lieu: lieu || null,
      remplacant_id: remplacant_id || null, commentaire: commentaire || null,
      updated_by: state.agent.id
    };

    await withLoading(e.currentTarget, 'Enregistrement…', async () => {
      let err;
      if (ligne) {
        ({ error: err } = await sb.from('planning_agents').update(payload).eq('id', ligne.id));
      } else {
        ({ error: err } = await sb.from('planning_agents').insert({ ...payload, created_by: state.agent.id }));
      }
      if (err) { mmsg.textContent = 'Erreur : ' + err.message; mmsg.className = 'msg err'; return; }

      await sb.from('planning_agents_historique').insert({
        agent_id: agent.id,
        action: ligne ? 'modification' : 'creation',
        description: `Planning de ${agent.nom} ${ligne ? 'modifié' : 'créé'} pour le ${formatDateFR(dateISO)} par ${state.agent.nom}`,
        auteur_id: state.agent.id
      }).then(({error}) => { if (error) console.error('Historique non enregistré', error); });

      closeModal();
      showToast('Enregistré.', 'success');
      renderView();
    });
  });

  const btnSupprimer = document.getElementById('pa-supprimer');
  if (btnSupprimer) {
    btnSupprimer.addEventListener('click', async (e) => {
      if (!confirm(`Supprimer cette entrée du planning de ${agent.nom} pour le ${formatDateFR(dateISO)} ?`)) return;
      await withLoading(e.currentTarget, 'Suppression…', async () => {
        const { error: err } = await sb.from('planning_agents').delete().eq('id', ligne.id);
        if (err) { showToast('Erreur : ' + err.message, 'error'); return; }
        await sb.from('planning_agents_historique').insert({
          agent_id: agent.id, action: 'suppression',
          description: `Entrée du ${formatDateFR(dateISO)} supprimée du planning de ${agent.nom} par ${state.agent.nom}`,
          auteur_id: state.agent.id
        }).then(({error}) => { if (error) console.error('Historique non enregistré', error); });
        closeModal();
        showToast('Entrée supprimée.', 'success');
        renderView();
      });
    });
  }
}

initAuth();
</script>
