<style>
  :root{
    --navy:#1B2A41;
    --stone:#EDE7D9;
    --stone-dark:#DED5BF;
    --tuile:#C1502E;
    --foret:#3F5C48;
    --ocre:#C98A3A;
    --ink:#242019;
    --white:#FFFFFF;
    --radius:3px;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--stone);
    color:var(--ink);
    font-family:'IBM Plex Sans', sans-serif;
    line-height:1.5;
  }
  h1,h2,h3{
    font-family:'Fraunces', serif;
    font-weight:600;
    margin:0 0 .4em 0;
    color:var(--navy);
  }
  header.top{
    background:var(--navy);
    color:var(--stone);
    padding:18px 20px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    flex-wrap:wrap;
    gap:8px;
  }
  header.top .brand{
    font-family:'Fraunces', serif;
    font-size:1.2rem;
    font-weight:600;
    letter-spacing:.2px;
  }
  header.top .brand span{
    display:block;
    font-family:'IBM Plex Sans', sans-serif;
    font-size:.72rem;
    font-weight:400;
    opacity:.72;
    letter-spacing:.4px;
  }
  header.top .who{
    font-size:.85rem;
    display:flex;
    align-items:center;
    gap:10px;
    flex-wrap:wrap;
  }
  header.top button{
    background:transparent;
    border:1px solid rgba(237,231,217,.4);
    color:var(--stone);
    padding:6px 12px;
    border-radius:var(--radius);
    cursor:pointer;
    font-size:.8rem;
    font-family:inherit;
  }
  header.top button:hover{background:rgba(237,231,217,.12);}

  main{
    max-width:760px;
    margin:0 auto;
    padding:24px 18px 80px;
  }

  nav.tabs{
    display:flex;
    gap:2px;
    margin-bottom:22px;
    border-bottom:1px solid var(--stone-dark);
    overflow-x:auto;
  }
  nav.tabs button{
    background:none;
    border:none;
    padding:10px 4px;
    margin-right:22px;
    font-family:'IBM Plex Sans', sans-serif;
    font-size:.92rem;
    font-weight:500;
    color:#8a8272;
    cursor:pointer;
    border-bottom:2px solid transparent;
    white-space:nowrap;
  }
  nav.tabs button.active{
    color:var(--navy);
    border-bottom:2px solid var(--tuile);
  }

  .card{
    background:var(--white);
    border:1px solid var(--stone-dark);
    border-radius:var(--radius);
    padding:18px;
    margin-bottom:14px;
  }

  .week-row{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:14px 0;
    border-bottom:1px solid var(--stone-dark);
    gap:12px;
    flex-wrap:wrap;
  }
  .week-row:last-child{border-bottom:none;}
  .week-label{font-weight:500;}
  .week-sub{font-size:.78rem;color:#8a8272;margin-top:2px;}

  /* Planning agents communaux — vue semaine : cartes empilées par jour
     sur mobile, tableau agents×jours au-delà de 700px (point 3 du
     cahier des charges : mobile-first, tableau en plus sur grand écran). */
  .pa-desktop{display:none;}
  @media (min-width:700px){
    .pa-week-mobile{display:none;}
    .pa-desktop{display:table;width:100%;border-collapse:separate;border-spacing:0 4px;}
    .pa-desktop th{font-size:.72rem;font-weight:700;color:#8a8272;text-align:center;padding:4px 2px;text-transform:uppercase;}
    .pa-desktop th:first-child{text-align:left;}
    .pa-desktop td{border:1px solid var(--stone-dark);border-radius:var(--radius);padding:6px 4px;text-align:center;font-size:.76rem;vertical-align:top;cursor:pointer;}
    .pa-desktop td.pa-agent-nom{border:none;text-align:left;font-weight:500;cursor:default;white-space:nowrap;}
    .pa-desktop .pa-cell-type{display:inline-block;padding:2px 6px;border-radius:10px;color:var(--white);font-size:.68rem;font-weight:600;margin-bottom:2px;}
  }

  .pill{
    display:inline-block;
    padding:3px 10px;
    border-radius:12px;
    font-size:.74rem;
    font-weight:500;
  }
  .pill.oui{background:#E4EBE5;color:var(--foret);}
  .pill.non{background:#F1E4E0;color:var(--tuile);}
  .pill.partiel{background:#F3E9D8;color:var(--ocre);}
  .pill.publiee{background:var(--navy);color:var(--stone);}

  .week-sub.urgent{color:var(--tuile);font-weight:600;}
  .week-sub.soon{color:var(--ocre);font-weight:600;}

  details.week-accordion{border-bottom:1px solid var(--stone-dark);}
  details.week-accordion:last-child{border-bottom:none;}
  details.week-accordion summary{
    display:flex;justify-content:space-between;align-items:center;
    padding:14px 0;gap:12px;flex-wrap:wrap;cursor:pointer;list-style:none;
  }
  details.week-accordion summary::-webkit-details-marker{display:none;}
  details.week-accordion summary::after{
    content:'▾';color:#8a8272;font-size:.8rem;flex-shrink:0;transition:transform .15s;
  }
  details.week-accordion[open] summary::after{transform:rotate(180deg);}
  details.week-accordion .week-accordion-actions{
    display:flex;gap:6px;flex-wrap:wrap;padding:0 0 14px;
  }

  select, input[type=date], input[type=time], input[type=email], input[type=text], input[type=password], textarea{
    font-family:inherit;
    font-size:.88rem;
    padding:7px 9px;
    border:1px solid var(--stone-dark);
    border-radius:var(--radius);
    background:var(--white);
    max-width:100%;
    box-sizing:border-box;
  }
  /* Un <select> est un enfant flex : sans min-width:0, son texte le plus
     long (ex. "Nom Prénom (non déclaré disponible)") l'empêche de se
     réduire en dessous de sa largeur de contenu, même avec max-width:100%
     — il dépassait alors l'écran sur mobile au lieu de se limiter à la
     largeur de la carte. */
  select{min-width:0;}

  button.primary{
    background:var(--tuile);
    color:var(--white);
    border:none;
    padding:9px 16px;
    border-radius:var(--radius);
    font-family:inherit;
    font-size:.86rem;
    font-weight:500;
    cursor:pointer;
  }
  button.primary:hover{background:#A8431F;}
  button.primary:disabled{background:#ccc;cursor:not-allowed;}

  button.ghost{
    background:none;
    border:1px solid var(--stone-dark);
    color:var(--ink);
    padding:8px 14px;
    border-radius:var(--radius);
    font-family:inherit;
    font-size:.84rem;
    cursor:pointer;
  }
  button.ghost:hover{border-color:var(--navy);}
  button.ghost:disabled, button.primary:disabled{opacity:.6;cursor:not-allowed;}

  .empty{
    text-align:center;
    color:#8a8272;
    padding:30px 10px;
    font-size:.9rem;
  }
  .warn-text{color:var(--tuile);font-size:.78rem;margin-top:2px;}

  #login-screen{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    background:var(--navy);
    padding:20px;
  }
  #login-screen .box{
    background:var(--stone);
    padding:34px 30px;
    border-radius:var(--radius);
    max-width:360px;
    width:100%;
  }
  #login-screen .box h1{font-size:1.4rem;}
  #login-screen .box p{font-size:.86rem;color:#5a5346;}
  #login-screen input{width:100%;margin:10px 0;}
  .pw-wrap{position:relative;margin:10px 0;}
  .pw-wrap input{width:100%;margin:0;padding-right:66px;}
  .pw-toggle{
    position:absolute;right:4px;top:50%;transform:translateY(-50%);
    background:none;border:none;color:var(--navy);font-size:.74rem;
    cursor:pointer;padding:6px 8px;font-family:inherit;
  }
  #login-screen button{width:100%;margin-top:6px;}
  #login-screen .pw-toggle, #modal-content .pw-toggle{width:auto;margin-top:0;}

  .msg{font-size:.82rem;margin-top:10px;}
  .msg.ok{color:var(--foret);}
  .msg.err{color:var(--tuile);}

  table.balance{width:100%;border-collapse:collapse;font-size:.86rem;}
  table.balance th, table.balance td{
    text-align:left;
    padding:7px 4px;
    border-bottom:1px solid var(--stone-dark);
  }
  table.balance th{color:#8a8272;font-weight:500;font-size:.76rem;}

  .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;}
  .cal-head{font-size:.62rem;font-weight:600;color:#8a8272;text-align:center;padding:2px 0 6px;text-transform:uppercase;letter-spacing:.02em;}
  .cal-cell{min-height:48px;border:1px solid var(--stone-dark);border-radius:var(--radius);padding:3px 2px;font-size:.7rem;background:var(--white);display:flex;flex-direction:column;align-items:center;overflow:hidden;}
  .cal-cell.cal-empty{border-color:transparent;background:transparent;}
  .cal-day{font-weight:500;font-size:.72rem;line-height:1.3;}
  .cal-cell.cal-astreinte{background:#EDF2EE;border-color:#CFDED2;}
  .cal-cell.cal-mine{background:var(--tuile);border-color:var(--tuile);}
  .cal-cell.cal-mine .cal-day, .cal-cell.cal-mine .cal-agent{color:var(--white);}
  .cal-agent{
    font-size:.56rem;
    line-height:1.1;
    color:var(--foret);
    text-align:center;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
    width:100%;
    margin-top:1px;
  }
  .cal-event{
    font-size:.52rem;
    line-height:1.1;
    color:var(--navy);
    font-style:italic;
    text-align:center;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
    width:100%;
    margin-top:1px;
  }
  .cal-cell.cal-mine .cal-event{color:var(--white);}
  /* Cartes compactes par jour (astreinte + événements), remplaçant les

  /* Toasts */

</style>

<script>
// =========================================================
// CONFIGURATION — vos clés (inchangées)
// =========================================================
const SUPABASE_URL = "https://ayfwjgzdspjkmmurefge.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_ohyUYzHMz4ARxvVhpFwdsQ_pT9XzfeX";
const EMAILJS_PUBLIC_KEY = "bvTa8FUhj5JomRvGS";
const EMAILJS_SERVICE_ID = "service_sfgxgtq";
const EMAILJS_TEMPLATE_ID = "template_4jh4miq";
// Facultatif : template EmailJS dédié à la relance des non-répondants
// (texte différent : "merci de déclarer votre disponibilité..." plutôt
// que "vous êtes désigné..."). Tant qu'il n'est pas configuré, le
// bouton de relance l'indique clairement plutôt que d'échouer en silence.
const EMAILJS_TEMPLATE_RAPPEL_ID = "template_pdqi22m";

// Numéro de version affiché sur l'écran de connexion — format AAAA.MM.JJ
// (date de la dernière modification du fichier), à mettre à jour à
// chaque modification, aussi mineure soit-elle.
const APP_VERSION = "2026.09.17v";
document.getElementById('app-version').textContent = `v${APP_VERSION}`;

const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
if (window.emailjs) emailjs.init(EMAILJS_PUBLIC_KEY);

let state = {
  session: null,
  agent: null,      // ligne agents correspondant à l'utilisateur connecté
  isAdmin: false,
  tab: 'dispos',
  showPasseesAgent: false,
  showHistoriqueAdmin: false,
  showHistoriqueSemaines: false,
  showEvenementsPasses: false,
  highlight: null, // { type: 'semaine'|'echange'|'remplacement'|'agent', id } — mis à la volée par le tableau de bord pour repérer un élément après navigation
  planningVue: 'liste', // 'liste' | 'calendrier'
  calYear: new Date().getFullYear(),
  calMonth: new Date().getMonth() // 0 = janvier
};

// =========================================================
// UTILITAIRES GÉNÉRAUX
// =========================================================

// Échappe toute donnée dynamique avant insertion dans innerHTML.
// Appliqué systématiquement à tout ce qui provient de Supabase
// (noms, téléphones, statuts...) pour empêcher une injection HTML/XSS.
function escapeHTML(str){
  if (str === null || str === undefined) return '';
  return String(str).replace(/[&<>"']/g, c => ({
    '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;'
  }[c]));
}

// Même format que la contrainte CHECK côté base (agents_email_format_check) :
// un retour immédiat à la saisie, la base restant l'autorité finale.
function emailValide(str){
  return /^[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}$/.test(str);
}

function showToast(message, type){
  type = type || 'info';
  const wrap = document.getElementById('toast-wrap');
  const t = document.createElement('div');
  t.className = 'toast ' + type;
  t.textContent = message;
  wrap.appendChild(t);
  setTimeout(() => t.remove(), 4200);
}

function openModal(html){
  document.getElementById('modal-content').innerHTML = html;
  document.getElementById('modal-backdrop').classList.remove('hidden');
}
function closeModal(){
  document.getElementById('modal-backdrop').classList.add('hidden');
  document.getElementById('modal-content').innerHTML = '';
}
document.getElementById('modal-backdrop').addEventListener('click', (e) => {
  if (e.target.id === 'modal-backdrop') closeModal();
});

// Bouton "Afficher / Masquer" pour tous les champs mot de passe, présents
// et futurs (délégation d'événements, car certains sont injectés dans la modale).
document.addEventListener('click', (e) => {
  const btn = e.target.closest('.pw-toggle');
  if (!btn) return;
  const input = document.getElementById(btn.dataset.target);
  if (!input) return;
  const masque = input.type === 'password';
  input.type = masque ? 'text' : 'password';
  btn.textContent = masque ? 'Masquer' : 'Afficher';
});

// Désactive un bouton et change son texte le temps d'une opération,
// puis le restaure systématiquement (même en cas d'erreur), pour
// éviter les doubles clics et informer l'utilisateur de l'attente.
async function withLoading(btn, loadingLabel, fn){
  if (!btn) return fn();
  const original = btn.textContent;
  btn.disabled = true;
  btn.textContent = loadingLabel;
  try {
    return await fn();
  } finally {
    btn.disabled = false;
    btn.textContent = original;
  }
}

// Enveloppe un appel Supabase : vérifie systématiquement `error`,
// affiche un toast clair en cas d'échec (réseau ou métier), et ne
// laisse jamais une opération échouée passer pour une réussite.
async function sbCall(promiseFn, errCtx){
  try {
    const result = await promiseFn();
    if (result && result.error) {
      showToast((errCtx ? errCtx + ' : ' : '') + result.error.message, 'error');
      return { data: null, error: result.error };
    }
    return { data: result ? result.data : null, error: null };
  } catch (e) {
    showToast((errCtx ? errCtx + ' : ' : '') + (e && e.message ? e.message : 'Erreur réseau'), 'error');
    return { data: null, error: e };
  }
}

function formatDateFR(d){
  const dt = new Date(d + 'T00:00:00');
  return dt.toLocaleDateString('fr-FR', {day:'2-digit', month:'2-digit'});
}
// Format sans caractère "/" pour les emails : EmailJS échappe automatiquement
// le "/" en "&#x2F;" (protection HTML), ce qui s'affichait en clair dans le
// sujet des emails. On utilise donc un format textuel ("14 septembre") pour
// tout ce qui part par email.
function formatDateEmail(d){
  const dt = new Date(d + 'T00:00:00');
  return dt.toLocaleDateString('fr-FR', {day:'2-digit', month:'long'});
}
// Pour un horodatage complet (avec heure), ex. la dernière connexion d'un
// agent — contrairement aux fonctions ci-dessus qui ne traitent que des
// dates sans heure (date_debut, date_fin, etc.).
function formatDateHeureFR(iso){
  if (!iso) return null;
  return new Date(iso).toLocaleDateString('fr-FR', {day:'2-digit', month:'2-digit', year:'numeric', hour:'2-digit', minute:'2-digit'});
}
// Formate un objet Date en 'YYYY-MM-DD' à partir de ses composantes LOCALES
// (et non UTC comme le ferait toISOString(), qui peut faire glisser la date
// d'un jour selon le fuseau horaire et l'heure d'été/hiver du navigateur).
function toISODate(date){
  const y = date.getFullYear();
  const m = String(date.getMonth() + 1).padStart(2, '0');
  const d = String(date.getDate()).padStart(2, '0');
  return `${y}-${m}-${d}`;
}
// Génère un CSV (séparateur point-virgule, plus fiable qu'une virgule
// pour l'Excel francophone) et déclenche son téléchargement. Le BOM UTF-8
// en tête évite qu'Excel n'affiche les accents comme du charabia.
function telechargerCSV(nomFichier, lignes){
  const echapper = (v) => {
    const s = String(v ?? '');
    return /[;"\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
  };
  const contenu = '\uFEFF' + lignes.map(ligne => ligne.map(echapper).join(';')).join('\r\n');
  const blob = new Blob([contenu], { type: 'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = nomFichier;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}
function weekLabel(s){
  return `Semaine du ${formatDateFR(s.date_debut)} au ${formatDateFR(s.date_fin)}`;
}

// =========================================================
// TYPES D'ÉVÉNEMENTS (agenda communal)
// Catalogue centralisé — clé technique (stockée en base, colonne
// evenements.type) -> libellé affiché + couleur. Pour ajouter un type,
// il suffit d'ajouter une entrée ici (et d'autoriser la valeur côté
// SQL si une contrainte CHECK est en place). 'autre' sert de repli si
// une valeur inconnue ou absente est rencontrée.
// =========================================================
const TYPES_EVENEMENT = {
  conseil_municipal:  { label: 'Conseil municipal',    couleur: 'var(--ocre)' },
  commission:          { label: 'Commission',            couleur: '#5B4B7A' },
  reunion_travail:     { label: 'Réunion de travail',    couleur: '#6B5D52' },
  ceremonie:           { label: 'Cérémonie',             couleur: 'var(--foret)' },
  manifestation:       { label: 'Manifestation',         couleur: '#B79A3D' },
  bapteme:             { label: 'Baptême',               couleur: '#8C5B5B' },
  mariage_pacs:        { label: 'Mariage / PACS',        couleur: 'var(--tuile)' },
  autre:               { label: 'Autre',                 couleur: '#6B6355' }
};
// Couleur dédiée à l'astreinte (qui/planning) telle qu'affichée dans le
// calendrier — distincte des types d'événements ci-dessus : il s'agit
// d'une désignation existante (table planning), pas d'un evenement.
const ASTREINTE_ROSTER_COULEUR = '#3D5A73';
function typeEvenementInfo(t){
  return TYPES_EVENEMENT[t] || TYPES_EVENEMENT.autre;
}
function typeEvenementLabel(t){
  return typeEvenementInfo(t).label;
}
function typeEvenementCouleur(t){
  return typeEvenementInfo(t).couleur;
}
// Évite le doublon visuel « [Conseil municipal] Conseil municipal » quand
// l'intitulé reprend simplement le nom du type : dans ce cas précis, le
// badge n'apporte aucune information supplémentaire et peut être masqué.
function typeApporteInfo(type, intitule){
  return typeEvenementLabel(type).trim().toLowerCase() !== (intitule || '').trim().toLowerCase();
}
// Au-delà de ce nombre, la liste de participants se replie derrière un
// compteur (« 5 participants ») plutôt que d'afficher tous les noms en
// ligne — évite les lignes à rallonge sur mobile pour les réunions à
// 8, 10, 15 participants. En dessous, autant tout afficher directement.
const PARTICIPANTS_SEUIL_REPLI = 4;
function participantsResumeHTML(noms, prefixe){
  if (!noms.length) return '';
  if (noms.length <= PARTICIPANTS_SEUIL_REPLI) return prefixe + noms.map(escapeHTML).join(', ');
  return `<details><summary style="cursor:pointer;">${noms.length} participants</summary><div style="margin-top:3px;">${noms.map(escapeHTML).join(' · ')}</div></details>`;
}

// =========================================================
// PLANNING AGENTS COMMUNAUX — catalogue des types de journée.
// Couleurs choisies pour rester distinctes de TYPES_EVENEMENT (aucune
// réutilisée telle quelle) tout en restant sobres, cohérentes avec le
// reste de l'appli.
// =========================================================
const TYPES_PLANNING_AGENT = {
  travail:    { label: 'Travail',    couleur: 'var(--foret)' },
  repos:      { label: 'Repos',      couleur: '#3D5A73' },
  conge:      { label: 'Congé',      couleur: 'var(--ocre)' },
  absence:    { label: 'Absence',    couleur: 'var(--tuile)' },
  formation:  { label: 'Formation',  couleur: '#5B4B7A' },
  reunion:    { label: 'Réunion',    couleur: '#B79A3D' },
  autre:      { label: 'Autre',      couleur: '#6B6355' }
};
function typePlanningAgentInfo(t){
  return TYPES_PLANNING_AGENT[t] || TYPES_PLANNING_AGENT.autre;
}
function typePlanningAgentLabel(t){
  return typePlanningAgentInfo(t).label;
}
function typePlanningAgentCouleur(t){
  return typePlanningAgentInfo(t).couleur;
}
function optionsTypesPlanningAgentHTML(valeurSelectionnee){
  return Object.entries(TYPES_PLANNING_AGENT).map(([val, info]) =>
    `<option value="${val}" ${valeurSelectionnee === val ? 'selected' : ''}>${escapeHTML(info.label)}</option>`
  ).join('');
}
// Lundi = 1 … Dimanche = 7 (ISO), pour aligner avec jour_semaine en base.
function isoJourSemaine(date){
  const j = date.getDay();
  return j === 0 ? 7 : j;
}
function lundiDeLaSemaine(date){
  const d = new Date(date);
  const decalage = isoJourSemaine(d) - 1;
  d.setDate(d.getDate() - decalage);
  d.setHours(0,0,0,0);
  return d;
}

// Affichage des horaires d'une journée (planning_agents ou
// horaires_recurrents) : privilégie la tranche matin/après-midi si elle
// est renseignée (plus précis), sinon retombe sur l'ancien couple
// heure_debut/heure_fin (compatibilité avec les données saisies avant
// l'ajout des tranches).
function formatHorairesJour(l){
  if (!l) return '';
  const aMatin = l.matin_debut || l.matin_fin;
  const aApresMidi = l.apresmidi_debut || l.apresmidi_fin;
  if (aMatin || aApresMidi) {
    const parts = [];
    if (aMatin) parts.push(`${hhmmVersAffichage(l.matin_debut) || '?'}–${hhmmVersAffichage(l.matin_fin) || '?'}`);
    if (aApresMidi) parts.push(`${hhmmVersAffichage(l.apresmidi_debut) || '?'}–${hhmmVersAffichage(l.apresmidi_fin) || '?'}`);
    return parts.join(' · ');
  }
  if (l.heure_debut) return l.heure_debut + (l.heure_fin ? '–' + l.heure_fin : '');
  return '';
}
// Calcule les champs hérités (heure_debut/heure_fin/pause) à partir des
// deux tranches saisies, pour que tout l'affichage existant (qui lit ces
// colonnes) continue de fonctionner sans modification.
function deriverHorairesHerites(matin_debut, matin_fin, apresmidi_debut, apresmidi_fin){
  const heure_debut = matin_debut || apresmidi_debut || null;
  const heure_fin = apresmidi_fin || matin_fin || null;
  const pause = (matin_fin && apresmidi_debut) ? `${matin_fin}–${apresmidi_debut}` : null;
  return { heure_debut, heure_fin, pause };
}

// Normalise une valeur d'horaire déjà enregistrée (ancien format texte
// libre "8h00"/"8h", ou déjà "08:00") vers le format HH:MM attendu par
// <input type="time"> — nécessaire pour que les données saisies avant
// ce changement continuent de s'afficher correctement dans le nouveau
// sélecteur natif. Retourne '' si la valeur est vide ou illisible.
function heureTexteVersHHMM(s){
  if (!s) return '';
  const m = String(s).trim().match(/^(\d{1,2})[h:](\d{0,2})$/i);
  if (!m) return '';
  const h = parseInt(m[1], 10);
  const min = m[2] ? parseInt(m[2], 10) : 0;
  if (isNaN(h) || h > 23 || isNaN(min) || min > 59) return '';
  return String(h).padStart(2, '0') + ':' + String(min).padStart(2, '0');
}
// Reconvertit une valeur HH:MM (format natif du sélecteur, et format de
// stockage retenu) vers "8h00", le style utilisé partout ailleurs dans
// l'appli (astreinte, agenda communal, emails) — pour rester cohérent
// visuellement au sein du module Planning agents communaux.
function hhmmVersAffichage(hhmm){
  if (!hhmm) return '';
  const m = String(hhmm).match(/^(\d{1,2}):(\d{2})$/);
  if (!m) return hhmm; // valeur historique déjà dans l'ancien format : affichée telle quelle
  return String(parseInt(m[1], 10)) + 'h' + m[2];
}
// Cohérence des deux demi-journées avant enregistrement. Renseigner une
// seule des deux demi-journées est parfaitement valide (mi-temps, etc.) —
// ceci ne vérifie que les cas où les valeurs saisies se contredisent.
function validerHorairesDemiJournees(matin_debut, matin_fin, apresmidi_debut, apresmidi_fin){
  if (matin_debut && matin_fin && matin_debut >= matin_fin) return 'Le matin : l\'heure de début doit être avant l\'heure de fin.';
  if (apresmidi_debut && apresmidi_fin && apresmidi_debut >= apresmidi_fin) return 'L\'après-midi : l\'heure de début doit être avant l\'heure de fin.';
  if (matin_fin && apresmidi_debut && matin_fin > apresmidi_debut) return 'L\'après-midi doit commencer après la fin du matin.';
  return null;
}

function optionsTypesEvenementHTML(valeurSelectionnee){
  return Object.entries(TYPES_EVENEMENT).map(([val, info]) =>
    `<option value="${val}" ${valeurSelectionnee === val ? 'selected' : ''}>${escapeHTML(info.label)}</option>`
  ).join('');
}
// Types pour lesquels la publication « présent/absent » a un sens (choix
// de François) — un conseil municipal ou un baptême ne se confirment pas
// de cette façon-là, donc le bouton reste masqué pour ces deux types.
const TYPES_PUBLICATION_REPONSES = ['commission', 'reunion_travail', 'ceremonie', 'manifestation', 'autre'];
function publieReponsesToggleHTML(idPrefix, type, checked){
  const visible = TYPES_PUBLICATION_REPONSES.includes(type);
  return `<div id="${idPrefix}-wrap" style="margin-top:10px;${visible ? '' : 'display:none;'}">
    <label style="display:flex;align-items:center;gap:8px;font-size:.88rem;cursor:pointer;">
      <input type="checkbox" id="${idPrefix}" ${checked ? 'checked' : ''} style="width:16px;height:16px;flex-shrink:0;">
      Publier pour réponses présent/absent (participants sélectionnés uniquement)
    </label>
  </div>`;
}
function brancherPublieReponsesToggle(idPrefix, typeSelectId){
  const typeSelect = document.getElementById(typeSelectId);
  const wrap = document.getElementById(idPrefix + '-wrap');
  const checkbox = document.getElementById(idPrefix);
  if (!typeSelect || !wrap) return;
  typeSelect.addEventListener('change', () => {
    const visible = TYPES_PUBLICATION_REPONSES.includes(typeSelect.value);
    wrap.style.display = visible ? '' : 'none';
    if (!visible && checkbox) checkbox.checked = false;
  });
}

// Carte de résumé « Astreinte cette semaine » — affichée en haut de l'écran
// pour que n'importe qui (notamment les comptes lecteur) voie tout de suite
// qui contacter, sans avoir à chercher dans la liste. meId (facultatif)
// permet de le signaler si c'est la propre semaine de la personne connectée.
function astreinteActuelleHTML(semainesToutes, planByWeek, agentById, meId, remplacantsParDate){
  const today = toISODate(new Date());
  const badgeAstreinte = `<span class="pill" style="background:${ASTREINTE_ROSTER_COULEUR};color:var(--white);margin-right:6px;">Astreinte</span>`;
  const semaine = (semainesToutes||[]).find(s => s.statut === 'publiee' && s.date_debut <= today && s.date_fin >= today);
  if (!semaine) {
    return `<div class="card no-print"><h3 style="margin-bottom:2px;">${badgeAstreinte}Cette semaine</h3><div class="empty" style="padding:10px 0;">Aucune astreinte publiée pour la semaine en cours.</div></div>`;
  }
  const p = planByWeek[semaine.id];
  const titulaire = p ? agentById[p.agent_id] : null;
  const remplacant = remplacantsParDate ? remplacantsParDate[today] : null;
  const agent = remplacant || titulaire;
  const mine = agent && meId && agent.id === meId;
  return `
    <div class="card no-print">
      <h3 style="margin-bottom:2px;">${badgeAstreinte}Cette semaine</h3>
      <div class="week-sub" style="margin-bottom:8px;">${escapeHTML(weekLabel(semaine))}</div>
      ${agent
        ? `<div class="week-label" style="font-size:1.05rem;">${escapeHTML(agent.nom)} ${mine ? '<span class="pill publiee">Vous</span>' : ''}</div>
           <div class="week-sub">${escapeHTML(agent.telephone || '')}</div>
           ${remplacant ? `<div class="week-sub" style="color:var(--tuile);margin-top:4px;">Remplacement ponctuel aujourd'hui (titulaire habituel : ${escapeHTML(titulaire ? titulaire.nom : '—')})</div>` : ''}`
        : '<div class="empty" style="padding:6px 0;">Non assigné</div>'}
    </div>`;
}

function monthLabelFR(year, month){
  return new Date(year, month, 1).toLocaleDateString('fr-FR', { month: 'long', year: 'numeric' });
}

// Construit la grille HTML d'un calendrier mensuel : chaque jour appartenant
// à une semaine d'astreinte publiée est mis en évidence avec le nom de
// l'agent assigné. meId (facultatif) surligne différemment ses propres jours.
function renderMonthCalendarHTML(semainesPubliees, planByWeek, agentById, meId, remplacantsParDate, evenementsParDate, planningAgentsParDate){
  const year = state.calYear, month = state.calMonth;
  const first = new Date(year, month, 1);
  const startDay = (first.getDay() + 6) % 7; // 0 = lundi
  const daysInMonth = new Date(year, month + 1, 0).getDate();
  const joursLabels = ['L','M','M','J','V','S','D'];
  const moisDebut = toISODate(new Date(year, month, 1));
  const moisFin = toISODate(new Date(year, month + 1, 0));

  function trouverSemaine(dateObj){
    const iso = toISODate(dateObj);
    return semainesPubliees.find(s => iso >= s.date_debut && iso <= s.date_fin);
  }
  // N'affiche que le nom de famille dans les petites cellules (le détail
  // complet, avec prénom, apparaît dans la légende sous le calendrier).
  function nomCourt(agent){
    return (agent.nom || '').split(' ')[0];
  }

  let cellsHTML = joursLabels.map(j => `<div class="cal-head">${j}</div>`).join('');
  for (let i = 0; i < startDay; i++) cellsHTML += `<div class="cal-cell cal-empty"></div>`;
  const joursData = {};
  for (let d = 1; d <= daysInMonth; d++){
    const date = new Date(year, month, d);
    const iso = toISODate(date);
    const s = trouverSemaine(date);
    const p = s ? planByWeek[s.id] : null;
    const titulaire = p ? agentById[p.agent_id] : null;
    const remplacant = remplacantsParDate ? remplacantsParDate[iso] : null;
    const agent = remplacant || titulaire;
    const mine = agent && meId && agent.id === meId;
    const evenementsJour = (evenementsParDate && evenementsParDate[iso]) || [];
    const planningJour = (planningAgentsParDate && planningAgentsParDate[iso]) || [];
    joursData[iso] = { agent, remplacant, titulaire, evenementsJour, planningJour };

    // Une "carte" compacte par élément du jour (astreinte d'abord, puis
    // chaque événement) — plus lisible qu'un simple point, sans pour
    // autant surcharger une cellule de 7 colonnes sur mobile : au-delà
    // de 3 éléments, un indicateur "+N" prend le relais.
    const items = [];
    if (agent) items.push({ couleur: ASTREINTE_ROSTER_COULEUR, texte: `Astreinte — ${nomCourt(agent)}` });
    evenementsJour.forEach(ev => items.push({ couleur: typeEvenementCouleur(ev.type), texte: typeEvenementLabel(ev.type) + (ev.heure ? ' ' + ev.heure : '') }));
    planningJour.forEach(l => items.push({ couleur: typePlanningAgentCouleur(l.type), texte: `${l.nomAgent} — ${typePlanningAgentLabel(l.type)}` }));
    const MAX_VISIBLE = 3;
    const visibles = items.slice(0, MAX_VISIBLE);
    const reste2 = items.length - visibles.length;
    const chargee = items.length >= 3;

    cellsHTML += `<div class="cal-cell ${agent ? 'cal-astreinte' : ''} ${mine ? 'cal-mine' : ''} ${chargee ? 'cal-chargee' : ''}" data-date="${iso}">
      <div class="cal-day">${d}</div>
      <div class="cal-items">
        ${visibles.map(it => `<div class="cal-item" style="background:${it.couleur};">${escapeHTML(it.texte)}</div>`).join('')}
        ${reste2 > 0 ? `<div class="cal-more">+${reste2}</div>` : ''}
      </div>
    </div>`;
  }
  state.calJoursData = joursData;
  const totalCells = startDay + daysInMonth;
  const reste = (7 - (totalCells % 7)) % 7;
  for (let i = 0; i < reste; i++) cellsHTML += `<div class="cal-cell cal-empty"></div>`;

  // Légende : détail complet (nom + semaine) des astreintes du mois affiché.
  const semainesDuMois = semainesPubliees
    .filter(s => s.date_debut <= moisFin && s.date_fin >= moisDebut)
    .sort((a,b) => a.date_debut < b.date_debut ? -1 : 1);
  const evenementsDuMois = Object.entries(evenementsParDate||{})
    .filter(([iso]) => iso >= moisDebut && iso <= moisFin)
    .sort((a,b) => a[0] < b[0] ? -1 : 1);
  const legendeHTML = (semainesDuMois.length || evenementsDuMois.length) ? `
    <div class="cal-legende" style="flex-direction:column;gap:6px;">
      ${semainesDuMois.map(s => {
        const p = planByWeek[s.id];
        const agent = p ? agentById[p.agent_id] : null;
        return `<span><i style="background:${agent && meId && agent.id===meId ? 'var(--tuile)' : '#CFDED2'};"></i>${escapeHTML(weekLabel(s))} — ${agent ? escapeHTML(agent.nom) : 'non assigné'}</span>`;
      }).join('')}
      ${Object.keys(remplacantsParDate||{}).some(iso => iso >= moisDebut && iso <= moisFin) ? '<span style="opacity:.7;">* remplacement ponctuel ce jour-là</span>' : ''}
      ${evenementsDuMois.flatMap(([iso, evs]) => evs.map(ev =>
        `<span><i style="background:${typeEvenementCouleur(ev.type)};"></i>${escapeHTML(formatDateFR(iso))} — ${typeApporteInfo(ev.type, ev.intitule) ? escapeHTML(typeEvenementLabel(ev.type)) + ' : ' : ''}${escapeHTML(ev.intitule)}${ev.agents.length ? ' (' + ev.agents.map(escapeHTML).join(', ') + ')' : ''}</span>`
      )).join('')}
    </div>` : '';

  const now = new Date();
  const estMoisActuel = year === now.getFullYear() && month === now.getMonth();
  return `
    <div class="card">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;gap:8px;">
        <button class="cal-nav" id="cal-prev" aria-label="Mois précédent">‹</button>
        <h3 style="margin:0;text-transform:capitalize;font-size:1.05rem;text-align:center;">${escapeHTML(monthLabelFR(year, month))}</h3>
        <button class="cal-nav" id="cal-next" aria-label="Mois suivant">›</button>
      </div>
      <div style="text-align:center;margin-bottom:14px;">
        <button class="ghost" id="cal-today" ${estMoisActuel ? 'disabled' : ''} style="padding:3px 14px;font-size:.82rem;">Aujourd'hui</button>
      </div>
      <div class="cal-grid">${cellsHTML}</div>
      ${legendeHTML}
    </div>`;
}

function brancherNavigationCalendrier(view){
  const prev = document.getElementById('cal-prev');
  const next = document.getElementById('cal-next');
  const today = document.getElementById('cal-today');
  if (prev) prev.addEventListener('click', () => {
    state.calMonth--; if (state.calMonth < 0) { state.calMonth = 11; state.calYear--; }
    renderView();
  });
  if (next) next.addEventListener('click', () => {
    state.calMonth++; if (state.calMonth > 11) { state.calMonth = 0; state.calYear++; }
    renderView();
  });
  if (today) today.addEventListener('click', () => {
    const now = new Date();
    state.calYear = now.getFullYear();
    state.calMonth = now.getMonth();
    renderView();
  });
  // Détail d'une journée au clic sur sa cellule — regroupe astreinte et
  // événements du jour, en lecture seule ici (la modification se fait
  // depuis l'onglet Événements). state.calJoursData est renseigné par
  // renderMonthCalendarHTML juste avant l'insertion de ce HTML dans le DOM.
  view.querySelectorAll('.cal-cell[data-date]').forEach(cell => {
    cell.addEventListener('click', () => {
      const iso = cell.dataset.date;
      const jour = (state.calJoursData || {})[iso];
      ouvrirDetailJour(iso, jour);
    });
  });
}

function ouvrirDetailJour(iso, jour){
  if (!jour) return;
  const { agent, remplacant, titulaire, evenementsJour, planningJour } = jour;
  const dateObj = new Date(iso + 'T00:00:00');
  const titreJour = dateObj.toLocaleDateString('fr-FR', { weekday: 'long', day: 'numeric', month: 'long' });
  const nbElements = (agent ? 1 : 0) + evenementsJour.length + ((planningJour||[]).length);
  if (nbElements === 0) {
    openModal(`
      <h3 style="text-transform:capitalize;">${escapeHTML(titreJour)}</h3>
      <div class="empty" style="padding:10px 0;">Rien de prévu ce jour-là.</div>
      <div class="modal-actions"><button class="ghost" id="modal-cancel">Fermer</button></div>
    `);
    document.getElementById('modal-cancel').addEventListener('click', closeModal);
    return;
  }
  const blocAstreinte = agent ? `
    <div class="jour-detail-item" style="border-left-color:${ASTREINTE_ROSTER_COULEUR};">
      <span class="jour-detail-type" style="background:${ASTREINTE_ROSTER_COULEUR};">Astreinte</span>
      <div class="jour-detail-titre">${escapeHTML(agent.nom)}</div>
      ${agent.telephone ? `<div class="jour-detail-meta">${escapeHTML(agent.telephone)}</div>` : ''}
      ${remplacant ? `<div class="jour-detail-meta" style="color:var(--tuile);">Remplacement ponctuel (titulaire habituel : ${escapeHTML(titulaire ? titulaire.nom : '—')})</div>` : ''}
    </div>` : '';
  const blocsEvenements = evenementsJour.map(ev => `
    <div class="jour-detail-item" style="border-left-color:${typeEvenementCouleur(ev.type)};">
      ${typeApporteInfo(ev.type, ev.intitule) ? `<span class="jour-detail-type" style="background:${typeEvenementCouleur(ev.type)};">${escapeHTML(typeEvenementLabel(ev.type))}</span>` : ''}
      <div class="jour-detail-titre">${escapeHTML(ev.intitule)}</div>
      <div class="jour-detail-meta">${ev.heure ? escapeHTML(ev.heure) + (ev.heure_fin ? ' – ' + escapeHTML(ev.heure_fin) : '') : ''}${ev.lieu ? (ev.heure ? ' · ' : '') + escapeHTML(ev.lieu) : ''}</div>
      ${ev.description ? `<div class="jour-detail-meta" style="margin-top:3px;">${escapeHTML(ev.description)}</div>` : ''}
      ${ev.agents.length ? `<div class="jour-detail-meta" style="margin-top:3px;">${participantsResumeHTML(ev.agents, 'Participants : ')}</div>` : ''}
    </div>`).join('');
  // Synthèse du planning des agents communaux — uniquement présente si
  // planningJour a été alimenté à l'appel, ce qui ne se produit que pour
  // les personnes ayant le droit correspondant (voir les deux points
  // d'appel de renderMonthCalendarHTML) : rien à cacher ici côté affichage,
  // la donnée n'a simplement pas été chargée pour les autres.
  const blocsPlanningAgents = (planningJour||[]).map(l => `
    <div class="jour-detail-item" style="border-left-color:${typePlanningAgentCouleur(l.type)};">
      <span class="jour-detail-type" style="background:${typePlanningAgentCouleur(l.type)};">${escapeHTML(typePlanningAgentLabel(l.type))}</span>
      <div class="jour-detail-titre">${escapeHTML(l.nomAgent)}</div>
      ${formatHorairesJour(l) ? `<div class="jour-detail-meta">${escapeHTML(formatHorairesJour(l))}${l.lieu ? ' · ' + escapeHTML(l.lieu) : ''}</div>` : (l.lieu ? `<div class="jour-detail-meta">${escapeHTML(l.lieu)}</div>` : '')}
    </div>`).join('');
  openModal(`
    <h3 style="text-transform:capitalize;">${escapeHTML(titreJour)}</h3>
    <div class="week-sub" style="margin-bottom:10px;">${nbElements} élément${nbElements > 1 ? 's' : ''} ce jour-là</div>
    ${blocAstreinte}
    ${blocsEvenements}
    ${blocsPlanningAgents}
    <div class="modal-actions"><button class="ghost" id="modal-cancel">Fermer</button></div>
  `);
  document.getElementById('modal-cancel').addEventListener('click', closeModal);
}

async function fetchAgents(){
  // Lecture depuis la vue "agents_annuaire" : expose uniquement les
  // colonnes nécessaires à l'usage courant (nom, téléphone, rôle,
  // éligibilité, statut) — jamais l'email, qui n'a aucune raison
  // d'être lisible par un autre agent que son titulaire ou l'admin.
  const { data, error } = await sb.from('agents_annuaire').select('*').eq('actif', true).order('nom');
  if (error) { showToast('Impossible de charger la liste des agents : ' + error.message, 'error'); return []; }
  return data || [];
}
// Version complète (avec email), réservée aux actions admin qui en ont
// réellement besoin : l'envoi d'emails de publication/rappel. La table
// `agents` elle-même reste protégée par RLS (soi-même ou admin) : un
// appel non-admin échouerait simplement à récupérer ces lignes.
async function fetchAgentsAdmin(){
  const { data, error } = await sb.from('agents').select('*').eq('actif', true).order('nom');
  if (error) { showToast('Impossible de charger la liste des agents : ' + error.message, 'error'); return []; }
  return data || [];
}
// Inclut aussi les agents désactivés — pour RÉSOUDRE un nom à partir
// d'une affectation déjà existante (planning, historique, échanges),
// jamais pour proposer quelqu'un comme candidat à une nouvelle
// affectation. La désactivation empêche les nouvelles affectations
// (le déclencheur serveur y veille) mais ne doit jamais faire
// disparaître l'historique : un ancien planning pointant vers un
// agent désactivé doit continuer à afficher son nom.
async function fetchAgentsAvecInactifs(){
  const { data, error } = await sb.from('agents_annuaire').select('*').order('nom');
  if (error) { showToast('Impossible de charger la liste des agents : ' + error.message, 'error'); return []; }
  return data || [];
}
// Construit la correspondance date (YYYY-MM-DD) -> agent remplaçant, à
// partir des remplacements ponctuels ACCEPTÉS. Utilisée pour substituer
// le nom affiché un jour précis, sans jamais toucher à `planning` ni au
// titulaire officiel de la semaine.
async function fetchRemplacantsParDate(agentsAvecInactifs){
  const { data, error } = await sb.from('remplacements_jour').select('*').eq('statut', 'acceptee');
  if (error) return {};
  const agentByIdLocal = Object.fromEntries((agentsAvecInactifs||[]).map(a => [a.id, a]));
  const map = {};
  (data||[]).forEach(r => { if (agentByIdLocal[r.agent_remplacant_id]) map[r.date] = agentByIdLocal[r.agent_remplacant_id]; });
  return map;
}
// Événements (mariages, baptêmes...) regroupés par date, avec le nom des
// élus désignés déjà résolu — jamais de nom de particulier ici, juste
// l'intitulé libre saisi par la secrétaire ou l'admin.
async function fetchEvenementsParDate(agentsAvecInactifs){
  const { data: evenements, error } = await sb.from('evenements').select('*').order('date');
  if (error || !evenements || evenements.length === 0) return {};
  const { data: liens } = await sb.from('evenements_agents').select('*');
  const agentByIdLocal = Object.fromEntries((agentsAvecInactifs||[]).map(a => [a.id, a]));
  const map = {};
  evenements.forEach(ev => {
    const nomsAgents = (liens||[])
      .filter(l => l.evenement_id === ev.id)
      .map(l => agentByIdLocal[l.agent_id])
      .filter(Boolean)
      .map(a => a.nom);
    (map[ev.date] ||= []).push({ ...ev, agents: nomsAgents });
  });
  return map;
}

// Synthèse du planning des agents communaux pour le calendrier communal
// (point 13 du cahier des charges module Planning agents) — ne renvoie
// jamais rien pour quelqu'un sans droit sur ce module : c'est ce qui
// empêche une fuite d'information RH vers le calendrier partagé, pas un
// filtrage a posteriori côté affichage.
async function fetchPlanningAgentsParDate(agentsCommunaux){
  const gestion = state.isAdmin || state.agent.droit_planning_agents === 'gestion';
  const consultation = gestion || state.agent.droit_planning_agents === 'consultation';
  if (!consultation) return {};
  const table = gestion ? 'planning_agents' : 'planning_agents_consultation';
  const { data: lignes, error } = await sb.from(table).select('*');
  if (error || !lignes || !lignes.length) return {};
  const agentById = Object.fromEntries((agentsCommunaux||[]).map(a => [a.id, a]));
  const map = {};
  lignes.forEach(l => {
    const a = agentById[l.agent_id];
    if (!a) return; // agent désactivé entretemps : on ne l'affiche plus
    (map[l.date] ||= []).push({ ...l, nomAgent: a.nom });
  });
  return map;
}

// Événements publiés pour réponses présent/absent où l'agent connecté
// figure parmi les participants désignés — seuls ceux-là peuvent
// répondre (choix explicite : pas un formulaire ouvert à tout le monde).
// Ne remonte que les événements à venir, publie_reponses = true.
async function fetchMesEvenementsAConfirmer(agentId){
  const today = toISODate(new Date());
  const { data: liens } = await sb.from('evenements_agents').select('evenement_id').eq('agent_id', agentId);
  const ids = (liens||[]).map(l => l.evenement_id);
  if (!ids.length) return [];
  const { data: evs } = await sb.from('evenements').select('*').in('id', ids).eq('publie_reponses', true).gte('date', today).order('date');
  if (!evs || !evs.length) return [];
  const { data: mesReponses } = await sb.from('evenements_reponses').select('*').eq('agent_id', agentId).in('evenement_id', evs.map(e => e.id));
  const reponseByEv = Object.fromEntries((mesReponses||[]).map(r => [r.evenement_id, r.reponse]));

async function ouvrirNotifications(){
  // Purge best-effort des anciennes notifications déjà lues (30 jours) —
  // sans bloquer l'ouverture du panneau si ça échoue. Important : le
  // « query builder » renvoyé par sb.rpc(...) est un objet « thenable »
  // propre à Supabase (il a .then, mais pas nativement .catch/.finally).
  // L'appeler directement en .catch(...) lève une TypeError synchrone
  // (« .catch is not a function ») qui arrêtait toute la fonction avant
  // même l'ouverture du panneau — d'où le clic sans aucun effet visible.
  // Promise.resolve(...) le convertit en vraie Promise native.
  Promise.resolve(sb.rpc('nettoyer_mes_notifications')).catch(() => {});

  // Toute la logique est protégée par un try/catch : auparavant, une
  // exception réseau (contrairement à une simple { error } renvoyée par
  // Supabase) n'était pas interceptée et le clic sur la cloche ne
  // produisait alors aucun retour visible pour l'utilisateur.
  let notifs;
  try {
    const { data, error } = await sb.from('notifications').select('*').eq('agent_id', state.agent.id).order('created_at', { ascending:false }).limit(50);
    if (error) { showToast('Erreur : ' + error.message, 'error'); return; }
    notifs = data;
  } catch (e) {
    showToast('Erreur réseau : ' + (e && e.message ? e.message : 'impossible de charger les notifications.'), 'error');
    return;
  }

  const html = `
    <h3>Notifications</h3>
    <div>
      ${(!notifs || notifs.length === 0)
        ? '<div class="empty" style="padding:14px 0;">Aucune notification.</div>'
        : notifs.map(n => `
          <div class="notif-item ${n.lue ? '' : 'non-lue'}" data-notif-id="${escapeHTML(n.id)}">
            <div class="notif-msg">${escapeHTML(n.message)}</div>
            <div class="notif-date">${escapeHTML(formatDateHeureFR(n.created_at))}</div>
          </div>`).join('')}
    </div>
    <div class="modal-actions"><button class="ghost" id="modal-cancel">Fermer</button></div>
  `;
  openModal(html);
  document.getElementById('modal-cancel').addEventListener('click', closeModal);

  document.querySelectorAll('[data-notif-id]').forEach(item => {
    item.addEventListener('click', async () => {
      const id = item.dataset.notifId;
      const notif = (notifs||[]).find(n => n.id === id);
      if (notif && !notif.lue) {
        await sb.from('notifications').update({ lue: true }).eq('id', id);
      }
      closeModal();
      if (notif && notif.contexte && notif.contexte.tab) {
        // Pour un admin, la notification "Semaines" (contexte enregistré
        // côté serveur) n'affiche que Relancer/Supprimer — pas de moyen
        // d'agir sur une disponibilité déclarée. La vue Planning, elle,
        // propose le menu d'affectation pour la semaine concernée : on y
        // redirige donc systématiquement, en gardant la mise en
        // surbrillance de la semaine visée.
        const cible = (state.isAdmin && notif.contexte.tab === 'admin-semaines' && notif.contexte.semaine_id)
          ? 'admin-planning'
          : notif.contexte.tab;
        state.tab = cible;
        if (notif.contexte.semaine_id) state.highlight = { type: 'semaine', id: notif.contexte.semaine_id };
        renderTabs(); renderView();
      } else {
        rafraichirBadgeNotifications();
      }
    });
  });
}

// « QUI EST DISPONIBLE ? » (aide à la décision, admin uniquement)
// N'écrit jamais rien : consultation seule. Accessible depuis une
// carte du tableau de bord.
// =========================================================
async function ouvrirQuiEstDisponible(){
  const { data: semainesRaw, error: errS } = await sb.from('semaines').select('*').order('date_debut');
  if (errS) { showToast('Erreur : ' + errS.message, 'error'); return; }
  const semaines = semainesRaw || [];
  if (semaines.length === 0) { showToast('Aucune semaine créée pour le moment.', 'error'); return; }
  const today = toISODate(new Date());
  const defaut = semaines.find(s => s.date_fin >= today) || semaines[semaines.length - 1];

  const html = `
    <h3>👥 Qui est disponible ?</h3>
    <div class="week-sub" style="margin-bottom:8px;">Aide à la décision uniquement — ne modifie rien au planning.</div>
    <select id="qed-semaine" style="margin-bottom:10px;">
      ${semaines.map(s => `<option value="${escapeHTML(s.id)}" ${s.id===defaut.id?'selected':''}>${escapeHTML(weekLabel(s))}</option>`).join('')}
    </select>
    <div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px;">
      <button class="ghost qed-filtre active" data-filtre="tous">Tous</button>
      <button class="ghost qed-filtre" data-filtre="oui">Disponibles</button>
      <button class="ghost qed-filtre" data-filtre="non">Indisponibles</button>
      <button class="ghost qed-filtre" data-filtre="sans">Sans réponse</button>
    </div>
    <div id="qed-resultats"><div class="empty">Chargement…</div></div>
    <div class="modal-actions"><button class="ghost" id="modal-cancel">Fermer</button></div>
  `;
  openModal(html);
  document.getElementById('modal-cancel').addEventListener('click', closeModal);

  let filtreActuel = 'tous';

  async function charger(){
    const semaineId = document.getElementById('qed-semaine').value;
    const zone = document.getElementById('qed-resultats');
    zone.innerHTML = '<div class="empty">Chargement…</div>';

    const [{ data: agentsTous, error: errA }, { data: dispos, error: errD }, { data: plannings, error: errP }] = await Promise.all([
      sb.from('agents').select('*').eq('actif', true),
      sb.from('disponibilites').select('*').eq('semaine_id', semaineId),
      sb.from('planning').select('agent_id')
    ]);
    if (errA || errD || errP) { zone.innerHTML = '<div class="empty">Erreur de chargement.</div>'; return; }

    const eligiblesLocaux = (agentsTous||[]).filter(a => a.role !== 'lecteur' && a.eligible_astreinte !== false);
    const dispoParAgent = Object.fromEntries((dispos||[]).map(d => [d.agent_id, d]));
    const comptesAstreintes = {};
    (plannings||[]).forEach(p => { comptesAstreintes[p.agent_id] = (comptesAstreintes[p.agent_id]||0) + 1; });

    const lignes = eligiblesLocaux.map(a => {
      const d = dispoParAgent[a.id];
      const statut = !d ? 'sans' : (d.niveau === 'oui' ? 'oui' : 'non');
      return { agent: a, statut, priorite: d ? d.priorite : null };
    }).sort((x,y) => {
      const ordre = { oui: 0, sans: 1, non: 2 };
      return (ordre[x.statut] - ordre[y.statut]) || x.agent.nom.localeCompare(y.agent.nom);
    });

    function rendreLignes(){
      const filtrees = filtreActuel === 'tous' ? lignes : lignes.filter(l => l.statut === filtreActuel);
      zone.innerHTML = filtrees.length === 0 ? '<div class="empty">Aucun agent dans cette catégorie.</div>' :
        filtrees.map(l => {
          const icone = l.statut === 'oui' ? '🟢' : (l.statut === 'non' ? '🔴' : '⚪');
          const statutLabel = l.statut === 'oui' ? 'Disponible' : (l.statut === 'non' ? 'Indisponible' : 'N\'a pas répondu');
          const prioriteLabel = l.priorite === 1 ? 'Priorité haute' : (l.priorite === 3 ? 'Priorité basse' : (l.priorite ? 'Priorité normale' : ''));
          const nb = comptesAstreintes[l.agent.id] || 0;
          const telHref = l.agent.telephone ? l.agent.telephone.replace(/[^\d+]/g,'') : '';
          return `<div class="dash-item">
            <div>
              <strong>${icone} ${escapeHTML(l.agent.nom)}</strong>
              <div class="week-sub">${escapeHTML(statutLabel)}${prioriteLabel ? ' · ' + escapeHTML(prioriteLabel) : ''}</div>
              ${l.agent.telephone ? `<div class="week-sub">📞 <a href="tel:${escapeHTML(telHref)}">${escapeHTML(l.agent.telephone)}</a></div>` : ''}
              <div class="week-sub" style="opacity:.75;">${nb} astreinte(s) déjà effectuée(s)</div>
            </div>
          </div>`;
        }).join('');
    }
    rendreLignes();

    document.querySelectorAll('.qed-filtre').forEach(btn => {
      btn.onclick = () => {
        document.querySelectorAll('.qed-filtre').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        filtreActuel = btn.dataset.filtre;
        rendreLignes();
      };
    });
  }

  document.getElementById('qed-semaine').addEventListener('change', charger);
  charger();
}

async function sendPublishEmail(agent, semaine){
  if (!window.emailjs || !EMAILJS_SERVICE_ID || EMAILJS_SERVICE_ID.startsWith('VOTRE_')) {
    return { ok: false, reason: 'non_configure' };
  }
  try {
    await emailjs.send(EMAILJS_SERVICE_ID, EMAILJS_TEMPLATE_ID, {
      to_email: agent.email,
      to_name: agent.nom,
      // Le template EmailJS "template_4jh4miq" (configuré sur emailjs.com,
      // donc hors de ce fichier) contient le texte fixe :
      // « ... pour la {{semaine}} (du {{date_debut}} au {{date_fin}}). »
      // Envoyer semaine="semaine du X au Y" produisait donc une période
      // en double dans l'email reçu. On envoie ici uniquement le mot
      // "semaine", laissant la date réelle au (du ... au ...) du template.
      semaine: 'semaine',
      date_debut: formatDateEmail(semaine.date_debut),
      date_fin: formatDateEmail(semaine.date_fin)
    });
    return { ok: true };
  } catch(e){
    console.error('Email non envoyé', e);
    return { ok: false, reason: 'echec', detail: e };
  }
}

// Envoie un rappel à tous les agents n'ayant pas encore déclaré leur
// disponibilité pour une semaine donnée. Réutilisé pour la relance
// d'une seule semaine comme pour la relance groupée de toutes les
// semaines ouvertes.
async function relancerNonRepondants(semaine){
  const agents = (await fetchAgentsAdmin()).filter(a => a.role !== 'lecteur' && a.eligible_astreinte !== false); // seuls les éligibles ont vocation à répondre
  const { data: dejaRepondu, error: errDispo } = await sb.from('disponibilites').select('agent_id').eq('semaine_id', semaine.id);
  if (errDispo) return { semaine, erreur: errDispo.message };
  const dejaReponduSet = new Set((dejaRepondu||[]).map(d => d.agent_id));
  const nonRepondants = agents.filter(a => !dejaReponduSet.has(a.id));
  if (nonRepondants.length === 0) return { semaine, envoyes: 0, echecs: 0 };
  let envoyes = 0, echecs = 0;
  for (const agent of nonRepondants) {
    const result = await sendReminderEmail(agent, semaine);
    if (result.ok) envoyes++; else echecs++;
  }
  return { semaine, envoyes, echecs };
}

// Agrège les résultats (une ou plusieurs semaines) en un seul message clair.
function afficherResultatRelance(resultats){
  const enErreur = resultats.find(r => r.erreur);
  if (enErreur) { showToast('Erreur : ' + enErreur.erreur, 'error'); return; }
  const totalEnvoyes = resultats.reduce((s,r) => s + (r.envoyes||0), 0);
  const totalEchecs = resultats.reduce((s,r) => s + (r.echecs||0), 0);
  if (totalEnvoyes === 0 && totalEchecs === 0) {
    showToast('Tous les agents ont déjà répondu' + (resultats.length > 1 ? ' pour toutes les semaines ouvertes.' : '.'), 'success');
  } else if (totalEnvoyes === 0 && totalEchecs > 0) {
    showToast('Aucun email envoyé — le template de relance EmailJS n\'est probablement pas configuré (voir SETUP).', 'error');
  } else {
    const suffixe = resultats.length > 1 ? ` (${resultats.length} semaine(s))` : '';
    showToast(totalEnvoyes + ' rappel(s) envoyé(s)' + (totalEchecs ? ', ' + totalEchecs + ' échec(s)' : '') + suffixe + '.', totalEchecs ? 'error' : 'success');
  }
}

// =========================================================
// DÉCONNEXION AUTOMATIQUE APRÈS INACTIVITÉ
// Supabase ne propose cette limite que sur ses offres payantes ;
// on la reproduit ici côté appli, en surveillant l'activité de
// la personne (clic, défilement, saisie) pendant qu'elle est connectée.
//
// Le setTimeout seul ne suffit pas sur mobile : dès que l'écran se
// verrouille ou que l'appli passe en arrière-plan, les navigateurs
// mobiles mettent en pause (voire tuent) les minuteurs JS — les 15
// minutes ne s'écoulent alors jamais vraiment, et rien ne se passe
// au retour. On stocke donc en plus l'horodatage de la dernière
// activité (horloge réelle, pas un minuteur), et on le recontrôle
// explicitement chaque fois que l'appli redevient visible.
// =========================================================
const INACTIVITE_LIMITE_MS = 15 * 60 * 1000; // 15 minutes
const INACTIVITE_STORAGE_KEY = 'derniere_activite';
let inactiviteTimer = null;

function enregistrerActivite(){
  try { localStorage.setItem(INACTIVITE_STORAGE_KEY, String(Date.now())); } catch(e) {}
}

async function verifierInactiviteEcoulee(){
  if (!state.session) return false;
  let derniere;
  try { derniere = Number(localStorage.getItem(INACTIVITE_STORAGE_KEY)); } catch(e) { derniere = null; }
  if (derniere && (Date.now() - derniere) >= INACTIVITE_LIMITE_MS) {
    await sb.auth.signOut();
    state.session = null;
    showToast('Déconnecté après 15 minutes d\'inactivité.', 'info');
    return true;
  }
  return false;
}

function demarrerSurveillanceInactivite(){
  enregistrerActivite();
  clearTimeout(inactiviteTimer);
  inactiviteTimer = setTimeout(async () => {
    if (!state.session) return;
    await sb.auth.signOut();
    showToast('Déconnecté après 15 minutes d\'inactivité.', 'info');
  }, INACTIVITE_LIMITE_MS);
}
function arreterSurveillanceInactivite(){
  clearTimeout(inactiviteTimer);
  inactiviteTimer = null;
  try { localStorage.removeItem(INACTIVITE_STORAGE_KEY); } catch(e) {}
}
['click', 'touchstart', 'keydown', 'scroll'].forEach(evt => {
  document.addEventListener(evt, () => { if (state.session) demarrerSurveillanceInactivite(); }, { passive: true });
});
// Filet de sécurité : à chaque retour au premier plan (déverrouillage,
// changement d'appli puis retour...), on compare l'horloge réelle à la
// dernière activité connue, sans dépendre d'un minuteur qui aurait pu
// être mis en pause entretemps.
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible') verifierInactiviteEcoulee();
});

async function initAuth(){
  let session;
  try {
    const res = await sb.auth.getSession();
    session = res.data.session;
  } catch (e) {
    showToast('Erreur réseau : impossible de vérifier votre connexion.', 'error');
    showLogin();
    return;
  }
  state.session = session;
  if (!session) { showLogin(); return; }

  // Cas où l'appli a été totalement fermée puis rouverte (pas juste mise
  // en pause) : la page recharge de zéro, donc le visibilitychange n'a
  // pas pu se déclencher entretemps. On revérifie ici, avant d'afficher
  // quoi que ce soit, en s'appuyant sur l'horodatage persistant.
  const deconnecte = await verifierInactiviteEcoulee();
  if (deconnecte) { showLogin(); return; }

  const { data: agent, error } = await sb.from('agents').select('*').ilike('email', session.user.email).maybeSingle();
  if (error) {
    document.getElementById('login-msg').textContent = "Erreur réseau, réessayez dans un instant.";
    document.getElementById('login-msg').className = "msg err";
    showLogin();
    return;
  }
  if (!agent) {
    document.getElementById('login-msg').textContent = "Votre email n'est pas enregistré comme agent. Contactez l'administrateur.";
    document.getElementById('login-msg').className = "msg err";
    await sb.auth.signOut();
    showLogin();
    return;
  }
  if (!agent.actif) {
    document.getElementById('login-msg').textContent = "Votre compte a été désactivé. Contactez l'administrateur.";
    document.getElementById('login-msg').className = "msg err";
    await sb.auth.signOut();
    showLogin();
    return;
  }
  state.agent = agent;
  state.isAdmin = agent.role === 'admin';
  showApp();
}

sb.auth.onAuthStateChange((event) => {
  if (event === 'SIGNED_IN') initAuth();
  if (event === 'SIGNED_OUT') showLogin();
});

function showLogin(){
  document.getElementById('login-screen').classList.remove('hidden');
  document.getElementById('app').classList.add('hidden');
  arreterSurveillanceInactivite();
}

function showApp(){
  document.getElementById('login-screen').classList.add('hidden');
  document.getElementById('app').classList.remove('hidden');
  const suffixe = state.isAdmin ? " · Admin" : (state.agent.role === 'lecteur' ? " · Lecture seule" : "");
  document.getElementById('who-name').textContent = state.agent.nom + suffixe;
  document.getElementById('notif-btn').classList.remove('hidden');
  state.tab = state.isAdmin
    ? 'admin-planning'
    : (state.agent.role === 'lecteur'
        ? (['consultation','gestion'].includes(state.agent.droit_planning_agents) ? 'planning-agents' : (state.agent.peut_gerer_evenements ? 'evenements' : 'planning'))
        : 'planning');
  renderTabs();
  renderView();
  rafraichirBadgeNotifications();
  demarrerSurveillanceInactivite();
}

function renderTabs(){
  const gereEvenements = state.isAdmin || state.agent.peut_gerer_evenements;
  const gerePlanningAgents = state.isAdmin || ['consultation','gestion'].includes(state.agent.droit_planning_agents);
  const ongletPlanningAgents = ['planning-agents','👷 Planning agents communaux'];
  const tabs = state.isAdmin
    ? [['dashboard','📊 Tableau de bord'],['dispos','Mes disponibilités'],['admin-planning','Planning'],['admin-semaines','Semaines'],['admin-echanges','Échanges'],['evenements','Événements'],...(gerePlanningAgents ? [ongletPlanningAgents] : []),['admin-agents','Agents']]
    : state.agent.role === 'lecteur'
      ? [...(gerePlanningAgents ? [ongletPlanningAgents] : []), ...(gereEvenements ? [['evenements','Événements']] : []), ['planning','Planning']]
      : [['dispos','Mes disponibilités'],['planning','Planning'],['echanges','Échanges'], ...(gereEvenements ? [['evenements','Événements']] : []), ...(gerePlanningAgents ? [ongletPlanningAgents] : [])];
  const nav = document.getElementById('tabs');
  nav.innerHTML = '';
  tabs.forEach(([id,label]) => {
    const b = document.createElement('button');
    b.textContent = label;
    b.className = state.tab === id ? 'active' : '';
    b.addEventListener('click', () => { state.tab = id; renderTabs(); renderView(); });
    nav.appendChild(b);
  });
}

function renderView(){
  const view = document.getElementById('view');
  view.innerHTML = '<div class="empty">Chargement…</div>';
  // Garde-fou : un compte lecture seule ne doit jamais afficher autre chose que
  // le planning (et, s'il gère les événements ou le planning agents, l'onglet
  // dédié), même si l'état interne se retrouvait ailleurs.
  const gereEvenements = state.isAdmin || state.agent.peut_gerer_evenements;
  const gerePlanningAgents = state.isAdmin || ['consultation','gestion'].includes(state.agent.droit_planning_agents);
  if (!state.isAdmin && state.agent.role === 'lecteur' && !(state.tab === 'planning' || (gereEvenements && state.tab === 'evenements') || (gerePlanningAgents && state.tab === 'planning-agents'))) state.tab = 'planning';
  // Le tableau de bord n'a de sens (et n'agrège des données déjà lisibles)
  // que pour un compte admin ; personne d'autre ne doit pouvoir s'y retrouver
  // même si l'état interne se retrouvait dessus par erreur.
  if (state.tab === 'dashboard' && !state.isAdmin) state.tab = state.agent.role === 'lecteur' ? 'planning' : 'dispos';
  const routes = {
    'dispos': renderDispos,
    'planning': renderPlanningAgent,
    'echanges': renderEchangesAgent,
    'evenements': renderEvenementsGestion,
    'planning-agents': renderPlanningAgentsCommunaux,
    'admin-planning': renderPlanningAdmin,
    'admin-semaines': renderSemainesAdmin,
    'admin-echanges': renderEchangesAdmin,
    'admin-agents': renderAgentsAdmin,
    'dashboard': renderDashboardAdmin
  };
  (routes[state.tab] || renderDispos)(view).catch(err => {
    console.error(err);
    view.innerHTML = '<div class="card"><div class="empty">Erreur de chargement. Rechargez la page.</div></div>';
  });
  rafraichirBadgeNotifications();
}

// =========================================================
// VUE : MES DISPONIBILITÉS (agent)
// L'astreinte est hebdomadaire : disponible ou non pour la semaine
// entière (plus de nuance par jour).
// =========================================================
async function renderDispos(view){
  const exempte = state.agent.eligible_astreinte === false;
  const today = toISODate(new Date());
  const { data: periodes } = await sb.from('indisponibilites_periodes').select('*').eq('agent_id', state.agent.id).order('date_debut');

  // Résumé « Astreinte cette semaine », visible dès l'ouverture de l'appli.
  const { data: semainesPubliees } = await sb.from('semaines').select('*').eq('statut','publiee');
  const { data: planningsActuels } = await sb.from('planning').select('*');
  const agentsPourResume = await fetchAgents();
  const remplacantsParDate = await fetchRemplacantsParDate(agentsPourResume);
  const resumeHTML = astreinteActuelleHTML(
    semainesPubliees,
    Object.fromEntries((planningsActuels||[]).map(p => [p.semaine_id, p])),
    Object.fromEntries(agentsPourResume.map(a => [a.id, a])),
    state.agent.id,
    remplacantsParDate
  );

  // Événements où l'agent est participant, publiés pour réponse — une
  // carte « à confirmer » distincte des disponibilités d'astreinte, qui
  // répondent à une logique différente (semaine entière vs présence
  // ponctuelle à un événement donné).
  const evenementsAConfirmer = await fetchMesEvenementsAConfirmer(state.agent.id);
  const confirmationHTML = evenementsAConfirmer.length ? `
    <div class="card">
      <h3>Événements à confirmer</h3>
      ${evenementsAConfirmer.map(ev => `
        <div class="week-row" data-evenement-reponse="${escapeHTML(ev.id)}">
          <div>
            <div class="week-label">
              ${typeApporteInfo(ev.type, ev.intitule) ? `<span class="pill" style="background:${typeEvenementCouleur(ev.type)};color:var(--white);">${escapeHTML(typeEvenementLabel(ev.type))}</span>` : ''}
              ${escapeHTML(formatDateFR(ev.date))}${ev.heure ? ' à ' + escapeHTML(ev.heure) : ''} — ${escapeHTML(ev.intitule)}
            </div>
            ${ev.lieu ? `<div class="week-sub">${escapeHTML(ev.lieu)}</div>` : ''}
          </div>
          <div style="display:flex;flex-direction:column;gap:6px;align-items:flex-end;">
            <select data-role="reponse-evenement">
              <option value="" ${!ev.maReponse ? 'selected' : ''}>— À répondre —</option>
              <option value="present" ${ev.maReponse==='present' ? 'selected' : ''}>Présent</option>
              <option value="absent" ${ev.maReponse==='absent' ? 'selected' : ''}>Absent</option>
            </select>
            <button class="ghost" data-role="save-reponse-evenement">Enregistrer</button>
          </div>
        </div>`).join('')}
    </div>` : '';

  const periodesHTML = `
    <div class="card">
      <h3>Périodes d'indisponibilité (vacances)</h3>
      <div class="week-sub" style="margin-bottom:10px;">${exempte
        ? "Vous êtes exempté des astreintes : ces périodes sont enregistrées à titre d'information uniquement, elles n'affectent aucun planning."
        : "Déclarer une période marque automatiquement toutes les semaines déjà ouvertes qui la recoupent, selon le choix ci-dessous — sans avoir à les modifier une par une."}</div>
      ${(periodes||[]).map(p => `
        <div class="week-row">
          <div>
            <div class="week-label">${escapeHTML(formatDateFR(p.date_debut))} au ${escapeHTML(formatDateFR(p.date_fin))}</div>
            <div class="week-sub">${p.disponible_astreinte ? 'Disponible pour l\'astreinte pendant cette période' : 'Indisponible pour l\'astreinte pendant cette période'}</div>
            ${p.motif ? `<div class="week-sub">${escapeHTML(p.motif)}</div>` : ''}
          </div>
          <button class="ghost" data-role="suppr-periode" data-id="${escapeHTML(p.id)}">Supprimer</button>
        </div>`).join('')}
      <div style="display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;margin-top:10px;">
        <div><div class="week-sub">Du</div><input type="date" id="periode-agent-debut"></div>
        <div><div class="week-sub">Au</div><input type="date" id="periode-agent-fin"></div>
        <div>
          <div class="week-sub">Pendant ces vacances</div>
          <select id="periode-agent-dispo">
            <option value="non" selected>Non disponible pour l'astreinte</option>
            <option value="oui">Disponible pour l'astreinte</option>
          </select>
        </div>
        <div><div class="week-sub">Motif (facultatif)</div><input type="text" id="periode-agent-motif" placeholder="Vacances…"></div>
        <button class="primary" id="btn-periode-agent">Ajouter</button>
      </div>
      <div class="msg" id="periode-agent-msg"></div>
    </div>`;

  let semaines = null, mesDispos = null, dispoMap = {}, prochaineHTML = '', dispoHTML = '';

  if (exempte) {
    dispoHTML = '<div class="card"><h3>Astreintes</h3><div class="empty">Vous êtes exempté des astreintes par l\'administrateur — aucune disponibilité à déclarer.</div></div>';
  } else {
    const { data: sem, error: e1 } = await sb.from('semaines').select('*').eq('statut','ouverte').gte('date_limite_dispo', today).order('date_debut');
    if (e1) { view.innerHTML = '<div class="card"><div class="empty">Erreur de chargement des semaines.</div></div>'; return; }
    semaines = sem;
    const { data: md, error: e2 } = await sb.from('disponibilites').select('*').eq('agent_id', state.agent.id);
    if (e2) { view.innerHTML = '<div class="card"><div class="empty">Erreur de chargement de vos disponibilités.</div></div>'; return; }
    mesDispos = md;
    const { data: mesAstreintes } = await sb.from('planning').select('*, semaines(*)').eq('agent_id', state.agent.id);
    (mesDispos||[]).forEach(d => dispoMap[d.semaine_id] = d);

    // Prochaine astreinte à venir, mise en avant en haut de l'écran.
    const prochaines = (mesAstreintes||[])
      .filter(p => p.semaines && p.semaines.date_fin >= today)
      .sort((a,b) => a.semaines.date_debut < b.semaines.date_debut ? -1 : 1);
    prochaineHTML = prochaines.length
      ? `<div class="card"><h3 style="margin-bottom:4px;"><span class="pill" style="background:${ASTREINTE_ROSTER_COULEUR};color:var(--white);margin-right:6px;">Astreinte</span>Votre prochaine</h3><div class="week-label">${escapeHTML(weekLabel(prochaines[0].semaines))}</div></div>`
      : '';

    dispoHTML = (!semaines || semaines.length === 0)
      ? '<div class="card"><div class="empty">Aucune semaine ouverte à la déclaration pour le moment.</div></div>'
      : `<div class="card"><h3>Vos disponibilités</h3>` + semaines.map(s => {
          const d = mesDispos ? dispoMap[s.id] : null;
          // Compatibilité : une éventuelle ancienne valeur 'partiel' est traitée comme 'oui'.
          const niveau = d ? (d.niveau === 'partiel' ? 'oui' : d.niveau) : 'non';
          const priorite = d ? d.priorite : 2;
          return `
          <div class="week-row" data-semaine="${escapeHTML(s.id)}">
            <div style="flex:1;min-width:220px;">
              <div class="week-label">${escapeHTML(weekLabel(s))}</div>
              <div class="week-sub">Limite de réponse : ${escapeHTML(formatDateFR(s.date_limite_dispo))}</div>
            </div>
            <div style="display:flex;flex-direction:column;gap:6px;align-items:flex-end;">
              <select data-role="niveau">
                <option value="non" ${niveau==='non'?'selected':''}>Indisponible</option>
                <option value="oui" ${niveau==='oui'?'selected':''}>Disponible cette semaine</option>
              </select>
              <select data-role="priorite">
                <option value="1" ${priorite==1?'selected':''}>Priorité haute (je préfère cette semaine)</option>
                <option value="2" ${priorite==2?'selected':''}>Priorité normale</option>
                <option value="3" ${priorite==3?'selected':''}>Priorité basse (en dernier recours)</option>
              </select>
              <button class="ghost" data-role="save">Enregistrer</button>
            </div>
          </div>`;
        }).join('') + `</div>`;
  }

  view.innerHTML = resumeHTML + confirmationHTML + prochaineHTML + periodesHTML + dispoHTML;

  view.querySelectorAll('[data-evenement-reponse]').forEach(row => {
    const evenementId = row.dataset.evenementReponse;
    row.querySelector('[data-role=save-reponse-evenement]').addEventListener('click', async (e) => {
      const reponse = row.querySelector('[data-role=reponse-evenement]').value;
      if (!reponse) { showToast('Choisissez présent ou absent.', 'error'); return; }
      await withLoading(e.currentTarget, 'Enregistrement…', async () => {
        const { error } = await sb.from('evenements_reponses').upsert(
          { evenement_id: evenementId, agent_id: state.agent.id, reponse, updated_at: new Date().toISOString() },
          { onConflict: 'evenement_id,agent_id' }
        );
        if (error) { showToast('Erreur : ' + error.message, 'error'); return; }
        showToast('Réponse enregistrée.', 'success');
      });
    });
  });

  view.querySelectorAll('.week-row[data-semaine]').forEach(row => {
    const semaineId = row.dataset.semaine;
    row.querySelector('[data-role=save]').addEventListener('click', async (e) => {
      const niveau = row.querySelector('[data-role=niveau]').value;
      const priorite = parseInt(row.querySelector('[data-role=priorite]').value, 10);
      await withLoading(e.currentTarget, 'Enregistrement…', async () => {
        const payload = {
          semaine_id: semaineId,
          agent_id: state.agent.id,
          niveau,
          jours: [],
          priorite
        };
        const { error } = await sb.from('disponibilites').upsert(payload, { onConflict: 'semaine_id,agent_id' });
        if (error) { showToast('Erreur : ' + error.message, 'error'); return; }
        showToast('Disponibilité enregistrée.', 'success');
      });
    });
  });

  const btnPeriode = document.getElementById('btn-periode-agent');
  if (btnPeriode) btnPeriode.addEventListener('click', async (e) => {
    const debut = document.getElementById('periode-agent-debut').value;
    const fin = document.getElementById('periode-agent-fin').value;
    const motif = document.getElementById('periode-agent-motif').value.trim();
    const disponible = document.getElementById('periode-agent-dispo').value === 'oui';
    const pmsg = document.getElementById('periode-agent-msg');
    pmsg.textContent = ''; pmsg.className = 'msg';
    if (!debut || !fin) { pmsg.textContent = 'Renseignez les deux dates.'; pmsg.className = 'msg err'; return; }
    if (fin < debut) { pmsg.textContent = 'La date de fin doit être après le début.'; pmsg.className = 'msg err'; return; }

    await withLoading(e.currentTarget, 'Ajout…', async () => {
      const { error } = await sb.from('indisponibilites_periodes').insert({ agent_id: state.agent.id, date_debut: debut, date_fin: fin, motif: motif || null, disponible_astreinte: disponible });
      if (error) { pmsg.textContent = 'Erreur : ' + error.message; pmsg.className = 'msg err'; return; }

      // Marque automatiquement les semaines déjà ouvertes qui recoupent la
      // période, selon le choix fait ci-dessus (disponible ou non).
      const chevauchantes = (semaines||[]).filter(s => s.date_debut <= fin && s.date_fin >= debut);
      let marquees = 0;
      for (const s of chevauchantes) {
        const { error: errDispo } = await sb.from('disponibilites').upsert(
          { semaine_id: s.id, agent_id: state.agent.id, niveau: disponible ? 'oui' : 'non', jours: [], priorite: 2 },
          { onConflict: 'semaine_id,agent_id' }
        );
        if (!errDispo) marquees++;
      }
      showToast('Période ajoutée' + (marquees ? ' — ' + marquees + ' semaine(s) marquée(s) ' + (disponible ? 'disponible(s)' : 'indisponible(s)') + '.' : '.'), 'success');
      renderView();
    });
  });

  view.querySelectorAll('[data-role=suppr-periode]').forEach(btn => {
    btn.addEventListener('click', async (e) => {
      if (!confirm('Supprimer cette période ? Les semaines déjà modifiées à cause d\'elle resteront ainsi : vous pourrez ajuster manuellement votre disponibilité si besoin, dans « Vos disponibilités » ci-dessous.')) return;
      await withLoading(e.currentTarget, 'Suppression…', async () => {
        const { error } = await sb.from('indisponibilites_periodes').delete().eq('id', btn.dataset.id);
        if (error) { showToast('Erreur : ' + error.message, 'error'); return; }
        showToast('Période supprimée.', 'success');
        renderView();
      });
    });
  });
}

// =========================================================
// VUE : PLANNING (agent) — consultation + demande d'échange
// L'échange se fait via un menu déroulant (plus de prompt()),
// et la demande passe par la fonction serveur demander_echange
// qui revérifie tout (titulaire réel, agent cible actif, etc.)
// =========================================================
async function renderPlanningAgent(view){
  const { data: semainesToutes, error: e1 } = await sb.from('semaines').select('*').eq('statut','publiee').order('date_debut');
  if (e1) { view.innerHTML = '<div class="card"><div class="empty">Erreur de chargement du planning.</div></div>'; return; }  const { data: plannings } = await sb.from('planning').select('*');
  const agents = await fetchAgents(); // actifs seulement : pour la liste « Échanger avec… »
  const agentsTous = await fetchAgentsAvecInactifs(); // pour afficher qui était assigné, même désactivé depuis
  const agentById = Object.fromEntries(agentsTous.map(a => [a.id, a]));
  const planByWeek = Object.fromEntries((plannings||[]).map(p => [p.semaine_id, p]));
  const remplacantsParDate = await fetchRemplacantsParDate(agentsTous);
  const evenementsParDate = await fetchEvenementsParDate(agentsTous);
  const agentsCommunauxCal = await fetchAgentsCommunaux(false);
  const planningAgentsParDate = await fetchPlanningAgentsParDate(agentsCommunauxCal);
  const { data: remplacementsAcceptes } = await sb.from('remplacements_jour').select('*').eq('statut','acceptee');
  const remplacementsParSemaine = {};
  (remplacementsAcceptes||[]).forEach(r => { (remplacementsParSemaine[r.semaine_id] ||= []).push(r); });

  const resumeHTML = astreinteActuelleHTML(semainesToutes, planByWeek, agentById, state.agent.id, remplacantsParDate);

  const today = toISODate(new Date());
  const passees = (semainesToutes||[]).filter(s => s.date_fin < today);
  const semaines = state.showPasseesAgent ? (semainesToutes||[]) : (semainesToutes||[]).filter(s => s.date_fin >= today);

  const entete = `
    <div class="card no-print" style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;">
      <h3 style="margin:0;">Planning publié</h3>
      <div style="display:flex;gap:8px;flex-wrap:wrap;">
        <button class="ghost" id="btn-toggle-vue">${state.planningVue === 'liste' ? 'Vue calendrier' : 'Vue liste'}</button>
        ${state.planningVue === 'liste' && passees.length ? `<button class="ghost" id="btn-toggle-passe">${state.showPasseesAgent ? 'Masquer les semaines passées' : 'Afficher aussi les semaines passées (' + passees.length + ')'}</button>` : ''}
        <button class="ghost" id="btn-imprimer">Imprimer / PDF</button>
      </div>
    </div>`;

  if (state.planningVue === 'calendrier') {
    view.innerHTML = resumeHTML + entete + renderMonthCalendarHTML(semainesToutes, planByWeek, agentById, state.agent.id, remplacantsParDate, evenementsParDate, planningAgentsParDate);
    document.getElementById('btn-toggle-vue').addEventListener('click', () => { state.planningVue = 'liste'; renderView(); });
    document.getElementById('btn-imprimer').addEventListener('click', () => window.print());
    brancherNavigationCalendrier(view);
    return;
  }

  view.innerHTML = resumeHTML + entete + `<div class="card">` + (semaines.length === 0
    ? '<div class="empty">Aucune semaine à venir publiée.</div>'
    : semaines.map(s => {
