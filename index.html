    const p = planByWeek[s.id];
    const agent = p ? agentById[p.agent_id] : null;
    const mine = agent && agent.id === state.agent.id;
    const autres = agents.filter(a => a.id !== state.agent.id && a.eligible_astreinte !== false && a.role !== 'lecteur');
    const remplacementsSemaine = (remplacementsParSemaine[s.id] || []).slice().sort((a,b) => a.date < b.date ? -1 : 1);
    const exceptionsHTML = remplacementsSemaine.length
      ? `<div class="week-sub" style="color:var(--tuile);margin-top:2px;">` +
        remplacementsSemaine.map(r => `Exception le ${escapeHTML(formatDateFR(r.date))} : ${escapeHTML((agentById[r.agent_remplacant_id]||{nom:'—'}).nom)}`).join(' · ') +
        `</div>` : '';
    const evenementsSemaine = Object.entries(evenementsParDate||{})
      .filter(([iso]) => iso >= s.date_debut && iso <= s.date_fin)
      .flatMap(([iso, evs]) => evs.map(ev => ({ ...ev, iso })));
    const evenementsHTML = evenementsSemaine.length
      ? `<div class="week-sub" style="color:var(--navy);margin-top:2px;font-style:italic;">` +
        evenementsSemaine.map(ev => `${escapeHTML(ev.intitule)} le ${escapeHTML(formatDateFR(ev.iso))}${ev.agents.length ? ' : ' + ev.agents.map(escapeHTML).join(', ') : ''}`).join(' · ') +
        `</div>` : '';
    return `
    <div class="week-row" data-semaine-row="${escapeHTML(s.id)}">
      <div>
        <div class="week-label">${escapeHTML(weekLabel(s))} ${mine ? '<span class="pill publiee">Vous</span>' : ''}</div>
        <div class="week-sub">${agent ? escapeHTML(agent.nom) + ' · ' + escapeHTML(agent.telephone||'') : 'Non assigné'}</div>
        ${exceptionsHTML}
        ${evenementsHTML}
      </div>
      ${mine ? `
        <div style="display:flex;flex-direction:column;gap:6px;align-items:flex-end;" data-semaine="${escapeHTML(s.id)}">
          <div style="display:flex;gap:6px;flex-wrap:wrap;align-items:center;">
            <select data-role="echange-cible">
              <option value="">Échanger toute la semaine avec…</option>
              <option value="__ouvert__">Ouvert à tous (pas de préférence)</option>
              ${autres.map(a => `<option value="${escapeHTML(a.id)}">${escapeHTML(a.nom)}</option>`).join('')}
            </select>
            <button class="ghost" data-role="echange-btn">Proposer</button>
          </div>
          <div style="display:flex;gap:6px;flex-wrap:wrap;align-items:center;">
            <input type="date" data-role="remplacement-date" min="${escapeHTML(s.date_debut)}" max="${escapeHTML(s.date_fin)}" title="Jour à remplacer">
            <select data-role="remplacement-cible">
              <option value="">Remplacement d'un jour avec…</option>
              <option value="__ouvert__">Ouvert à tous (pas de préférence)</option>
              ${autres.map(a => `<option value="${escapeHTML(a.id)}">${escapeHTML(a.nom)}</option>`).join('')}
            </select>
            <button class="ghost" data-role="remplacement-btn">Proposer</button>
          </div>
        </div>` : ''}
    </div>`;
  }).join('')) + `</div>`;

  document.getElementById('btn-toggle-vue').addEventListener('click', () => { state.planningVue = 'calendrier'; renderView(); });

  const btnToggle = document.getElementById('btn-toggle-passe');
  if (btnToggle) btnToggle.addEventListener('click', () => { state.showPasseesAgent = !state.showPasseesAgent; renderView(); });

  document.getElementById('btn-imprimer').addEventListener('click', () => window.print());

  view.querySelectorAll('[data-role=echange-btn]').forEach(btn => {
    btn.addEventListener('click', async (e) => {
      const wrap = btn.closest('[data-semaine]');
      const semaineId = wrap.dataset.semaine;
      const choix = wrap.querySelector('[data-role=echange-cible]').value;
      if (!choix) { showToast('Choisissez d\'abord une option.', 'error'); return; }
      const cibleId = choix === '__ouvert__' ? null : choix;
      await withLoading(e.currentTarget, 'Envoi…', async () => {
        const { error } = await sb.rpc('demander_echange', { p_semaine_id: semaineId, p_agent_cible_id: cibleId });
        if (error) { showToast('Erreur : ' + error.message, 'error'); return; }
        showToast(cibleId ? 'Demande d\'échange envoyée.' : 'Demande ouverte publiée — visible par tous les agents éligibles.', 'success');
        renderView();
      });
    });
  });

  view.querySelectorAll('[data-role=remplacement-btn]').forEach(btn => {
    btn.addEventListener('click', async (e) => {
      const wrap = btn.closest('[data-semaine]');
      const semaineId = wrap.dataset.semaine;
      const date = wrap.querySelector('[data-role=remplacement-date]').value;
      const choix = wrap.querySelector('[data-role=remplacement-cible]').value;
      if (!date) { showToast('Choisissez d\'abord le jour à remplacer.', 'error'); return; }
      if (!choix) { showToast('Choisissez d\'abord une option.', 'error'); return; }
      const cibleId = choix === '__ouvert__' ? null : choix;
      await withLoading(e.currentTarget, 'Envoi…', async () => {
        const { error } = await sb.rpc('demander_remplacement_jour', { p_semaine_id: semaineId, p_date: date, p_agent_remplacant_id: cibleId });
        if (error) { showToast('Erreur : ' + error.message, 'error'); return; }
        showToast(cibleId ? 'Demande de remplacement envoyée.' : 'Demande ouverte publiée — visible par tous les agents éligibles.', 'success');
        renderView();
      });
    });
  });

  // Venant d'une notification : repère la semaine visée, y défile et la
  // met brièvement en valeur, puis oublie la cible (à usage unique).
  if (state.highlight && state.highlight.type === 'semaine') {
    const cible = state.highlight.id;
    state.highlight = null;
    const ligne = view.querySelector(`[data-semaine-row="${CSS.escape(cible)}"]`);
    if (ligne) {
      ligne.scrollIntoView({ behavior: 'smooth', block: 'center' });
      ligne.classList.add('flash-highlight');
      setTimeout(() => ligne.classList.remove('flash-highlight'), 2500);
    }
  }
}

// =========================================================
// VUE : ÉCHANGES (agent) — répondre aux demandes qui le concernent
// Accepter/refuser passe par les fonctions serveur dédiées, qui
// revalident tout avant d'agir (plus de mise à jour directe).
// =========================================================
async function renderEchangesAgent(view){
  // Plus de filtre .or() côté client : les RLS déterminent déjà exactement
  // quelles lignes sont visibles (les miennes, celles qui me ciblent, et
  // les demandes ouvertes encore en attente) — inutile de dupliquer la
  // logique ici.
  const { data: echanges, error } = await sb.from('echanges').select('*, semaines(*)').order('created_at', { ascending:false });
  if (error) { view.innerHTML = '<div class="card"><div class="empty">Erreur de chargement des échanges.</div></div>'; return; }
  const { data: remplacements } = await sb.from('remplacements_jour').select('*, semaines(*)').order('created_at', { ascending:false });
  const agents = await fetchAgentsAvecInactifs();
  const agentById = Object.fromEntries(agents.map(a => [a.id, a]));
  const jePeuxPrendre = state.agent.eligible_astreinte !== false && state.agent.role !== 'lecteur';

  const echangesHTML = (!echanges || echanges.length === 0)
    ? '<div class="empty">Aucune demande d\'échange.</div>'
    : echanges.map(e => {
    const demandeur = agentById[e.agent_demandeur_id] || { nom: 'Agent inconnu' };
    const cible = e.agent_cible_id ? (agentById[e.agent_cible_id] || { nom: 'Agent inconnu' }) : null;
    const statutPill = e.statut === 'attente' ? 'partiel' : (e.statut === 'acceptee' ? 'oui' : 'non');
    const jeSuisCible = e.agent_cible_id === state.agent.id && e.statut === 'attente';
    const estOuverte = !e.agent_cible_id && e.statut === 'attente';
    const estMaDemande = e.agent_demandeur_id === state.agent.id && e.statut === 'attente';
    const cibleLabel = cible ? escapeHTML(cible.nom) : 'ouvert à tous';
    return `
    <div class="week-row">
      <div>
        <div class="week-label">${escapeHTML(weekLabel(e.semaines))}</div>
        <div class="week-sub">${escapeHTML(demandeur.nom)} → ${cibleLabel} <span class="pill ${statutPill}">${escapeHTML(e.statut)}</span></div>
      </div>
      ${jeSuisCible ? `
        <div style="display:flex;gap:6px;">
          <button class="ghost" data-role="accepter" data-id="${escapeHTML(e.id)}">Accepter</button>
          <button class="ghost" data-role="refuser" data-id="${escapeHTML(e.id)}">Refuser</button>
        </div>` : ''}
      ${estOuverte && !estMaDemande && jePeuxPrendre ? `
        <div style="display:flex;gap:6px;">
          <button class="ghost" data-role="accepter" data-id="${escapeHTML(e.id)}">Je la prends</button>
        </div>` : ''}
      ${estMaDemande ? `
        <div style="display:flex;gap:6px;">
          <button class="ghost" data-role="annuler" data-id="${escapeHTML(e.id)}">Annuler ma demande</button>
        </div>` : ''}
    </div>`;
  }).join('');

  const remplacementsHTML = (!remplacements || remplacements.length === 0)
    ? '<div class="empty">Aucune demande de remplacement.</div>'
    : remplacements.map(r => {
    const demandeur = agentById[r.agent_demandeur_id] || { nom: 'Agent inconnu' };
    const cible = r.agent_remplacant_id ? (agentById[r.agent_remplacant_id] || { nom: 'Agent inconnu' }) : null;
    const statutPill = r.statut === 'attente' ? 'partiel' : (r.statut === 'acceptee' ? 'oui' : 'non');
    const jeSuisCible = r.agent_remplacant_id === state.agent.id && r.statut === 'attente';
    const estOuverte = !r.agent_remplacant_id && r.statut === 'attente';
    const estMaDemande = r.agent_demandeur_id === state.agent.id && r.statut === 'attente';
    const cibleLabel = cible ? escapeHTML(cible.nom) : 'ouvert à tous';
    return `
    <div class="week-row">
      <div>
        <div class="week-label">${escapeHTML(formatDateFR(r.date))} <span class="week-sub" style="font-weight:normal;">(${escapeHTML(weekLabel(r.semaines))})</span></div>
        <div class="week-sub">${escapeHTML(demandeur.nom)} → ${cibleLabel} <span class="pill ${statutPill}">${escapeHTML(r.statut)}</span></div>
      </div>
      ${jeSuisCible ? `
        <div style="display:flex;gap:6px;">
          <button class="ghost" data-role="r-accepter" data-id="${escapeHTML(r.id)}">Accepter</button>
          <button class="ghost" data-role="r-refuser" data-id="${escapeHTML(r.id)}">Refuser</button>
        </div>` : ''}
      ${estOuverte && !estMaDemande && jePeuxPrendre ? `
        <div style="display:flex;gap:6px;">
          <button class="ghost" data-role="r-accepter" data-id="${escapeHTML(r.id)}">Je la prends</button>
        </div>` : ''}
      ${estMaDemande ? `
        <div style="display:flex;gap:6px;">
          <button class="ghost" data-role="r-annuler" data-id="${escapeHTML(r.id)}">Annuler ma demande</button>
        </div>` : ''}
    </div>`;
  }).join('');

  view.innerHTML = `<div class="card"><h3>Demandes d'échange (semaine complète)</h3>${echangesHTML}</div>` +
    `<div class="card"><h3>Remplacements d'un jour</h3>${remplacementsHTML}</div>`;

  view.querySelectorAll('[data-role=accepter],[data-role=refuser],[data-role=annuler]').forEach(btn => {
    btn.addEventListener('click', async (e) => {
      const id = btn.dataset.id;
      const fnParRole = { accepter: 'accepter_echange', refuser: 'refuser_echange', annuler: 'annuler_echange' };
      const labelParRole = { accepter: 'Acceptation…', refuser: 'Refus…', annuler: 'Annulation…' };
      const fn = fnParRole[btn.dataset.role];
      await withLoading(e.currentTarget, labelParRole[btn.dataset.role], async () => {
        const { data, error } = await sb.rpc(fn, { p_echange_id: id });
        if (error) { showToast('Erreur : ' + error.message, 'error'); return; }
        const messages = { accepter: 'Échange accepté.', refuser: 'Échange refusé.', annuler: 'Demande annulée.' };
        let msg = messages[btn.dataset.role];
        if (btn.dataset.role === 'accepter' && data && data.remplacements_annules > 0) {
          msg += ` Attention : ${data.remplacements_annules} remplacement(s) ponctuel(s) prévu(s) sur cette semaine ont été annulé(s) (à renégocier si besoin).`;
        }
        showToast(msg, 'success');
        renderView();
      });
    });
  });

  view.querySelectorAll('[data-role=r-accepter],[data-role=r-refuser],[data-role=r-annuler]').forEach(btn => {
    btn.addEventListener('click', async (e) => {
      const id = btn.dataset.id;
      const role = btn.dataset.role.slice(2); // retire le préfixe "r-"
      const fnParRole = { accepter: 'accepter_remplacement_jour', refuser: 'refuser_remplacement_jour', annuler: 'annuler_remplacement_jour' };
      const labelParRole = { accepter: 'Acceptation…', refuser: 'Refus…', annuler: 'Annulation…' };
      await withLoading(e.currentTarget, labelParRole[role], async () => {
        const { error } = await sb.rpc(fnParRole[role], { p_id: id });
        if (error) { showToast('Erreur : ' + error.message, 'error'); return; }
        const messages = { accepter: 'Remplacement accepté.', refuser: 'Remplacement refusé.', annuler: 'Demande annulée.' };
        showToast(messages[role], 'success');
        renderView();
      });
    });
  });
}

// =========================================================
// VUE ADMIN : PLANNING — générer, ajuster, publier
// =========================================================
async function renderPlanningAdmin(view){
  const { data: semainesToutes, error } = await sb.from('semaines').select('*').order('date_debut');
  if (error) { view.innerHTML = '<div class="card"><div class="empty">Erreur de chargement des semaines.</div></div>'; return; }
  const { data: dispos } = await sb.from('disponibilites').select('*');
  const { data: plannings } = await sb.from('planning').select('*');
  const agents = await fetchAgentsAdmin(); // besoin de l'email pour publier/relancer
  const agentById = Object.fromEntries(agents.map(a => [a.id, a]));
  const agentsTous = await fetchAgentsAvecInactifs();
  const agentByIdTous = Object.fromEntries(agentsTous.map(a => [a.id, a])); // pour l'affichage, même désactivé
  const planByWeek = Object.fromEntries((plannings||[]).map(p => [p.semaine_id, p]));
  const dispoBySemaine = {};
  (dispos||[]).forEach(d => { (dispoBySemaine[d.semaine_id] ||= []).push(d); });
  const remplacantsParDate = await fetchRemplacantsParDate(agentsTous);
  const evenementsParDate = await fetchEvenementsParDate(agentsTous);
  const agentsCommunauxCal = await fetchAgentsCommunaux(false);
  const planningAgentsParDate = await fetchPlanningAgentsParDate(agentsCommunauxCal);

  const resumeHTML = astreinteActuelleHTML(semainesToutes, planByWeek, agentByIdTous, state.agent.id, remplacantsParDate);

  if (!semainesToutes || semainesToutes.length === 0){
    view.innerHTML = resumeHTML + '<div class="card"><div class="empty">Aucune semaine créée. Allez dans l\'onglet « Semaines ».</div></div>';
    return;
  }

  const today = toISODate(new Date());
  const dansSeptJours = new Date(); dansSeptJours.setDate(dansSeptJours.getDate() + 7);
  const seuilProche = toISODate(dansSeptJours);
  const passees = semainesToutes.filter(s => s.date_fin < today);
  const semaines = semainesToutes.filter(s => s.date_fin >= today);

  if (state.planningVue === 'calendrier') {
    const publieesSeulement = semainesToutes.filter(s => s.statut === 'publiee');
    view.innerHTML = resumeHTML + `
      <div class="card no-print" style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;">
        <h3 style="margin:0;">Planning</h3>
        <div style="display:flex;gap:8px;flex-wrap:wrap;">
          <button class="ghost" id="btn-toggle-vue">Vue liste</button>
          <button class="ghost" id="btn-imprimer">Imprimer / PDF</button>
        </div>
      </div>` + renderMonthCalendarHTML(publieesSeulement, planByWeek, agentByIdTous, state.agent.id, remplacantsParDate, evenementsParDate, planningAgentsParDate);
    document.getElementById('btn-toggle-vue').addEventListener('click', () => { state.planningVue = 'liste'; renderView(); });
    document.getElementById('btn-imprimer').addEventListener('click', () => window.print());
    brancherNavigationCalendrier(view);
    return;
  }

  const eligibles = agents.filter(a => a.role !== 'lecteur' && a.eligible_astreinte !== false);

  function ligneSemaine(s){
    const p = planByWeek[s.id];
    const agentAssigne = p ? agentByIdTous[p.agent_id] : null;
    const candidats = (dispoBySemaine[s.id]||[]).filter(d => d.niveau !== 'non' && agentById[d.agent_id] && agentById[d.agent_id].eligible_astreinte !== false && agentById[d.agent_id].role !== 'lecteur');
    const disponibleIds = new Set(candidats.map(d => d.agent_id));
    const autresEligibles = eligibles.filter(a => !disponibleIds.has(a.id));
    const optionsDispo = candidats.map(d => {
      const a = agentById[d.agent_id];
      if (!a) return '';
      return `<option value="${escapeHTML(a.id)}" ${p && p.agent_id===a.id ? 'selected':''}>${escapeHTML(a.nom)}</option>`;
    }).join('');
    const optionsAutres = autresEligibles.map(a =>
      `<option value="${escapeHTML(a.id)}" ${p && p.agent_id===a.id ? 'selected':''}>${escapeHTML(a.nom)} (non déclaré disponible)</option>`
    ).join('');
    const options = (optionsDispo ? `<optgroup label="Disponibles">${optionsDispo}</optgroup>` : '') +
      (optionsAutres ? `<optgroup label="Autres agents éligibles">${optionsAutres}</optgroup>` : '');
    const proche = s.date_debut <= seuilProche && s.date_debut >= today;
    let alerte = '';
    if (candidats.length === 0) alerte = '<div class="warn-text">Aucun agent ne s\'est déclaré disponible — vous pouvez tout de même en affecter un manuellement ci-dessous</div>';
    else if (!p && proche && s.statut !== 'publiee') alerte = '<div class="warn-text">⚠ Astreinte dans moins de 7 jours, personne assigné pour l\'instant</div>';
    const evenementsSemaine = Object.entries(evenementsParDate||{})
      .filter(([iso]) => iso >= s.date_debut && iso <= s.date_fin)
      .flatMap(([iso, evs]) => evs.map(ev => ({ ...ev, iso })));
    const evenementsHTML = evenementsSemaine.length
      ? `<div class="week-sub" style="color:var(--navy);margin-top:2px;font-style:italic;">` +
        evenementsSemaine.map(ev => `${escapeHTML(ev.intitule)} le ${escapeHTML(formatDateFR(ev.iso))}${ev.agents.length ? ' : ' + ev.agents.map(escapeHTML).join(', ') : ''}`).join(' · ') +
        `</div>` : '';
    return `
      <div class="week-row" data-semaine-row="${escapeHTML(s.id)}">
        <div>
          <div class="week-label">${escapeHTML(weekLabel(s))} <span class="pill ${s.statut==='publiee'?'publiee':'partiel'}">${escapeHTML(s.statut)}</span></div>
          ${alerte || `<div class="week-sub">${candidats.length} agent(s) dispo</div>`}
          ${evenementsHTML}
          <span class="print-only">${agentAssigne ? escapeHTML(agentAssigne.nom) : '(non assigné)'}</span>
        </div>
        <div style="display:flex;gap:6px;align-items:center;flex-wrap:wrap;">
          <select data-role="assign" data-semaine="${escapeHTML(s.id)}" ${s.statut==='publiee' || eligibles.length===0 ?'disabled':''}>
            <option value="">— choisir —</option>
            ${options}
          </select>
          ${s.statut !== 'publiee' ? `<button class="ghost" data-role="publier" data-semaine="${escapeHTML(s.id)}">Publier</button>` : ''}
          ${s.statut === 'publiee' ? `<button class="ghost" data-role="rappel" data-semaine="${escapeHTML(s.id)}">Renvoyer un rappel</button>` : ''}
        </div>
      </div>`;
  }

  view.innerHTML = resumeHTML + `
    <div class="card" style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;">
      <div>
        <h3 style="margin-bottom:2px;">Générer une proposition</h3>
        <div class="week-sub">Répartit équitablement les semaines non encore assignées, selon les disponibilités déclarées et en évitant si possible deux semaines consécutives pour la même personne. Cela reste une proposition à vérifier avant publication.</div>
      </div>
      <div style="display:flex;gap:8px;flex-wrap:wrap;">
        <button class="ghost" id="btn-toggle-vue">Vue calendrier</button>
        <button class="ghost" id="btn-imprimer">Imprimer / PDF</button>
        <button class="primary" id="btn-generer">Générer une proposition</button>
      </div>
    </div>
    <div class="card">` + semaines.map(ligneSemaine).join('') + `</div>` +
    (passees.length ? `
    <div class="card">
      <button class="ghost" id="btn-toggle-historique">${state.showHistoriqueAdmin ? 'Masquer l\'historique' : 'Afficher l\'historique (' + passees.length + ' semaine(s) passée(s))'}</button>
      ${state.showHistoriqueAdmin ? passees.map(ligneSemaine).join('') : ''}
    </div>` : '');

  document.getElementById('btn-toggle-vue').addEventListener('click', () => { state.planningVue = 'calendrier'; renderView(); });
  document.getElementById('btn-imprimer').addEventListener('click', () => window.print());

  const btnHist = document.getElementById('btn-toggle-historique');
  if (btnHist) btnHist.addEventListener('click', () => { state.showHistoriqueAdmin = !state.showHistoriqueAdmin; renderView(); });

  document.getElementById('btn-generer').addEventListener('click', async (e) => {
    await withLoading(e.currentTarget, 'Génération…', async () => {
      // Calcul ET écriture faits côté serveur, en une seule transaction :
      // impossible d'obtenir un lot partiellement généré en cas de coupure réseau.
      const { data, error } = await sb.rpc('generer_proposition_planning');
      if (error) { showToast('Erreur : ' + error.message, 'error'); return; }
      if (data.sans_candidat > 0) showToast(data.sans_candidat + ' semaine(s) sans aucun agent disponible.', 'error');
      if (data.crees > 0) showToast(data.crees + ' semaine(s) générée(s). Vérifiez puis publiez.', 'success');
      else if (data.sans_candidat === 0) showToast('Aucune semaine à générer.', 'success');
      renderView();
    });
  });

  view.querySelectorAll('[data-role=assign]').forEach(sel => {
    sel.addEventListener('change', async () => {
      if (!sel.value) return;
      const { error } = await sb.from('planning').upsert({ semaine_id: sel.dataset.semaine, agent_id: sel.value }, { onConflict:'semaine_id' });
      if (error) { showToast('Erreur : ' + error.message, 'error'); return; }
      showToast('Affectation mise à jour.', 'success');
    });
  });

  view.querySelectorAll('[data-role=publier]').forEach(btn => {
    btn.addEventListener('click', async (e) => {
      const semaineId = btn.dataset.semaine;
      const sel = view.querySelector(`[data-role=assign][data-semaine="${semaineId}"]`);
      if (!sel.value) { showToast('Choisissez un agent avant de publier.', 'error'); return; }
      const agentChoisi = agentById[sel.value];
      const semaineChoisie = semainesToutes.find(s => s.id === semaineId);
      const confirmation = confirm(
        'Publier cette astreinte ?\n\n' +
        (agentChoisi ? agentChoisi.nom : 'Cet agent') + ' sera officiellement désigné' +
        (semaineChoisie ? ' pour la ' + weekLabel(semaineChoisie).toLowerCase() : '') + '.\n\n' +
        'Cette action rendra le planning visible aux agents et enverra un email de notification.'
      );
      if (!confirmation) return;
      await withLoading(e.currentTarget, 'Publication…', async () => {
        // Une seule fonction serveur transactionnelle : l'affectation et le
        // passage au statut « publiée » réussissent ou échouent ensemble,
        // impossible d'obtenir un état à moitié publié.
        const { data, error } = await sb.rpc('publier_planning', { p_semaine_id: semaineId, p_agent_id: sel.value });
        if (error) { showToast('Échec de la publication : ' + error.message, 'error'); return; }

        const agentPourEmail = { nom: data.agent_nom, email: data.agent_email };
        const semainePourEmail = { date_debut: data.semaine_debut, date_fin: data.semaine_fin };
        const emailResult = await sendPublishEmail(agentPourEmail, semainePourEmail);
        if (emailResult.ok) {
          showToast('Planning publié. Email envoyé à ' + data.agent_nom + '.', 'success');
        } else {
          showToast('Planning publié. Attention : l\'email n\'a pas pu être envoyé.', 'error');
        }
        renderView();
      });
    });
  });

  view.querySelectorAll('[data-role=rappel]').forEach(btn => {
    btn.addEventListener('click', async (e) => {
      const semaineId = btn.dataset.semaine;
      const p = planByWeek[semaineId];
      const semaine = semainesToutes.find(s => s.id === semaineId);
      if (!p) { showToast('Aucun agent assigné à cette semaine.', 'error'); return; }
      const agent = agentById[p.agent_id];
      if (!agent) { showToast('Agent introuvable.', 'error'); return; }
      await withLoading(e.currentTarget, 'Envoi…', async () => {
        const result = await sendPublishEmail(agent, semaine);
        showToast(result.ok ? 'Rappel envoyé à ' + agent.nom + '.' : 'Échec de l\'envoi du rappel.', result.ok ? 'success' : 'error');
      });
    });
  });

  // Venant du tableau de bord : repère la semaine visée, y défile et la
  // met brièvement en valeur, puis oublie la cible (à usage unique).
  if (state.highlight && state.highlight.type === 'semaine') {
    const cible = state.highlight.id;
    state.highlight = null;
    const ligne = view.querySelector(`[data-semaine-row="${CSS.escape(cible)}"]`);
    if (ligne) {
      ligne.scrollIntoView({ behavior: 'smooth', block: 'center' });
      ligne.classList.add('flash-highlight');
      setTimeout(() => ligne.classList.remove('flash-highlight'), 2500);
    }
  }
}

// Algorithme d'équilibrage : traite d'abord les semaines les plus
// contraintes (le moins de candidats disponibles), pour ne pas
// « gaspiller » un agent rare sur une semaine qui avait d'autres
// options — plutôt que l'ordre chronologique brut, qui peut aboutir
// à une affectation localement correcte mais globalement sous-optimale.
// Pour chaque semaine, choisit l'agent dispo avec le moins d'astreintes
// déjà comptabilisées, en départageant par priorité déclarée
// (1 = plus favorable), et en évitant si possible de reconduire
// l'agent de la semaine précédente OU suivante (l'ordre de traitement
// n'étant plus forcément chronologique, les deux sont vérifiées).
// Ne touche jamais une semaine déjà publiée. Reste une PROPOSITION :
// l'administrateur vérifie et publie manuellement ensuite.
// La génération de la proposition (calcul + écriture) se fait désormais
// entièrement côté serveur, via la fonction RPC generer_proposition_planning
// (voir generer_proposition_rpc.sql) — une seule transaction, plus de
// risque d'écriture partielle en cas de coupure réseau en cours de route.

// =========================================================
// VUE ADMIN : SEMAINES — création (avec validations) et suivi
// =========================================================
async function renderSemainesAdmin(view){
  const { data: semainesToutes, error } = await sb.from('semaines').select('*').order('date_debut', { ascending:true });
  if (error) { view.innerHTML = '<div class="card"><div class="empty">Erreur de chargement des semaines.</div></div>'; return; }
  const datesExistantes = new Set((semainesToutes||[]).map(s => s.date_debut));
  const today = toISODate(new Date());
  // Semaines à venir/en cours : la plus proche (échéance la plus urgente) en premier.
  const semaines = (semainesToutes||[]).filter(s => s.date_fin >= today);
  // Historique : la plus récente en premier (ordre inverse du tri de base, qui est croissant).
  const passees = (semainesToutes||[]).filter(s => s.date_fin < today).reverse();

  view.innerHTML = `
    <div class="card">
      <h3>Nouvelle semaine</h3>
      <div style="display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;">
        <div>
          <div class="week-sub">Lundi de la semaine</div>
          <input type="date" id="new-debut">
        </div>
        <div>
          <div class="week-sub">Date limite de réponse</div>
          <input type="date" id="new-limite">
        </div>
        <button class="primary" id="btn-creer">Créer</button>
      </div>
      <div class="msg" id="creer-msg"></div>
    </div>
    <div class="card">
      <h3>Créer une période complète</h3>
      <div class="week-sub" style="margin-bottom:10px;">Génère automatiquement toutes les semaines (lundi à dimanche) entre deux dates. La date limite de réponse est fixée à 30 jours avant chaque lundi. Les semaines déjà existantes sont ignorées.</div>
      <div style="display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;">
        <div>
          <div class="week-sub">Du (n'importe quelle date)</div>
          <input type="date" id="periode-debut">
        </div>
        <div>
          <div class="week-sub">Au</div>
          <input type="date" id="periode-fin">
        </div>
        <button class="primary" id="btn-periode">Générer les semaines</button>
      </div>
      <div class="msg" id="periode-msg"></div>
    </div>
    <div class="card"><h3>Équité — nombre d'astreintes par agent</h3><div id="balance"></div></div>
    <div class="card" style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;">
      <h3 style="margin:0;">Semaines</h3>
      ${(semainesToutes||[]).some(s => s.statut === 'ouverte') ? `<button class="ghost" id="btn-relancer-tout">Relancer pour toutes les semaines ouvertes</button>` : ''}
    </div>
    <div class="card">` + semaines.map(ligneSemaineAdmin).join('') +
    (passees.length ? `
      <div style="padding:10px 0;">
        <button class="ghost" id="btn-toggle-historique-semaines">${state.showHistoriqueSemaines ? 'Masquer l\'historique' : 'Afficher l\'historique (' + passees.length + ' semaine(s) passée(s))'}</button>
      </div>
      ${state.showHistoriqueSemaines ? passees.map(ligneSemaineAdmin).join('') : ''}
    ` : '') + `</div>`;

  function ligneSemaineAdmin(s){
    // Code couleur sur la limite dispo selon l'urgence, pour repérer d'un
    // coup d'œil les semaines qui demandent une action rapide (relance...).
    // N'a de sens que tant que la semaine est encore "ouverte" : une fois
    // publiée, le planning est déjà tranché, la date limite n'apporte
    // plus rien et ne fait que brouiller la lecture.
    const joursRestants = Math.ceil((new Date(s.date_limite_dispo + 'T00:00:00') - new Date(today + 'T00:00:00')) / 86400000);
    const urgence = joursRestants < 0 ? '' : (joursRestants <= 7 ? 'urgent' : (joursRestants <= 14 ? 'soon' : ''));
    return `
      <details class="week-accordion">
        <summary>
          <div>
            <div class="week-label">${escapeHTML(weekLabel(s))} <span class="pill ${s.statut==='publiee'?'publiee':'partiel'}">${escapeHTML(s.statut)}</span></div>
            ${s.statut === 'ouverte' ? `<div class="week-sub ${urgence}">Limite dispo : ${escapeHTML(formatDateFR(s.date_limite_dispo))}</div>` : ''}
          </div>
        </summary>
        <div class="week-accordion-actions">
          ${s.statut === 'ouverte' ? `<button class="ghost" data-role="relancer" data-id="${escapeHTML(s.id)}">Relancer les non-répondants</button>` : ''}
          <button class="ghost" data-role="suppr" data-id="${escapeHTML(s.id)}">Supprimer</button>
        </div>
      </details>`;
  }

  const btnHistSemaines = document.getElementById('btn-toggle-historique-semaines');
  if (btnHistSemaines) btnHistSemaines.addEventListener('click', () => { state.showHistoriqueSemaines = !state.showHistoriqueSemaines; renderView(); });

  document.getElementById('btn-creer').addEventListener('click', async (e) => {
    const debut = document.getElementById('new-debut').value;
    const limite = document.getElementById('new-limite').value;
    const cmsg = document.getElementById('creer-msg');
    cmsg.textContent = ''; cmsg.className = 'msg';

    if (!debut || !limite) { cmsg.textContent = 'Renseignez les deux dates.'; cmsg.className = 'msg err'; return; }
    if (new Date(debut + 'T00:00:00').getDay() !== 1) {
      cmsg.textContent = 'La date de début doit être un lundi.'; cmsg.className = 'msg err'; return;
    }
    if (limite > debut) {
      cmsg.textContent = 'La date limite de réponse doit être avant (ou égale à) le début de la semaine.'; cmsg.className = 'msg err'; return;
    }

    await withLoading(e.currentTarget, 'Création…', async () => {
      const fin = new Date(debut + 'T00:00:00');
      fin.setDate(fin.getDate() + 6);
      const { data: creee, error } = await sb.from('semaines').insert({
        date_debut: debut,
        date_fin: toISODate(fin),
        date_limite_dispo: limite
      }).select().maybeSingle();
      if (error) {
        if (error.code === '23505') {
          cmsg.textContent = 'Cette semaine existe déjà.'; cmsg.className = 'msg err';
        } else {
          cmsg.textContent = 'Erreur : ' + error.message; cmsg.className = 'msg err';
        }
        return;
      }
      // Prévient tout de suite les agents éligibles qu'une nouvelle semaine
      // est ouverte à la déclaration (réutilise la relance existante :
      // personne n'ayant encore répondu, elle part à tout le monde).
      if (creee) {
        const resultat = await relancerNonRepondants(creee);
        showToast('Semaine créée. ' + (resultat && resultat.envoyes ? resultat.envoyes + ' email(s) envoyé(s).' : ''), 'success');
      } else {
        showToast('Semaine créée.', 'success');
      }
      renderView();
    });
  });

  document.getElementById('btn-periode').addEventListener('click', async (e) => {
    // Création des SEMAINES elles-mêmes (lignes de calendrier), pas des
    // AFFECTATIONS d'agents : contrairement à generer_proposition_planning()
    // (RPC, transactionnelle, tout ou rien), chaque semaine est insérée
    // individuellement ici, volontairement. Les lignes sont indépendantes
    // les unes des autres (pas de contrainte d'équité ou d'anti-consécutif
    // entre elles), donc une coupure en cours de route laisse simplement
    // les semaines déjà traitées créées et les autres non — sans état
    // incohérent à corriger, il suffit de relancer sur la période restante.
    const debutStr = document.getElementById('periode-debut').value;
    const finStr = document.getElementById('periode-fin').value;
    const pmsg = document.getElementById('periode-msg');
    pmsg.textContent = ''; pmsg.className = 'msg';

    if (!debutStr || !finStr) { pmsg.textContent = 'Renseignez les deux dates.'; pmsg.className = 'msg err'; return; }
    if (finStr < debutStr) { pmsg.textContent = 'La date de fin doit être après la date de début.'; pmsg.className = 'msg err'; return; }

    // On part du premier lundi à partir de la date choisie (inclus si elle est déjà un lundi).
    let curseur = new Date(debutStr + 'T00:00:00');
    const decalage = (8 - curseur.getDay()) % 7; // jours jusqu'au prochain lundi (0 si déjà lundi)
    curseur.setDate(curseur.getDate() + decalage);
    const fin = new Date(finStr + 'T00:00:00');

    const semainesAGenerer = [];
    while (curseur <= fin) {
      const dDebut = toISODate(curseur);
      const dFin = new Date(curseur); dFin.setDate(dFin.getDate() + 6);
      const dLimite = new Date(curseur); dLimite.setDate(dLimite.getDate() - 30);
      semainesAGenerer.push({
        date_debut: dDebut,
        date_fin: toISODate(dFin),
        date_limite_dispo: toISODate(dLimite)
      });
      curseur.setDate(curseur.getDate() + 7);
    }

    if (semainesAGenerer.length === 0) {
      pmsg.textContent = 'Aucune semaine complète dans cette période.'; pmsg.className = 'msg err'; return;
    }

    await withLoading(e.currentTarget, 'Génération…', async () => {
      let crees = 0, ignorees = 0, echecs = 0;
      const creees = [];
      for (const sem of semainesAGenerer) {
        if (datesExistantes.has(sem.date_debut)) { ignorees++; continue; }
        const { data: creee, error } = await sb.from('semaines').insert(sem).select().maybeSingle();
        if (error) { if (error.code === '23505') ignorees++; else echecs++; continue; }
        crees++;
        if (creee) creees.push(creee);
      }
      // Prévient les agents éligibles pour chacune des nouvelles semaines
      // (réutilise la relance existante, comme pour la création simple).
      let totalEmails = 0;
      for (const sem of creees) {
        const resultat = await relancerNonRepondants(sem);
        totalEmails += (resultat && resultat.envoyes) || 0;
      }
      let resume = crees + ' semaine(s) créée(s)';
      if (ignorees > 0) resume += ', ' + ignorees + ' déjà existante(s) ignorée(s)';
      if (echecs > 0) resume += ', ' + echecs + ' échec(s)';
      if (totalEmails > 0) resume += ' — ' + totalEmails + ' email(s) envoyé(s)';
      showToast(resume + '.', echecs > 0 ? 'error' : 'success');
      renderView();
    });
  });

  view.querySelectorAll('[data-role=suppr]').forEach(btn => {
    btn.addEventListener('click', async (e) => {
      const semaine = (semainesToutes||[]).find(s => s.id === btn.dataset.id);
      const detail = semaine ? weekLabel(semaine).toLowerCase() : 'cette semaine';
      const avertPubliee = semaine && semaine.statut === 'publiee' ? '\n\n⚠ Cette semaine est déjà publiée et visible des agents.' : '';
      if (!confirm('Supprimer la ' + detail + ' ?\n\nToutes ses données associées (disponibilités, planning, échanges) seront perdues définitivement.' + avertPubliee)) return;
      await withLoading(e.currentTarget, 'Suppression…', async () => {
        const { error } = await sb.from('semaines').delete().eq('id', btn.dataset.id);
        if (error) { showToast('Erreur : ' + error.message, 'error'); return; }
        showToast('Semaine supprimée.', 'success');
        renderView();
      });
    });
  });

  view.querySelectorAll('[data-role=relancer]').forEach(btn => {
    btn.addEventListener('click', async (e) => {
      const semaineId = btn.dataset.id;
      const semaine = (semainesToutes||[]).find(s => s.id === semaineId);
      await withLoading(e.currentTarget, 'Envoi…', async () => {
        const resultat = await relancerNonRepondants(semaine);
        afficherResultatRelance([resultat]);
      });
    });
  });

  const btnRelancerTout = document.getElementById('btn-relancer-tout');
  if (btnRelancerTout) btnRelancerTout.addEventListener('click', async (e) => {
    const semainesOuvertes = (semainesToutes||[]).filter(s => s.statut === 'ouverte');
    await withLoading(e.currentTarget, 'Envoi…', async () => {
      const resultats = [];
      for (const semaine of semainesOuvertes) {
        resultats.push(await relancerNonRepondants(semaine));
      }
      afficherResultatRelance(resultats);
    });
  });


  // Tableau d'équité — n'inclut que les agents éligibles aux astreintes
  const agentsTous = await fetchAgents();
  const agents = agentsTous.filter(a => a.eligible_astreinte !== false && a.role !== 'lecteur');
  const { data: plannings } = await sb.from('planning').select('*');
  const counts = Object.fromEntries(agents.map(a => [a.id, 0]));
  (plannings||[]).forEach(p => { if (counts[p.agent_id] !== undefined) counts[p.agent_id]++; });
  const valeurs = Object.values(counts);
  const ecart = valeurs.length ? Math.max(...valeurs) - Math.min(...valeurs) : 0;
  const rows = agents.slice().sort((a,b) => counts[a.id]-counts[b.id])
    .map(a => `<tr><td>${escapeHTML(a.nom)}</td><td>${counts[a.id]}</td></tr>`).join('');
  document.getElementById('balance').innerHTML =
    `<div class="week-sub" style="margin-bottom:8px;">Écart actuel : ${ecart} astreinte${ecart>1?'s':''}</div>` +
    `<table class="balance"><tr><th>Agent</th><th>Astreintes</th></tr>${rows}</table>`;
}

// =========================================================
// VUE ADMIN : ÉCHANGES — vue d'ensemble
// =========================================================
async function renderEchangesAdmin(view){
  const { data: echanges, error } = await sb.from('echanges').select('*, semaines(*)').order('created_at', { ascending:false });
  if (error) { view.innerHTML = '<div class="card"><div class="empty">Erreur de chargement des échanges.</div></div>'; return; }
  const { data: remplacements } = await sb.from('remplacements_jour').select('*, semaines(*)').order('created_at', { ascending:false });
  const agents = await fetchAgentsAvecInactifs();
  const agentById = Object.fromEntries(agents.map(a => [a.id, a]));

  const echangesHTML = (!echanges || echanges.length === 0)
    ? '<div class="empty">Aucune demande d\'échange.</div>'
    : echanges.map(e => {
    const demandeur = agentById[e.agent_demandeur_id] || { nom: 'Agent inconnu' };
    const cibleLabel = e.agent_cible_id ? escapeHTML((agentById[e.agent_cible_id] || { nom: 'Agent inconnu' }).nom) : (e.statut === 'attente' ? 'ouvert à tous' : 'annulée par le demandeur');
    const statutPill = e.statut === 'attente' ? 'partiel' : (e.statut === 'acceptee' ? 'oui' : 'non');
    const traite = e.date_traitement ? ` · traité le ${escapeHTML(formatDateFR(e.date_traitement.slice(0,10)))}` : '';
    return `
    <div class="week-row">
      <div>
        <div class="week-label">${escapeHTML(weekLabel(e.semaines))}</div>
        <div class="week-sub">${escapeHTML(demandeur.nom)} → ${cibleLabel} <span class="pill ${statutPill}">${escapeHTML(e.statut)}</span>${traite}</div>
      </div>
      <button class="ghost" data-role="suppr" data-id="${escapeHTML(e.id)}">Supprimer</button>
    </div>`;
  }).join('');

  const remplacementsHTML = (!remplacements || remplacements.length === 0)
    ? '<div class="empty">Aucune demande de remplacement.</div>'
    : remplacements.map(r => {
    const demandeur = agentById[r.agent_demandeur_id] || { nom: 'Agent inconnu' };
    const cibleLabel = r.agent_remplacant_id ? escapeHTML((agentById[r.agent_remplacant_id] || { nom: 'Agent inconnu' }).nom) : (r.statut === 'attente' ? 'ouvert à tous' : 'annulée par le demandeur');
    const statutPill = r.statut === 'attente' ? 'partiel' : (r.statut === 'acceptee' ? 'oui' : 'non');
    const traite = r.date_traitement ? ` · traité le ${escapeHTML(formatDateFR(r.date_traitement.slice(0,10)))}` : '';
    return `
    <div class="week-row">
      <div>
        <div class="week-label">${escapeHTML(formatDateFR(r.date))} <span class="week-sub" style="font-weight:normal;">(${escapeHTML(weekLabel(r.semaines))})</span></div>
        <div class="week-sub">${escapeHTML(demandeur.nom)} → ${cibleLabel} <span class="pill ${statutPill}">${escapeHTML(r.statut)}</span>${traite}</div>
      </div>
      <button class="ghost" data-role="suppr-r" data-id="${escapeHTML(r.id)}">Supprimer</button>
    </div>`;
  }).join('');

  view.innerHTML = `<div class="card"><h3>Toutes les demandes d'échange (semaine complète)</h3>${echangesHTML}</div>` +
    `<div class="card"><h3>Tous les remplacements d'un jour</h3>${remplacementsHTML}</div>`;

  view.querySelectorAll('[data-role=suppr]').forEach(btn => {
    btn.addEventListener('click', async (e) => {
      if (!confirm('Supprimer cette demande d\'échange ?')) return;
      await withLoading(e.currentTarget, 'Suppression…', async () => {
        const { error } = await sb.from('echanges').delete().eq('id', btn.dataset.id);
        if (error) { showToast('Erreur : ' + error.message, 'error'); return; }
        showToast('Demande supprimée.', 'success');
        renderView();
      });
    });
  });

  view.querySelectorAll('[data-role=suppr-r]').forEach(btn => {
    btn.addEventListener('click', async (e) => {
      if (!confirm('Supprimer cette demande de remplacement ?')) return;
      await withLoading(e.currentTarget, 'Suppression…', async () => {
        const { error } = await sb.from('remplacements_jour').delete().eq('id', btn.dataset.id);
        if (error) { showToast('Erreur : ' + error.message, 'error'); return; }
        showToast('Demande supprimée.', 'success');
        renderView();
      });
    });
  });
}

// =========================================================
// VUE ADMIN : AGENTS — coordonnées, rôle, activation
// L'email n'a pas besoin d'être "changé" côté authentification :
// la connexion associe automatiquement l'identité à l'email saisi
// lors du lien magique. Il suffit de mettre à jour l'annuaire ici ;
// la personne se reconnecte ensuite avec sa nouvelle adresse.
// =========================================================
// =========================================================
// VUE : ÉVÉNEMENTS (mariages, baptêmes...) — gestion réservée à
// l'admin et aux agents autorisés (ex. secrétariat de mairie).
// L'affichage aux autres se fait directement sur le Planning
// (calendrier et liste), pas ici : cet onglet ne sert qu'à créer,
// consulter en détail et supprimer.
// =========================================================
async function renderEvenementsGestion(view){
  const { data: evenements, error } = await sb.from('evenements').select('*').order('date');
  if (error) { view.innerHTML = '<div class="card"><div class="empty">Erreur de chargement des événements.</div></div>'; return; }
  const { data: liens } = await sb.from('evenements_agents').select('*');
  const { data: reponses } = await sb.from('evenements_reponses').select('*');
  const agentsTous = await fetchAgentsAvecInactifs();
  const agentById = Object.fromEntries(agentsTous.map(a => [a.id, a]));
  // Seuls les élus/agents actifs sont proposés comme participants — jamais
  // un compte désactivé (cohérent avec le reste de l'appli : un compte
  // désactivé ne doit plus pouvoir être désigné pour quoi que ce soit de
  // nouveau, mais reste résolu par son nom dans l'historique existant).
  const elus = agentsTous.filter(a => a.role !== 'lecteur' && a.actif && a.categorie !== 'communal');

  const today = toISODate(new Date());
  const evenementsToutes = (evenements||[]).map(ev => {
    const agentsIds = (liens||[]).filter(l => l.evenement_id === ev.id).map(l => l.agent_id);
    const reponsesEv = (reponses||[]).filter(r => r.evenement_id === ev.id);
    const presents = reponsesEv.filter(r => r.reponse === 'present').length;
    const absents = reponsesEv.filter(r => r.reponse === 'absent').length;
    return { ...ev, agentsIds, presents, absents, enAttente: Math.max(agentsIds.length - presents - absents, 0) };
  });
  const evenementById = Object.fromEntries(evenementsToutes.map(ev => [ev.id, ev]));
  const passes = evenementsToutes.filter(ev => ev.date < today);
  const aVenir = evenementsToutes.filter(ev => ev.date >= today);

  function ligneEvenement(ev){
    const noms = ev.agentsIds.map(id => (agentById[id]||{nom:'Agent inconnu'}).nom);
    const couleur = typeEvenementCouleur(ev.type);
    return `
      <div class="week-row">
        <div>
          <div class="week-label">
            ${typeApporteInfo(ev.type, ev.intitule) ? `<span class="pill" style="background:${couleur};color:var(--white);">${escapeHTML(typeEvenementLabel(ev.type))}</span>` : ''}
            ${escapeHTML(formatDateFR(ev.date))}${ev.heure ? ' à ' + escapeHTML(ev.heure) : ''}${ev.heure_fin ? '–' + escapeHTML(ev.heure_fin) : ''} — ${escapeHTML(ev.intitule)}
          </div>
          <div class="week-sub">${noms.length ? participantsResumeHTML(noms, '') : 'Aucun participant désigné'}</div>
          ${ev.lieu ? `<div class="week-sub">${escapeHTML(ev.lieu)}</div>` : ''}
          ${ev.description ? `<div class="week-sub" style="margin-top:2px;">${escapeHTML(ev.description)}</div>` : ''}
          ${ev.publie_reponses ? `<div class="week-sub" style="margin-top:2px;">Publié pour réponses — ${ev.presents} présent(s) · ${ev.absents} absent(s) · ${ev.enAttente} en attente</div>` : ''}
        </div>
        <div style="display:flex;gap:6px;flex-wrap:wrap;">
          <button class="ghost" data-role="modifier-evenement" data-id="${escapeHTML(ev.id)}">Modifier</button>
          <button class="ghost" data-role="suppr-evenement" data-id="${escapeHTML(ev.id)}">Supprimer</button>
        </div>
      </div>`;
  }

  view.innerHTML = `
    <div class="card">
      <h3>Nouvel événement</h3>
      <div class="week-sub" style="margin-bottom:10px;">Pour un baptême/mariage, n'enregistrez que l'intitulé et les élus qui officient — aucun nom de particulier ici : l'identité des personnes reste dans le registre d'état civil de la mairie.</div>
      <div style="display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;">
        <div><div class="week-sub">Type</div><select id="ev-type">${optionsTypesEvenementHTML('autre')}</select></div>
        <div><div class="week-sub">Date</div><input type="date" id="ev-date"></div>
        <div><div class="week-sub">Heure début (facultatif)</div><input type="text" id="ev-heure" placeholder="14h30" style="width:90px;"></div>
        <div><div class="week-sub">Heure fin (facultatif)</div><input type="text" id="ev-heure-fin" placeholder="16h00" style="width:90px;"></div>
      </div>
      <div style="display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;margin-top:10px;">
        <div style="flex:1;min-width:160px;"><div class="week-sub">Intitulé</div><input type="text" id="ev-intitule" list="ev-suggestions" placeholder="Conseil municipal, Baptême…" style="width:100%;">
          <datalist id="ev-suggestions"><option value="Mariage"><option value="Baptême"><option value="PACS"><option value="Conseil municipal"></datalist>
        </div>
        <div style="flex:1;min-width:160px;"><div class="week-sub">Lieu (facultatif)</div><input type="text" id="ev-lieu" placeholder="Salle des mariages" style="width:100%;"></div>
      </div>
      <div style="margin-top:10px;"><div class="week-sub">Description (facultatif)</div><textarea id="ev-description" style="width:100%;min-height:56px;"></textarea></div>
      <div style="margin-top:10px;">
        <div class="week-sub">Participants</div>
        ${participantsChecklistHTML(elus, [], 'ev-part')}
      </div>
      ${publieReponsesToggleHTML('ev-publie-reponses', 'autre', false)}
      <button class="primary" id="btn-ev-ajouter" style="margin-top:10px;">Ajouter</button>
      <div class="msg" id="ev-msg"></div>
    </div>
    <div class="card"><h3>À venir</h3>${aVenir.length ? aVenir.map(ligneEvenement).join('') : '<div class="empty">Aucun événement à venir.</div>'}</div>
    ${passes.length ? `
      <div style="padding:10px 0;">
        <button class="ghost" id="btn-toggle-evenements-passes">${state.showEvenementsPasses ? 'Masquer les événements passés' : 'Afficher les événements passés (' + passes.length + ')'}</button>
      </div>
      ${state.showEvenementsPasses ? `<div class="card">${passes.map(ligneEvenement).join('')}</div>` : ''}
    ` : ''}
  `;

  brancherParticipantsChecklist('ev-part');
  brancherPublieReponsesToggle('ev-publie-reponses', 'ev-type');

  const btnToggle = document.getElementById('btn-toggle-evenements-passes');
  if (btnToggle) btnToggle.addEventListener('click', () => { state.showEvenementsPasses = !state.showEvenementsPasses; renderView(); });

  document.getElementById('btn-ev-ajouter').addEventListener('click', async (e) => {
    const type = document.getElementById('ev-type').value;
    const date = document.getElementById('ev-date').value;
    const heure = document.getElementById('ev-heure').value.trim();
    const heure_fin = document.getElementById('ev-heure-fin').value.trim();
    const intitule = document.getElementById('ev-intitule').value.trim();
    const lieu = document.getElementById('ev-lieu').value.trim();
    const description = document.getElementById('ev-description').value.trim();
    const participantsIds = participantsSelectionnes('ev-part');
    const publieReponses = TYPES_PUBLICATION_REPONSES.includes(type) && document.getElementById('ev-publie-reponses').checked;
    const msg = document.getElementById('ev-msg');
    msg.textContent = ''; msg.className = 'msg';

    if (!date || !intitule) { msg.textContent = 'La date et l\'intitulé sont obligatoires.'; msg.className = 'msg err'; return; }

    await withLoading(e.currentTarget, 'Ajout…', async () => {
      const { data: inserted, error: errEv } = await sb.from('evenements')
        .insert({ type, date, heure: heure || null, heure_fin: heure_fin || null, intitule, lieu: lieu || null, description: description || null, publie_reponses: publieReponses, created_by: state.agent.id })
        .select().maybeSingle();
      if (errEv) { msg.textContent = 'Erreur : ' + errEv.message; msg.className = 'msg err'; return; }

      if (participantsIds.length) {
        const { error: errLiens } = await sb.from('evenements_agents')
          .insert(participantsIds.map(agent_id => ({ evenement_id: inserted.id, agent_id })));
        if (errLiens) { msg.textContent = 'Événement créé, mais erreur sur les participants : ' + errLiens.message; msg.className = 'msg err'; return; }
      }

      // Prévient par email chaque participant désigné (best-effort : un
      // échec d'envoi n'annule pas la création, déjà actée en base).
      const agentsPourEmail = participantsIds.map(id => agentById[id]).filter(a => a && a.email);
      const resultatsEmail = await Promise.all(agentsPourEmail.map(a => sendEvenementEmail(a, inserted)));
      const envoyes = resultatsEmail.filter(r => r.ok).length;

      showToast('Événement ajouté.' + (envoyes ? ' ' + envoyes + ' email(s) envoyé(s).' : ''), 'success');
      renderView();
    });
  });

  view.querySelectorAll('[data-role=modifier-evenement]').forEach(btn => {
    btn.addEventListener('click', () => {
      const ev = evenementById[btn.dataset.id];
      if (ev) ouvrirModaleEvenement(ev, elus);
    });
  });

  view.querySelectorAll('[data-role=suppr-evenement]').forEach(btn => {
    btn.addEventListener('click', async (e) => {
      if (!confirm('Supprimer cet événement ?')) return;
      await withLoading(e.currentTarget, 'Suppression…', async () => {
        const { error } = await sb.from('evenements').delete().eq('id', btn.dataset.id);
        if (error) { showToast('Erreur : ' + error.message, 'error'); return; }
        showToast('Événement supprimé.', 'success');
        renderView();
      });
    });
  });
}

// Liste de participants à cases à cocher, réutilisée pour la création et
// la modification d'un événement. `prefix` doit être unique dans la page
// (utilisé pour construire les ids DOM et retrouver la sélection).
function participantsChecklistHTML(elus, selectedIds, prefix){
  return `
    <div class="participants-actions">
      <button type="button" class="ghost" id="${prefix}-tout">Sélectionner tous</button>
      <button type="button" class="ghost" id="${prefix}-aucun">Désélectionner tous</button>
    </div>
    <div class="participants-liste" id="${prefix}-liste">
      ${elus.length ? elus.map(a => `<label><input type="checkbox" value="${escapeHTML(a.id)}" ${selectedIds.includes(a.id) ? 'checked' : ''}> ${escapeHTML(a.nom)}</label>`).join('') : '<div class="empty" style="padding:4px 0;">Aucun élu/agent disponible.</div>'}
    </div>`;
}
function brancherParticipantsChecklist(prefix){
  const liste = document.getElementById(prefix + '-liste');
  const btnTout = document.getElementById(prefix + '-tout');
  const btnAucun = document.getElementById(prefix + '-aucun');
  if (btnTout) btnTout.addEventListener('click', () => { liste.querySelectorAll('input[type=checkbox]').forEach(cb => cb.checked = true); });
  if (btnAucun) btnAucun.addEventListener('click', () => { liste.querySelectorAll('input[type=checkbox]').forEach(cb => cb.checked = false); });
}
function participantsSelectionnes(prefix){
  const liste = document.getElementById(prefix + '-liste');
  return Array.from(liste.querySelectorAll('input[type=checkbox]:checked')).map(cb => cb.value);
}

// Modification d'un événement existant : mêmes champs qu'à la création,
// pré-remplis, et les participants déjà désignés pré-cochés. Ne renvoie
// aucun email (la création en envoie déjà un ; ne pas en ajouter ici
// évite de spammer à chaque correction mineure).
function ouvrirModaleEvenement(ev, elus){
  openModal(`
    <h3>Modifier l'événement</h3>
    <div style="display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;">
      <div><div class="week-sub">Type</div><select id="modal-ev-type">${optionsTypesEvenementHTML(ev.type)}</select></div>
      <div><div class="week-sub">Date</div><input type="date" id="modal-ev-date" value="${escapeHTML(ev.date)}"></div>
    </div>
    <div style="display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;margin-top:10px;">
      <div><div class="week-sub">Heure début (facultatif)</div><input type="text" id="modal-ev-heure" value="${escapeHTML(ev.heure || '')}" placeholder="14h30" style="width:90px;"></div>
      <div><div class="week-sub">Heure fin (facultatif)</div><input type="text" id="modal-ev-heure-fin" value="${escapeHTML(ev.heure_fin || '')}" placeholder="16h00" style="width:90px;"></div>
    </div>
    <div style="margin-top:10px;"><div class="week-sub">Intitulé</div><input type="text" id="modal-ev-intitule" value="${escapeHTML(ev.intitule)}" style="width:100%;"></div>
    <div style="margin-top:10px;"><div class="week-sub">Lieu (facultatif)</div><input type="text" id="modal-ev-lieu" value="${escapeHTML(ev.lieu || '')}" style="width:100%;"></div>
    <div style="margin-top:10px;"><div class="week-sub">Description (facultatif)</div><textarea id="modal-ev-description" style="width:100%;min-height:56px;">${escapeHTML(ev.description || '')}</textarea></div>
    <div style="margin-top:10px;">
      <div class="week-sub">Participants</div>
      ${participantsChecklistHTML(elus, ev.agentsIds, 'modal-ev-part')}
    </div>
    ${publieReponsesToggleHTML('modal-ev-publie-reponses', ev.type, ev.publie_reponses)}
    <div class="msg" id="modal-msg"></div>
    <div class="modal-actions">
      <button class="ghost" id="modal-cancel">Annuler</button>
      <button class="primary" id="modal-confirm">Enregistrer</button>
    </div>
  `);
  brancherParticipantsChecklist('modal-ev-part');
  brancherPublieReponsesToggle('modal-ev-publie-reponses', 'modal-ev-type');
  document.getElementById('modal-cancel').addEventListener('click', closeModal);
  document.getElementById('modal-confirm').addEventListener('click', async (e) => {
    const type = document.getElementById('modal-ev-type').value;
    const date = document.getElementById('modal-ev-date').value;
    const heure = document.getElementById('modal-ev-heure').value.trim();
    const heure_fin = document.getElementById('modal-ev-heure-fin').value.trim();
    const intitule = document.getElementById('modal-ev-intitule').value.trim();
    const lieu = document.getElementById('modal-ev-lieu').value.trim();
    const description = document.getElementById('modal-ev-description').value.trim();
    const participantsIds = participantsSelectionnes('modal-ev-part');
    const publieReponses = TYPES_PUBLICATION_REPONSES.includes(type) && document.getElementById('modal-ev-publie-reponses').checked;
    const mmsg = document.getElementById('modal-msg');
    mmsg.textContent = ''; mmsg.className = 'msg';
    if (!date || !intitule) { mmsg.textContent = 'La date et l\'intitulé sont obligatoires.'; mmsg.className = 'msg err'; return; }

    await withLoading(e.currentTarget, 'Enregistrement…', async () => {
      const { error: errMaj } = await sb.from('evenements').update({
        type, date, heure: heure || null, heure_fin: heure_fin || null, intitule, lieu: lieu || null, description: description || null, publie_reponses: publieReponses
      }).eq('id', ev.id);
      if (errMaj) { mmsg.textContent = 'Erreur : ' + errMaj.message; mmsg.className = 'msg err'; return; }

      // Resynchronise les participants : on retire les anciens liens puis
      // on réinsère la sélection actuelle — plus simple et fiable qu'un
      // diff, pour une liste de cette taille.
      const { error: errDel } = await sb.from('evenements_agents').delete().eq('evenement_id', ev.id);
      if (errDel) { mmsg.textContent = 'Événement mis à jour, mais erreur sur les participants : ' + errDel.message; mmsg.className = 'msg err'; return; }
      if (participantsIds.length) {
        const { error: errIns } = await sb.from('evenements_agents').insert(participantsIds.map(agent_id => ({ evenement_id: ev.id, agent_id })));
        if (errIns) { mmsg.textContent = 'Événement mis à jour, mais erreur sur les participants : ' + errIns.message; mmsg.className = 'msg err'; return; }
      }

      closeModal();
      showToast('Événement modifié.', 'success');
      renderView();
    });
  });
}

// =========================================================
// TABLEAU DE BORD (admin uniquement)
// N'agrège que des données déjà entièrement lisibles par l'admin via
// les RLS existantes (agents, semaines, planning, disponibilites,
// echanges, remplacements_jour) — aucune nouvelle permission, aucun
// nouveau calcul de sécurité côté client : c'est une présentation,
// pas un nouveau canal d'accès aux données.
// =========================================================
async function renderDashboardAdmin(view){
  const today = toISODate(new Date());
  const dansSeptJours = new Date(); dansSeptJours.setDate(dansSeptJours.getDate() + 7);
  const seuilProche = toISODate(dansSeptJours);

  const [
    { data: agentsTousRaw, error: errAgents },
    { data: semainesToutesRaw, error: errSemaines },
    { data: planningToutes, error: errPlanning },
    { data: disposToutes, error: errDispos },
    { data: echangesAttente, error: errEchanges },
    { data: remplacementsAttente, error: errRemplacements }
  ] = await Promise.all([
    sb.from('agents').select('*'),
    sb.from('semaines').select('*').order('date_debut'),
    sb.from('planning').select('*'),
    sb.from('disponibilites').select('*'),
    sb.from('echanges').select('*, semaines(*)').eq('statut','attente'),
    sb.from('remplacements_jour').select('*, semaines(*)').eq('statut','attente')
  ]);

  if (errAgents || errSemaines || errPlanning || errDispos || errEchanges || errRemplacements) {
    view.innerHTML = '<div class="card"><div class="empty">Erreur de chargement du tableau de bord.</div><div style="margin-top:10px;"><button class="ghost" id="dash-retry">Réessayer</button></div></div>';
    const retry = document.getElementById('dash-retry');
    if (retry) retry.addEventListener('click', () => renderView());
    return;
  }

  const agentById = Object.fromEntries((agentsTousRaw||[]).map(a => [a.id, a]));
  const eligibles = (agentsTousRaw||[]).filter(a => a.actif && a.role !== 'lecteur' && a.eligible_astreinte !== false);
  const planByWeek = Object.fromEntries((planningToutes||[]).map(p => [p.semaine_id, p]));
  const dispoBySemaine = {};
  (disposToutes||[]).forEach(d => { (dispoBySemaine[d.semaine_id] ||= []).push(d); });

  const semainesFutures = (semainesToutesRaw||[]).filter(s => s.date_fin >= today).sort((a,b) => a.date_debut < b.date_debut ? -1 : 1);
  const semainesPublieesFutures = semainesFutures.filter(s => s.statut === 'publiee');
  const semainesNonPublieesFutures = semainesFutures.filter(s => s.statut !== 'publiee');

  // Prochaine semaine encore ouverte à la déclaration, pour le suivi des réponses
  const prochaineOuverte = semainesFutures
    .filter(s => s.statut === 'ouverte')
    .sort((a,b) => a.date_limite_dispo < b.date_limite_dispo ? -1 : 1)[0] || null;
  const reponduIds = new Set(prochaineOuverte ? (dispoBySemaine[prochaineOuverte.id]||[]).map(d => d.agent_id) : []);
  const nonRepondants = prochaineOuverte ? eligibles.filter(a => !reponduIds.has(a.id)) : [];

  // Anomalie 1 : agent affecté alors que déclaré indisponible pour cette semaine
  const anomaliesIndispo = [];
  semainesFutures.forEach(s => {
    const p = planByWeek[s.id];
    if (!p) return;
    const dispo = (dispoBySemaine[s.id]||[]).find(d => d.agent_id === p.agent_id);
    if (dispo && dispo.niveau === 'non') anomaliesIndispo.push({ semaine: s, agent: agentById[p.agent_id] });
  });

  // Anomalie 2 : deux semaines consécutives (7 jours d'écart) pour le même agent
  const semainesAffectees = semainesFutures.filter(s => planByWeek[s.id]);
  const anomaliesConsecutives = [];
  for (let i = 0; i < semainesAffectees.length - 1; i++) {
    const a = semainesAffectees[i], b = semainesAffectees[i+1];
    const pa = planByWeek[a.id], pb = planByWeek[b.id];
    if (pa.agent_id === pb.agent_id) {
      const diffJours = Math.round((new Date(b.date_debut+'T00:00:00') - new Date(a.date_debut+'T00:00:00')) / 86400000);
      if (diffJours === 7) anomaliesConsecutives.push({ semaineA: a, semaineB: b, agent: agentById[pa.agent_id] });
    }
  }
  const totalAnomalies = anomaliesIndispo.length + anomaliesConsecutives.length;
  const semainesUrgentes = semainesNonPublieesFutures.filter(s => s.date_debut <= seuilProche);

  // État global
  let etatClasse = 'vert', etatLabel = '🟢 Planning à jour';
  const actionsNecessaires = semainesNonPublieesFutures.length + nonRepondants.length + (echangesAttente||[]).length + (remplacementsAttente||[]).length;
  if (totalAnomalies > 0 || semainesUrgentes.length > 0) {
    etatClasse = 'rouge';
    etatLabel = '🔴 ' + (totalAnomalies + semainesUrgentes.length) + ' problème(s) nécessite(nt) votre attention';
  } else if (actionsNecessaires > 0) {
    etatClasse = 'orange';
    etatLabel = '🟠 ' + actionsNecessaires + ' action(s) nécessaire(s)';
  }

  function carte(nombre, label){
    return `<div class="dash-card"><div class="dash-nombre">${escapeHTML(String(nombre))}</div><div class="dash-label">${escapeHTML(label)}</div></div>`;
  }

  const cartesHTML = `<div class="dash-cards">` +
    carte(semainesFutures.length, 'Semaines à venir') +
    carte(semainesPublieesFutures.length, 'Semaines publiées') +
    carte(semainesNonPublieesFutures.length, 'Semaines sans planning') +
    (prochaineOuverte ? carte(reponduIds.size + ' / ' + eligibles.length, 'Réponses reçues') : '') +
    carte(nonRepondants.length, 'Agents à relancer') +
    carte(totalAnomalies, 'Anomalies') +
    carte((echangesAttente||[]).length, 'Échanges en attente') +
    carte((remplacementsAttente||[]).length, 'Remplacements en attente') +
    `</div>`;

  let aTraiterItems = '';
  semainesUrgentes.forEach(s => {
    aTraiterItems += `<div class="dash-item">
      <div><strong>🔴 ${escapeHTML(weekLabel(s))}</strong><div class="week-sub">Planning non publié, dans moins de 7 jours.</div></div>
      <button class="ghost" data-dash-semaine="${escapeHTML(s.id)}">Voir la semaine</button>
    </div>`;
  });
  const autresNonPubliees = semainesNonPublieesFutures.filter(s => !semainesUrgentes.includes(s));
  if (autresNonPubliees.length > 0) {
    aTraiterItems += `<div class="dash-item">
      <div><strong>🟠 ${autresNonPubliees.length} semaine(s) à venir non publiée(s)</strong><div class="week-sub">Pas encore urgent, mais à préparer.</div></div>
      <button class="ghost" data-dash-tab="admin-semaines">Voir les semaines</button>
    </div>`;
  }
  if (nonRepondants.length > 0 && prochaineOuverte) {
    aTraiterItems += `<div class="dash-item">
      <div><strong>🟠 ${nonRepondants.length} agent(s) n'ont pas répondu</strong><div class="week-sub">${escapeHTML(weekLabel(prochaineOuverte))}</div></div>
      <button class="ghost" data-dash-relancer="${escapeHTML(prochaineOuverte.id)}">Relancer</button>
    </div>`;
  }
  (echangesAttente||[]).forEach(e => {
    const demandeur = agentById[e.agent_demandeur_id];
    const cible = e.agent_cible_id ? agentById[e.agent_cible_id] : null;
    aTraiterItems += `<div class="dash-item">
      <div><strong>🔄 Échange — ${escapeHTML(weekLabel(e.semaines))}</strong><div class="week-sub">${escapeHTML(demandeur?demandeur.nom:'Agent inconnu')} → ${cible?escapeHTML(cible.nom):'ouvert à tous'}</div></div>
      <button class="ghost" data-dash-tab="admin-echanges">Examiner</button>
    </div>`;
  });
  (remplacementsAttente||[]).forEach(r => {
    const demandeur = agentById[r.agent_demandeur_id];
    const cible = r.agent_remplacant_id ? agentById[r.agent_remplacant_id] : null;
    aTraiterItems += `<div class="dash-item">
      <div><strong>🔁 Remplacement — ${escapeHTML(formatDateFR(r.date))}</strong><div class="week-sub">${escapeHTML(demandeur?demandeur.nom:'Agent inconnu')} → ${cible?escapeHTML(cible.nom):'ouvert à tous'} (${escapeHTML(weekLabel(r.semaines))})</div></div>
      <button class="ghost" data-dash-tab="admin-echanges">Examiner</button>
    </div>`;
  });
  const aTraiterHTML = `<div class="card"><h3>⚠️ À traiter</h3>${aTraiterItems || '<div class="empty">Rien à traiter pour le moment.</div>'}</div>`;

  let anomaliesItems = '';
  anomaliesIndispo.forEach(a => {
    anomaliesItems += `<div class="dash-item">
      <div><strong>🔴 ${escapeHTML(a.agent ? a.agent.nom : 'Agent inconnu')}</strong><div class="week-sub">Affecté ${escapeHTML(weekLabel(a.semaine).toLowerCase())} alors qu'il/elle est déclaré(e) indisponible.</div></div>
      <button class="ghost" data-dash-semaine="${escapeHTML(a.semaine.id)}">Voir</button>
    </div>`;
  });
  anomaliesConsecutives.forEach(c => {
    anomaliesItems += `<div class="dash-item">
      <div><strong>🟠 ${escapeHTML(c.agent ? c.agent.nom : 'Agent inconnu')}</strong><div class="week-sub">Astreintes consécutives : ${escapeHTML(weekLabel(c.semaineA).toLowerCase())} et ${escapeHTML(weekLabel(c.semaineB).toLowerCase())}.</div></div>
      <button class="ghost" data-dash-semaine="${escapeHTML(c.semaineA.id)}">Voir</button>
    </div>`;
  });
  const anomaliesHTML = `<div class="card"><h3>⚠️ Anomalies</h3>${anomaliesItems || '<div class="empty">Aucune anomalie détectée.</div>'}</div>`;

  const prochainesAstreintes = semainesPublieesFutures.slice(0, 4);
  const prochainesHTML = prochainesAstreintes.length ? `<div class="card"><h3>📅 Prochaines astreintes</h3>` +
    prochainesAstreintes.map((s,i) => {
      const p = planByWeek[s.id];
      const agent = p ? agentById[p.agent_id] : null;
      const label = i === 0 ? 'Cette semaine' : (i === 1 ? 'Semaine prochaine' : weekLabel(s));
      const telHref = agent && agent.telephone ? agent.telephone.replace(/[^\d+]/g,'') : '';
      return `<div class="dash-item">
        <div><div class="week-sub">${escapeHTML(label)}</div><strong>${agent ? '👤 ' + escapeHTML(agent.nom) : 'Non assigné'}</strong>
        ${agent && agent.telephone ? `<div class="week-sub">📞 <a href="tel:${escapeHTML(telHref)}">${escapeHTML(agent.telephone)}</a></div>` : ''}</div>
        <button class="ghost" data-dash-semaine="${escapeHTML(s.id)}">Voir</button>
      </div>`;
    }).join('') + `</div>` : '';

  view.innerHTML = `
    <div class="card">
      <div style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;">
        <h3 style="margin:0;">Tableau de bord</h3>
        <div style="display:flex;gap:8px;flex-wrap:wrap;">
          <button class="ghost" id="dash-qed">👥 Qui est disponible ?</button>
          <button class="ghost" id="dash-refresh">↻ Actualiser</button>
        </div>
      </div>
      <div class="dash-etat ${etatClasse}" style="margin-top:10px;">${etatLabel}</div>
    </div>
    <div class="card">${cartesHTML}</div>
    ${aTraiterHTML}
    ${anomaliesHTML}
    ${prochainesHTML}
  `;

  document.getElementById('dash-refresh').addEventListener('click', () => renderView());
  document.getElementById('dash-qed').addEventListener('click', () => ouvrirQuiEstDisponible());

  // Vérification des semaines à 15 jours non publiées, en tâche de fond
  // (n'attend pas la réponse, ne bloque jamais l'affichage du tableau de bord).
  verifierAlertesNonPrises(semainesFutures);
  // Idem pour les événements ayant lieu dans moins de 24h.
  verifierRappelsEvenements();
  // Idem pour les astreintes publiées débutant dans moins de 48h.
  verifierRappelsAstreinte();

  view.querySelectorAll('[data-dash-semaine]').forEach(btn => {
    btn.addEventListener('click', () => {
      state.tab = 'admin-planning';
      state.planningVue = 'liste';
      state.highlight = { type: 'semaine', id: btn.dataset.dashSemaine };
      renderTabs(); renderView();
    });
  });
  view.querySelectorAll('[data-dash-tab]').forEach(btn => {
    btn.addEventListener('click', () => {
      state.tab = btn.dataset.dashTab;
      renderTabs(); renderView();
    });
  });
  const btnRelancer = view.querySelector('[data-dash-relancer]');
  if (btnRelancer) btnRelancer.addEventListener('click', async (e) => {
    const semaine = semainesFutures.find(s => s.id === btnRelancer.dataset.dashRelancer);
    if (!semaine) return;
    await withLoading(e.currentTarget, 'Envoi…', async () => {
      const resultat = await relancerNonRepondants(semaine);
      afficherResultatRelance([resultat]);
      renderView();
    });
  });
}

          eligible_astreinte: false, peut_gerer_evenements: false, droit_planning_agents: 'aucun'

      });
      return;
    }

    if (!nom || !email) { nmsg.textContent = 'Le nom et l\'email sont obligatoires.'; nmsg.className = 'msg err'; return; }

    await withLoading(e.currentTarget, 'Création…', async () => {
      // Un lecteur n'a pas vocation à faire des astreintes : on l'exempte par défaut.
      const eligible_astreinte = role !== 'lecteur';
      const { error } = await sb.from('agents').insert({ nom, email, telephone: telephone || null, role, actif: true, eligible_astreinte, categorie: 'elu' });
      if (error) {
        if (error.code === '23505') nmsg.textContent = 'Cet email est déjà utilisé par un autre agent.';
        else if (error.code === '23514') nmsg.textContent = 'Adresse email invalide.';
        else nmsg.textContent = 'Erreur : ' + error.message;

      }
      showToast('Agent créé.', 'success');
      renderView();
    });
  });

  view.querySelectorAll('[data-agent]').forEach(card => {
    const original = (agents||[]).find(a => a.id === card.dataset.agent);
    card.querySelector('[data-role=save]').addEventListener('click', async (e) => {

      const telephone = card.querySelector('[data-role=telephone]').value.trim();

        const actif = card.querySelector('[data-role=actif]').value === 'true';

      const role = card.querySelector('[data-role=role]').value;
      const actif = card.querySelector('[data-role=actif]').value === 'true';
